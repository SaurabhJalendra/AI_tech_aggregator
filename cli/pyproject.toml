[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-advisor-cli"
version = "0.1.0"
description = "CLI for the AI Infrastructure Advisor"
requires-python = ">=3.10"
dependencies = ["ai-advisor-sdk>=0.1.0"]

[project.scripts]
ai-advisor = "ai_advisor_cli.main:main"
