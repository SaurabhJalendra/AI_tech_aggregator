services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai_advisor_db
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor_dev_password
      POSTGRES_DB: ai_advisor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor -d ai_advisor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_advisor_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
