name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: advisor_dev_password
          POSTGRES_DB: ai_advisor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advisor -d ai_advisor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://advisor:advisor_dev_password@localhost:5432/ai_advisor
          DATABASE_URL_SYNC: postgresql://advisor:advisor_dev_password@localhost:5432/ai_advisor
          ENVIRONMENT: test
          ANTHROPIC_API_KEY: test-key
        run: pytest -v

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

  spec-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate all YAML specs
        run: |
          python -c "
          import yaml, sys
          from pathlib import Path
          specs = list(Path('modules_registry/specs').glob('*.yaml'))
          print(f'Found {len(specs)} spec files')
          errors = 0
          for f in specs:
              try:
                  data = yaml.safe_load(f.read_text())
                  assert 'meta' in data, 'missing meta'
                  assert 'slug' in data['meta'], 'missing slug'
                  print(f'  OK: {f.name}')
              except Exception as e:
                  print(f'  FAIL: {f.name}: {e}')
                  errors += 1
          if errors:
              sys.exit(1)
          print(f'All {len(specs)} specs valid')
          "
