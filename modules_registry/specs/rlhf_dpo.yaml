knowledge:
  entries:
    - topic: "RLHF Pipeline Explained"
      content: |
        The RLHF pipeline has three stages, each with distinct requirements:

        Stage 1 - Supervised Fine-Tuning (SFT): Train the base model on high-quality
        demonstrations of desired behavior. This creates a model that can produce
        good responses but doesn't yet distinguish between good and great responses.
        Use 1000-5000 curated examples. This stage uses standard SFT training.

        Stage 2 - Reward Model Training: Train a separate model to score responses
        based on human preferences. Annotators are shown pairs of responses to the
        same prompt and asked to indicate which is better. The reward model learns
        to predict these preferences. Typically requires 10,000-50,000 preference
        pairs for robust training.

        Stage 3 - PPO Optimization: Use the reward model to provide feedback as the
        language model generates responses. PPO updates the model to produce responses
        that receive higher reward scores while maintaining a KL divergence constraint
        to prevent the model from diverging too far from the SFT model.

        Critical considerations: The reward model can be gamed (the model finds
        responses that score high on the reward model but aren't actually better).
        KL divergence regularization partially addresses this. Reward model quality
        is the single biggest factor in RLHF success -- invest heavily in annotation
        quality and reward model evaluation.
      tags: ["rlhf", "pipeline", "ppo", "architecture"]

    - topic: "DPO: The Simpler Alternative"
      content: |
        DPO (Direct Preference Optimization) achieves alignment without an explicit
        reward model or RL training loop. Key advantages:

        Simplicity: DPO treats alignment as a classification problem. Given a prompt
        and two responses (chosen and rejected), DPO directly updates the model to
        increase the probability of the chosen response relative to the rejected one.
        The loss function implicitly defines a reward model.

        Stability: DPO training is much more stable than PPO. No reward hacking, no
        KL divergence tuning, no critic model. Hyperparameter sensitivity is comparable
        to standard SFT.

        Efficiency: DPO requires only the preference dataset and the model being
        trained. No separate reward model to train and serve. Training time and
        compute are roughly 2x SFT (since it processes two responses per example).

        When to prefer DPO over RLHF: Almost always, unless you have specific
        evidence that RLHF produces meaningfully better results on your task. DPO
        is the default choice for production alignment work.

        Data format: Each training example is a triple: (prompt, chosen_response,
        rejected_response). The chosen response is what you want the model to
        produce, and the rejected response is what you want it to avoid.
      tags: ["dpo", "alignment", "simplicity"]

    - topic: "Collecting Preference Data"
      content: |
        The quality of preference data is the most important factor in alignment
        training success. Strategies for collecting effective preference data:

        Human annotation: The gold standard. Hire domain experts to compare pairs
        of model responses and select the better one. Provide clear annotation
        guidelines with examples. Inter-annotator agreement should be > 80%.
        Cost: $1-5 per preference pair depending on domain complexity.

        AI-assisted annotation: Use a stronger model (GPT-4, Claude) to generate
        initial preferences, then have humans verify a sample. This can reduce
        annotation cost by 5-10x. Risk: the model may have systematic biases that
        get baked into the training data.

        Implicit feedback: Use production signals like thumbs up/down, regeneration
        requests, or task completion as preference signals. High volume but noisy.
        Best combined with explicit annotation.

        Synthetic preference generation: Generate multiple responses from the SFT
        model, then use a reward model or strong LLM to rank them. This scales well
        but risks reinforcing existing model biases.

        Data volume guidelines: Start with 2000-5000 preference pairs for initial
        alignment. 10,000-50,000 pairs for comprehensive behavior shaping. Quality
        matters more than quantity -- 2000 expert-annotated pairs often outperform
        50,000 noisy pairs.

        Diversity: Ensure preference data covers the full range of prompts and
        scenarios the model will encounter, including edge cases, adversarial
        inputs, and ambiguous situations.
      tags: ["data", "annotation", "preference-pairs"]

    - topic: "Newer Alignment Methods: KTO, IPO, ORPO"
      content: |
        Beyond RLHF and DPO, several newer alignment methods address specific
        limitations:

        KTO (Kahneman-Tversky Optimization): Requires only binary feedback (good
        or bad) rather than preference pairs. This makes data collection simpler --
        annotators evaluate individual responses rather than comparing pairs. Based
        on prospect theory from behavioral economics. Use when preference pair
        collection is difficult or when you have existing thumbs up/down data.

        IPO (Identity Preference Optimization): A variant of DPO that is more robust
        to noisy or inconsistent preference data. Uses a regularized loss function
        that prevents the model from becoming overconfident. Use when annotation
        quality is variable or inter-annotator agreement is low.

        ORPO (Odds Ratio Preference Optimization): Combines SFT and alignment into
        a single training step, eliminating the need for a separate SFT stage. The
        loss function simultaneously teaches the model to generate good responses
        and avoid bad ones. Use when you want to simplify the training pipeline.

        SimPO (Simple Preference Optimization): Removes the need for a reference
        model during training, further simplifying the process and reducing memory
        requirements. Use when memory is constrained.

        Recommendation: Start with DPO as the default. Try KTO if you only have
        binary feedback. Try IPO if your preference data is noisy. Try ORPO if
        you want to combine SFT and alignment.
      tags: ["kto", "ipo", "orpo", "methods", "comparison"]

    - topic: "Alignment with LoRA Adapters"
      content: |
        LoRA is highly compatible with alignment training, enabling efficient
        alignment on limited hardware:

        LoRA + DPO: The most common production setup. Fine-tune LoRA adapters using
        DPO loss. Memory requirements are similar to LoRA SFT (the model processes
        two responses per example but only one is in the forward pass at a time).
        A 70B model can be DPO-trained with LoRA on 2x A100 80GB.

        QLoRA + DPO: Enable alignment of large models on single GPUs. A 70B model
        can be DPO-aligned with QLoRA on a single A100 80GB. Quality is typically
        sufficient for production use.

        Stacked training: First train an SFT LoRA adapter, then train a DPO adapter
        on top. The adapters can be merged sequentially. This separates the knowledge
        (SFT) and behavior (DPO) aspects of training.

        Reference model considerations: DPO requires a reference model (the SFT model
        before alignment). With LoRA, the reference model is simply the base model
        plus the SFT adapter. This is memory-efficient since the base model weights
        are shared.

        Practical tip: Train the SFT adapter first and validate its quality before
        proceeding to DPO. If the SFT model's outputs are poor, DPO cannot fix
        fundamental capability gaps -- it can only adjust preferences between
        responses the model is already capable of producing.
      tags: ["lora", "efficiency", "practical"]

    - topic: "Evaluation and Pitfalls"
      content: |
        Evaluating alignment quality is challenging because the improvements are
        often subjective:

        Automated metrics: Win rate (how often the aligned model is preferred over
        the base model by a judge LLM), reward model score (if you trained one),
        and safety benchmark pass rates (e.g., ToxiGen, BBQ for bias).

        Human evaluation: The gold standard. Have evaluators blind-compare outputs
        from the aligned and base models on a diverse set of prompts. Report win
        rate with confidence intervals. Use at least 200-500 evaluation pairs.

        Common pitfalls:

        1. Reward hacking: The model finds shortcuts to high reward that don't
        correspond to genuine quality. Monitor response diversity -- if the model
        starts producing templated responses, it may be optimizing for reward model
        artifacts.

        2. Over-alignment: The model becomes too cautious, refusing legitimate
        requests or being excessively verbose with safety caveats. Balance safety
        alignment with helpfulness.

        3. Catastrophic forgetting: Alignment training can reduce performance on
        general capabilities. Always evaluate on general benchmarks (MMLU, HumanEval)
        alongside alignment-specific metrics.

        4. Distribution mismatch: If preference data doesn't match production
        distribution, alignment may not generalize. Ensure training data diversity.

        5. Positional bias: Annotators may systematically prefer the first or second
        response. Randomize response order in annotation and analyze for bias.
      tags: ["evaluation", "pitfalls", "quality"]

code_examples:
  - title: "DPO Training with TRL"
    language: "python"
    code: |
      from trl import DPOTrainer, DPOConfig
      from transformers import AutoModelForCausalLM, AutoTokenizer
      from datasets import load_dataset

      # Load SFT model (the starting point for DPO)
      model = AutoModelForCausalLM.from_pretrained(
          "./sft-model",
          torch_dtype="bfloat16",
          device_map="auto"
      )
      tokenizer = AutoTokenizer.from_pretrained("./sft-model")

      # Load preference dataset
      # Format: {"prompt": "...", "chosen": "...", "rejected": "..."}
      dataset = load_dataset("json", data_files="preferences.jsonl", split="train")

      # DPO training
      dpo_config = DPOConfig(
          output_dir="./dpo-output",
          num_train_epochs=1,
          per_device_train_batch_size=2,
          gradient_accumulation_steps=8,
          learning_rate=5e-7,
          beta=0.1,  # KL divergence coefficient
          lr_scheduler_type="cosine",
          warmup_ratio=0.1,
          bf16=True,
          logging_steps=10,
          eval_strategy="steps",
          eval_steps=50,
      )

      trainer = DPOTrainer(
          model=model,
          args=dpo_config,
          train_dataset=dataset,
          tokenizer=tokenizer,
      )
      trainer.train()

  - title: "DPO with LoRA for Efficient Alignment"
    language: "python"
    code: |
      from trl import DPOTrainer, DPOConfig
      from peft import LoraConfig
      from transformers import AutoModelForCausalLM, AutoTokenizer

      model = AutoModelForCausalLM.from_pretrained(
          "meta-llama/Llama-3.1-8B-Instruct",
          torch_dtype="bfloat16",
          device_map="auto"
      )
      tokenizer = AutoTokenizer.from_pretrained("meta-llama/Llama-3.1-8B-Instruct")

      # LoRA config for DPO
      peft_config = LoraConfig(
          r=16,
          lora_alpha=32,
          target_modules=["q_proj", "k_proj", "v_proj", "o_proj"],
          lora_dropout=0.05,
          task_type="CAUSAL_LM",
      )

      dpo_config = DPOConfig(
          output_dir="./dpo-lora-output",
          num_train_epochs=1,
          per_device_train_batch_size=2,
          gradient_accumulation_steps=8,
          learning_rate=5e-5,  # Higher LR for LoRA
          beta=0.1,
          bf16=True,
      )

      trainer = DPOTrainer(
          model=model,
          args=dpo_config,
          train_dataset=preference_dataset,
          tokenizer=tokenizer,
          peft_config=peft_config,
      )
      trainer.train()
      trainer.save_model("./dpo-lora-adapter")

  - title: "Preparing Preference Data"
    language: "python"
    code: |
      import json
      from openai import OpenAI

      # Generate preference pairs using a strong model as judge
      client = OpenAI()

      def create_preference_pair(prompt, response_a, response_b):
          """Use GPT-4 to judge which response is better."""
          judge_prompt = f"""Compare these two responses to the prompt.
      Respond with exactly "A" or "B" to indicate which is better.

      Prompt: {prompt}

      Response A: {response_a}

      Response B: {response_b}

      Better response:"""

          judgment = client.chat.completions.create(
              model="gpt-4o",
              messages=[{"role": "user", "content": judge_prompt}],
              max_tokens=1,
              temperature=0
          )
          winner = judgment.choices[0].message.content.strip()

          if winner == "A":
              return {"prompt": prompt, "chosen": response_a, "rejected": response_b}
          else:
              return {"prompt": prompt, "chosen": response_b, "rejected": response_a}

      # Generate and save preference data
      with open("preferences.jsonl", "w") as f:
          for prompt in prompts:
              # Generate two responses from your SFT model
              resp_a = generate_response(sft_model, prompt, temperature=0.8)
              resp_b = generate_response(sft_model, prompt, temperature=0.8)
              pair = create_preference_pair(prompt, resp_a, resp_b)
              f.write(json.dumps(pair) + "\n")

