identity:
  tagline: "Alignment techniques for training LLMs to follow human preferences, policies, and safety guidelines"
  description: |
    Reinforcement Learning from Human Feedback (RLHF) and Direct Preference Optimization
    (DPO) are alignment techniques that train language models to produce outputs that
    match human preferences. Unlike supervised fine-tuning (SFT) which teaches the model
    what to say, alignment training teaches the model how to behave -- which responses
    to prefer, what to avoid, and how to handle ambiguous or sensitive situations.

    RLHF is the original alignment method used to train ChatGPT and Claude. It involves
    three stages: (1) SFT on high-quality demonstrations, (2) training a reward model
    on human preference data (pairs of responses ranked by quality), and (3) optimizing
    the language model using the reward model with PPO (Proximal Policy Optimization).
    RLHF is powerful but complex, requiring careful tuning of the reward model and
    PPO training loop.

    DPO simplifies alignment by eliminating the reward model and RL training loop
    entirely. Instead, it directly optimizes the language model on preference pairs
    using a classification-like loss function. DPO achieves comparable results to RLHF
    with significantly less complexity, compute, and hyperparameter sensitivity, making
    it the preferred choice for most production alignment tasks.

    Both techniques are essential for: safety alignment (refusing harmful requests),
    helpfulness optimization (producing more useful responses), style control (matching
    brand voice or communication guidelines), and reducing hallucination (preferring
    accurate responses over confident but incorrect ones).
