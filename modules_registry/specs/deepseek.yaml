identity:
  tagline: DeepSeek's general models — strong reasoning with aggressive open/API pricing
  description: 'DeepSeek is a foundation model family in the DeepSeek ecosystem, catalogued

    for architecture decisions at the generation step of AI pipelines. This module
    covers

    model capabilities, context, modalities, deployment fit, and trade-offs — not
    API vendor

    integration (see cloud_api modules such as openai or google_gemini for that layer).


    Strengths: Strong math/reasoning per dollar, Open-weight variants.

    Tradeoffs: Smaller Western enterprise support, Data residency considerations.'
  logo_url: /assets/modules/deepseek.svg
  website: https://www.deepseek.com
  documentation: https://api-docs.deepseek.com
  github: https://github.com/deepseek-ai
  license: DeepSeek License
  pricing_model: freemium
