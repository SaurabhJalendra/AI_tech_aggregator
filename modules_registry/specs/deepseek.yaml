knowledge:
  entries:
  - topic: When to choose DeepSeek
    content: 'Choose DeepSeek when your architecture needs cost-sensitive reasoning

      and you can accept tradeoffs: Smaller Western enterprise support.

      Pair with retrieval and evaluation modules; use cloud_api entries only

      when the decision is specifically about API routing, billing, or VPC — not

      model family selection.'
    tags:
    - model-selection
    - architecture
    - foundation_model
  - topic: DeepSeek vs alternatives
    content: 'Compare against qwen, llama_3, claude_sonnet at the foundation_model
      layer only.

      Do not compare to inference hosts (groq_inference), local runners (ollama),
      or

      provider APIs (openai) in the same shortlist — the advisor enforces layer separation.'
    tags:
    - comparison
    - trade-offs
