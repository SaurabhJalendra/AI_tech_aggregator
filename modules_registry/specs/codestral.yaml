identity:
  tagline: Mistral's code-first model for fill-in-the-middle, repo context, and IDE
    workflows
  description: 'Codestral is a foundation model family in the Mistral ecosystem, catalogued

    for architecture decisions at the generation step of AI pipelines. This module
    covers

    model capabilities, context, modalities, deployment fit, and trade-offs — not
    API vendor

    integration (see cloud_api modules such as openai or google_gemini for that layer).


    Strengths: FIM support, EU hosting, Strong Python/TS.

    Tradeoffs: General chat weaker than Large/Opus.'
  logo_url: /assets/modules/codestral.svg
  website: https://mistral.ai
  documentation: https://docs.mistral.ai/capabilities/code_generation/
  github: https://github.com/mistralai/client-python
  license: Mistral AI License
  pricing_model: paid
