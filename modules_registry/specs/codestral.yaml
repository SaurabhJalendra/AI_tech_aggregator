knowledge:
  entries:
  - topic: When to choose Codestral
    content: 'Choose Codestral when your architecture needs ide copilots

      and you can accept tradeoffs: General chat weaker than Large/Opus.

      Pair with retrieval and evaluation modules; use cloud_api entries only

      when the decision is specifically about API routing, billing, or VPC — not

      model family selection.'
    tags:
    - model-selection
    - architecture
    - foundation_model
  - topic: Codestral vs alternatives
    content: 'Compare against deepseek_coder, gpt4_1, code_llama at the foundation_model
      layer only.

      Do not compare to inference hosts (groq_inference), local runners (ollama),
      or

      provider APIs (openai) in the same shortlist — the advisor enforces layer separation.'
    tags:
    - comparison
    - trade-offs
