knowledge:
  entries:
    - topic: "Together AI vs Self-Hosted Inference"
      content: |
        Together AI vs managing your own GPU infrastructure with vLLM:

        Together advantages: No GPU procurement or management, instant access to
        100+ models, built-in fine-tuning, automatic scaling, pay-per-token pricing
        that works for variable workloads.

        Self-hosted advantages: Full data control, no per-token costs at high
        volume (fixed GPU cost), custom model support, no rate limits, lower
        latency for co-located applications.

        Break-even point: For sustained high-throughput workloads (millions of
        tokens per day), self-hosting on reserved GPU instances becomes cheaper.
        For variable or moderate workloads, Together's pay-per-use model is
        more cost-effective.
      tags: ["comparison", "self-hosting", "cost"]

code_examples:
  - title: "Chat Completion with Together"
    language: "python"
    code: |
      from together import Together

      client = Together(api_key="your-api-key")

      response = client.chat.completions.create(
          model="meta-llama/Llama-3.1-70B-Instruct-Turbo",
          messages=[
              {"role": "system", "content": "You are a helpful assistant."},
              {"role": "user", "content": "Compare vector databases for RAG."}
          ],
          max_tokens=512,
          temperature=0.7
      )

      print(response.choices[0].message.content)

  - title: "Fine-Tuning a Model"
    language: "python"
    code: |
      from together import Together

      client = Together(api_key="your-api-key")

      # Start fine-tuning job
      response = client.fine_tuning.create(
          training_file="file-abc123",
          model="meta-llama/Llama-3.1-8B-Instruct",
          n_epochs=3,
          learning_rate=1e-5,
          suffix="my-custom-model"
      )

      print(f"Job ID: {response.id}")

