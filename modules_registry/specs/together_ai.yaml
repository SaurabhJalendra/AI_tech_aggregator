identity:
  tagline: "Fast inference, fine-tuning, and training platform for open-source AI models"
  description: |
    Together AI is a cloud platform for running, fine-tuning, and training
    open-source AI models. It provides a comprehensive API for inference across
    100+ open-source models including Llama, Mixtral, DBRX, and many others,
    along with fine-tuning and custom model hosting capabilities.

    Together differentiates itself with a broad model catalog, competitive pricing,
    and a full MLOps platform that supports the complete model lifecycle from
    training to deployment. Their inference engine is optimized for high throughput
    and supports features like function calling, JSON mode, and streaming.

    The platform is popular among teams that want to use open-source models
    without managing GPU infrastructure, and for organizations that need
    fine-tuning capabilities with a managed service.
  logo_url: "/assets/modules/together_ai.svg"
  website: "https://www.together.ai"
  documentation: "https://docs.together.ai"
  github: "https://github.com/togethercomputer"
  license: "Proprietary"
  pricing_model: "paid"

