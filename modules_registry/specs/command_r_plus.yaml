knowledge:
  entries:
  - topic: When to choose Command R+
    content: 'Choose Command R+ when your architecture needs enterprise rag

      and you can accept tradeoffs: Less general brand than hyperscalers.

      Pair with retrieval and evaluation modules; use cloud_api entries only

      when the decision is specifically about API routing, billing, or VPC — not

      model family selection.'
    tags:
    - model-selection
    - architecture
    - foundation_model
  - topic: Command R+ vs alternatives
    content: 'Compare against claude_sonnet, gemini_1_5_pro, mistral_large at the
      foundation_model layer only.

      Do not compare to inference hosts (groq_inference), local runners (ollama),
      or

      provider APIs (openai) in the same shortlist — the advisor enforces layer separation.'
    tags:
    - comparison
    - trade-offs
