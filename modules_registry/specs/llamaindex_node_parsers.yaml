technical_specs:
  parser_types:
    - name: "SentenceSplitter"
      description: "Default parser, splits on sentence boundaries with configurable chunk size"
      default_chunk_size: 1024
      default_overlap: 20
    - name: "SemanticSplitterNodeParser"
      description: "Splits based on embedding similarity between sentences"
      requires_embeddings: true
    - name: "HierarchicalNodeParser"
      description: "Creates multi-level node hierarchy with configurable chunk sizes per level"
      default_levels: [2048, 512, 128]
    - name: "SentenceWindowNodeParser"
      description: "Creates nodes with surrounding sentence context window"
      default_window_size: 3
    - name: "MarkdownNodeParser"
      description: "Parses markdown preserving header hierarchy"
    - name: "HTMLNodeParser"
      description: "Parses HTML preserving document structure"
    - name: "CodeSplitter"
      description: "Language-aware code splitting using tree-sitter"
  node_relationships:
    - "PARENT"
    - "CHILD"
    - "PREVIOUS"
    - "NEXT"
    - "SOURCE"
  package: "llama-index-core"
  python_version: ">=3.9"

