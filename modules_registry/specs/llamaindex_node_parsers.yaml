identity:
  tagline: "Node-based document parsing and chunking framework with hierarchical and semantic splitting"
  description: |
    LlamaIndex Node Parsers convert documents into Node objects, the fundamental data unit in
    LlamaIndex's architecture. Nodes maintain relationships with parent documents and sibling
    nodes, enabling sophisticated retrieval strategies like hierarchical retrieval and
    auto-merging.

    The library provides multiple parsing strategies including SentenceSplitter (the default),
    SemanticSplitterNodeParser, HierarchicalNodeParser, and format-specific parsers for
    markdown, HTML, JSON, and code. Each parser produces nodes with metadata, relationships,
    and configurable chunk sizes.

    A key differentiator from LangChain text splitters is the node relationship model. Nodes
    know their parent, child, and sibling nodes, enabling retrieval strategies that start with
    a specific chunk and expand to surrounding context. This powers LlamaIndex's
    AutoMergingRetriever and HierarchicalRetriever.
  logo_url: "/assets/modules/llamaindex_node_parsers.svg"
  website: "https://www.llamaindex.ai"
  documentation: "https://docs.llamaindex.ai/en/stable/module_guides/loading/node_parsers/"
  github: "https://github.com/run-llama/llama_index"
  license: "MIT"
  pricing_model: "open_source"

