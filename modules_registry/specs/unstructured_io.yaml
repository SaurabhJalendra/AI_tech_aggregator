knowledge:
  entries:
    - topic: "Partitioning Strategies"
      content: |
        Unstructured offers four partitioning strategies that trade off speed vs accuracy:

        1. "auto" (default): Automatically selects the best strategy based on document type.
        For PDFs, it uses hi_res if layout detection models are available, otherwise falls
        back to fast. For simple formats like .txt and .html, it uses fast parsing.

        2. "hi_res": Uses layout detection models (detectron2 or YOLOX) to identify document
        structure including tables, figures, headers, and text blocks. Most accurate but
        slowest. Recommended for PDFs with complex layouts, multi-column text, or embedded
        tables.

        3. "fast": Uses basic heuristics and text extraction without layout detection. Much
        faster but may miss table structure or misidentify elements in complex documents.
        Good for simple, text-heavy documents.

        4. "ocr_only": Forces OCR on the entire document, treating every page as an image.
        Necessary for scanned documents or image-only PDFs. Slowest strategy but handles
        documents where text extraction is impossible.
      tags: ["partitioning", "strategy", "configuration"]

    - topic: "When to Choose Unstructured.io"
      content: |
        Unstructured.io is the right choice when:

        1. You need to process diverse document formats. No other single library handles
        PDFs, Word docs, emails, and images with the same unified interface.

        2. Your RAG pipeline ingests real-world enterprise documents with complex layouts,
        tables, headers, and footers. The hi_res strategy with layout detection produces
        superior results compared to simple text extraction.

        3. You want to run document processing locally for data privacy. The open-source
        library requires no external API calls.

        4. You need structured elements, not just raw text. Unstructured identifies element
        types (Title, Table, NarrativeText) which enables smarter chunking strategies.

        Alternatives to consider: Apache Tika for simpler Java-based document extraction,
        PyMuPDF or pdfplumber for PDF-only workloads, docling by IBM for high-accuracy
        PDF table extraction, or LlamaParse for cloud-based document parsing with LLM
        enhancement.
      tags: ["decision", "comparison"]

    - topic: "Chunking with Unstructured"
      content: |
        Unstructured provides built-in chunking that respects document structure. Unlike
        naive text splitters that chunk by character count, Unstructured's chunking
        preserves element boundaries.

        The chunk_by_title strategy groups consecutive elements under the same section
        heading, keeping semantically related content together. Parameters include
        max_characters (hard limit), new_after_n_chars (soft limit that triggers a new
        chunk), and combine_text_under_n_chars (minimum chunk size before combining).

        This structure-aware chunking typically produces 15-25% better retrieval accuracy
        in RAG benchmarks compared to naive character-based splitting, because chunks
        maintain topical coherence.

        For tables, Unstructured can output them as HTML or plain text. The HTML format
        preserves structure for downstream LLM processing, while plain text is simpler
        but loses column/row relationships.
      tags: ["chunking", "rag", "best-practices"]

    - topic: "Connectors for Source and Destination"
      content: |
        Unstructured provides source and destination connectors for building end-to-end
        ingestion pipelines. Source connectors pull documents from storage systems, and
        destination connectors push processed elements to vector stores or databases.

        Source connectors include: S3, Azure Blob Storage, GCS, Google Drive, OneDrive,
        SharePoint, Dropbox, Box, Salesforce, Slack, Discord, Wikipedia, and local
        filesystem.

        Destination connectors include: Pinecone, Weaviate, ChromaDB, Qdrant, Milvus,
        Elasticsearch, MongoDB, PostgreSQL, Databricks, and Delta Lake.

        The pipeline runner handles batching, retries, and progress tracking. For large
        ingestion jobs, the Serverless API provides automatic scaling and higher throughput
        than local processing.
      tags: ["connectors", "pipeline", "integration"]

code_examples:
  - title: "Basic Document Partitioning"
    language: "python"
    code: |
      from unstructured.partition.auto import partition

      # Auto-detect format and extract elements
      elements = partition(filename="report.pdf", strategy="hi_res")

      for element in elements:
          print(f"[{element.category}] {element.text[:100]}")
          print(f"  Metadata: page={element.metadata.page_number}")

  - title: "Chunking for RAG"
    language: "python"
    code: |
      from unstructured.partition.auto import partition
      from unstructured.chunking.title import chunk_by_title

      elements = partition(filename="report.pdf", strategy="hi_res")

      chunks = chunk_by_title(
          elements,
          max_characters=1500,
          new_after_n_chars=1000,
          combine_text_under_n_chars=200
      )

      for chunk in chunks:
          print(f"Chunk ({len(chunk.text)} chars): {chunk.text[:80]}...")

  - title: "Using the Serverless API"
    language: "python"
    code: |
      from unstructured_client import UnstructuredClient
      from unstructured_client.models import operations, shared

      client = UnstructuredClient(api_key_auth="YOUR_API_KEY")

      with open("contract.pdf", "rb") as f:
          resp = client.general.partition(
              request=operations.PartitionRequest(
                  partition_parameters=shared.PartitionParameters(
                      files=shared.Files(
                          content=f.read(),
                          file_name="contract.pdf"
                      ),
                      strategy=shared.Strategy.HI_RES,
                      languages=["eng"]
                  )
              )
          )

      for element in resp.elements:
          print(element)

