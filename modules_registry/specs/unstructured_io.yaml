identity:
  tagline: "Open-source toolkit for ingesting and pre-processing unstructured data for AI pipelines"
  description: |
    Unstructured.io provides a comprehensive set of tools for extracting and transforming
    content from a wide variety of document formats including PDFs, Word documents, HTML,
    emails, images, and more. It is designed to bridge the gap between raw unstructured
    data and the structured inputs required by LLM and RAG pipelines.

    The library uses a combination of rule-based parsing, OCR (via Tesseract), and
    layout-detection models (via detectron2 and YOLOX) to accurately extract text,
    tables, and images from complex documents. It produces structured Element objects
    that include text content, element type (Title, NarrativeText, Table, etc.), and
    metadata such as page number and coordinates.

    Unstructured offers both an open-source Python library and a hosted Serverless API
    for production workloads. The API provides higher-accuracy models, automatic
    scaling, and a simple REST interface. For enterprise needs, there is also a
    self-hosted platform deployment option.
  logo_url: "/assets/modules/unstructured_io.svg"
  website: "https://unstructured.io"
  documentation: "https://docs.unstructured.io"
  github: "https://github.com/Unstructured-IO/unstructured"
  license: "Apache-2.0"
  pricing_model: "freemium"

