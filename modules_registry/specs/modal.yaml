identity:
  tagline: "Serverless GPU platform for deploying AI inference, training, and batch workloads"
  description: |
    Modal is a serverless cloud platform designed for running AI and compute-intensive
    workloads. It provides on-demand access to GPUs (from T4 to H100) without the need
    to manage infrastructure, containers, or orchestration. Developers define their
    compute environment in Python code, and Modal handles provisioning, scaling,
    scheduling, and teardown.

    Modal's key innovation is its developer experience: functions are decorated with
    @app.function() to specify compute requirements (GPU type, memory, concurrency), and
    Modal handles everything else. There are no Dockerfiles to write, no Kubernetes to
    manage, and no idle resources to pay for. Cold start times are typically under 5
    seconds due to container image snapshotting.

    Common use cases include LLM inference serving (vLLM, TGI), model fine-tuning,
    batch embedding generation, data processing pipelines, and scheduled jobs. Modal
    supports web endpoints, cron schedules, queues, and persistent volumes for model
    weights and data.
  logo_url: "/assets/modules/modal.svg"
  website: "https://modal.com"
  documentation: "https://modal.com/docs"
  github: "https://github.com/modal-labs/modal-client"
  license: "Proprietary"
  pricing_model: "paid"

