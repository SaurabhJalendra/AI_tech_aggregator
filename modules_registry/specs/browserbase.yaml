identity:
  tagline: "Headless browser infrastructure for AI agents and web automation"
  description: |
    Browserbase provides managed headless browser infrastructure designed for
    AI agents. It offers cloud-hosted browser sessions that AI agents can control
    to navigate websites, fill forms, extract data, and perform web-based tasks
    that require a real browser environment.

    Unlike simple HTTP scraping, Browserbase provides full browser capabilities
    including JavaScript execution, session persistence, CAPTCHA handling, and
    residential proxies. This makes it suitable for agents that need to interact
    with modern web applications that require authentication, dynamic rendering,
    or anti-bot evasion.

    Browserbase integrates with popular browser automation libraries (Playwright,
    Puppeteer, Selenium) and AI agent frameworks, providing the browser infrastructure
    that agents need without managing browser servers or proxy networks.
  logo_url: "/assets/modules/browserbase.svg"
  website: "https://www.browserbase.com"
  documentation: "https://docs.browserbase.com"
  github: "https://github.com/browserbase"
  license: "Proprietary"
  pricing_model: "freemium"

