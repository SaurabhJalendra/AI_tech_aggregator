knowledge:
  entries:
    - topic: "Browser Automation for AI Agents"
      content: |
        AI agents increasingly need to interact with the web in ways that go
        beyond simple API calls or HTTP scraping:

        1. Web research: navigating multiple pages, following links, reading
        dynamically rendered content.

        2. Task automation: filling forms, submitting applications, managing
        accounts on web platforms.

        3. Data extraction: scraping JavaScript-rendered content that static
        HTTP requests cannot access.

        Browserbase provides the infrastructure for these interactions, handling
        the complexity of running browser instances, managing sessions, rotating
        proxies, and bypassing anti-bot protections. This lets agent developers
        focus on the agent logic rather than browser infrastructure.
      tags: ["agents", "browser", "automation"]

code_examples:
  - title: "Basic Browser Session with Playwright"
    language: "python"
    code: |
      from browserbase import Browserbase
      from playwright.sync_api import sync_playwright

      bb = Browserbase(api_key="your-api-key")

      # Create a browser session
      session = bb.sessions.create(project_id="your-project-id")

      with sync_playwright() as p:
          browser = p.chromium.connect_over_cdp(session.connect_url)
          page = browser.new_page()

          # Navigate and interact
          page.goto("https://example.com")
          content = page.content()
          screenshot = page.screenshot()

          # Extract text
          text = page.inner_text("body")
          print(text[:500])

          browser.close()

  - title: "Agent Web Research Tool"
    language: "python"
    code: |
      from browserbase import Browserbase
      from playwright.async_api import async_playwright

      bb = Browserbase(api_key="your-api-key")

      async def web_research(url: str, question: str) -> str:
          session = bb.sessions.create(project_id="your-project-id")

          async with async_playwright() as p:
              browser = await p.chromium.connect_over_cdp(session.connect_url)
              page = await browser.new_page()

              await page.goto(url)
              content = await page.inner_text("main")

              await browser.close()

          return content[:5000]  # Return content for LLM processing

