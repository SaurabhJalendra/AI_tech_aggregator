knowledge:
  entries:
    - topic: "Document Processing Architecture"
      content: |
        A modern document intelligence pipeline typically follows these stages:

        1. Ingestion: Accept documents in various formats (PDF, images, scans). Handle
        multi-page documents, detect orientation, and perform deskewing if needed.

        2. OCR / Text Extraction: For scanned documents or images, apply OCR to extract
        raw text. For native PDFs, extract text directly from the PDF structure. Tools
        like Surya and PaddleOCR handle the OCR step.

        3. Layout Analysis: Detect the document structure including headings, paragraphs,
        tables, figures, headers, footers, and reading order. This is crucial for preserving
        the semantic structure of the document.

        4. Content Extraction: Extract structured data from specific regions: tables into
        rows/columns, forms into key-value pairs, entities from text. This step uses
        either specialized models or VLMs.

        5. Post-Processing: Clean extracted text, resolve references, merge multi-page
        tables, validate extracted data against schemas, and convert to the target format
        (markdown, JSON, structured records).

        6. Indexing: Feed processed documents into a search index or vector database for
        retrieval. This is where document intelligence connects to RAG pipelines.

        The VLM approach (GPT-4V, Claude Vision) can collapse steps 2-4 into a single model
        call, but at higher latency and cost per page.
      tags: ["architecture", "pipeline"]

    - topic: "Choosing the Right Approach"
      content: |
        The document intelligence landscape offers three main approaches:

        Cloud Platform APIs (Azure Document Intelligence, Google Document AI, AWS Textract):
        Best for organizations wanting managed services with prebuilt models for common
        document types (invoices, receipts, IDs). Fast to implement, predictable per-page
        pricing, but limited customization and data leaves your infrastructure.

        Open-Source Pipelines (Docling, Surya, PaddleOCR + custom extraction):
        Best for organizations needing data privacy, cost control at high volumes, or
        specialized document types. Requires ML engineering capacity. More flexible but
        more work to build and maintain.

        Vision-Language Models (GPT-4V, Claude Vision, Gemini):
        Best for complex, varied documents where traditional extraction rules are insufficient.
        The model can reason about document content, handle unexpected layouts, and answer
        questions about documents. Expensive per page but highly flexible.

        Hybrid approaches are increasingly common: use traditional OCR for text extraction,
        then VLMs for understanding and extraction of complex elements. This balances cost
        and capability.
      tags: ["decision", "comparison"]

    - topic: "Document Intelligence for RAG"
      content: |
        Document Intelligence is a critical upstream component of RAG systems. The quality
        of document processing directly impacts retrieval quality and ultimately LLM response
        accuracy. Key considerations:

        1. Chunk-aware extraction: Document structure (headings, sections, paragraphs) should
        inform chunking strategy. Tools like Docling and Unstructured.io preserve structural
        metadata that enables semantic chunking rather than naive character-count splitting.

        2. Table handling: Tables are a major challenge. Options include converting tables
        to markdown or HTML within text chunks, extracting tables as separate structured
        objects, or generating natural language descriptions of table contents.

        3. Figure and chart processing: Use VLMs to generate descriptions of figures and
        charts that can be included in the text index alongside the surrounding context.

        4. Metadata preservation: Retain document metadata (title, author, date, page number,
        section) for filtering during retrieval. This enables queries like "find information
        about X in documents from 2024."

        5. Quality validation: Implement checks for OCR quality (confidence scores), completeness
        (expected page count), and extraction accuracy (schema validation for structured fields).
      tags: ["rag", "integration", "chunking"]

    - topic: "Emerging Trends"
      content: |
        Key trends in document intelligence as of 2026:

        1. VLM-first pipelines: Vision-language models are increasingly used as the primary
        document understanding tool, with traditional OCR as a fallback. Models like Claude
        and GPT-4o can process document images directly with strong accuracy.

        2. Multimodal RAG: Systems that index not just text but also visual elements (charts,
        diagrams, layouts) from documents, enabling queries about visual content.

        3. Agentic document processing: AI agents that can navigate complex documents,
        cross-reference information across pages, and handle multi-document tasks like
        contract comparison or regulatory compliance checking.

        4. Specialized document models: Foundation models fine-tuned specifically for document
        understanding (LayoutLM, Donut, Pix2Struct) that combine OCR and understanding
        in a single model.

        5. Zero-shot extraction: Using LLMs to extract structured data from documents
        without training custom models. Define the schema in the prompt and let the model
        extract matching fields. This dramatically reduces time-to-deployment for new
        document types.
      tags: ["trends", "emerging", "future"]

code_examples:
  - title: "Azure Document Intelligence"
    language: "python"
    code: |
      from azure.ai.documentintelligence import DocumentIntelligenceClient
      from azure.core.credentials import AzureKeyCredential

      client = DocumentIntelligenceClient(
          endpoint="https://your-resource.cognitiveservices.azure.com/",
          credential=AzureKeyCredential("your-key")
      )

      # Analyze a document with the prebuilt layout model
      with open("document.pdf", "rb") as f:
          poller = client.begin_analyze_document(
              "prebuilt-layout",
              body=f,
              content_type="application/pdf"
          )

      result = poller.result()

      # Extract tables
      for table in result.tables:
          print(f"Table: {table.row_count} rows x {table.column_count} cols")
          for cell in table.cells:
              print(f"  [{cell.row_index},{cell.column_index}]: {cell.content}")

      # Extract paragraphs with structure
      for paragraph in result.paragraphs:
          print(f"[{paragraph.role}] {paragraph.content}")

  - title: "VLM-Based Document Extraction with Claude"
    language: "python"
    code: |
      import anthropic
      import base64

      client = anthropic.Anthropic()

      # Read document image
      with open("invoice.png", "rb") as f:
          image_data = base64.standard_b64encode(f.read()).decode("utf-8")

      response = client.messages.create(
          model="claude-sonnet-4-20250514",
          max_tokens=4096,
          messages=[
              {
                  "role": "user",
                  "content": [
                      {
                          "type": "image",
                          "source": {
                              "type": "base64",
                              "media_type": "image/png",
                              "data": image_data
                          }
                      },
                      {
                          "type": "text",
                          "text": """Extract the following fields from this invoice as JSON:
                          - vendor_name
                          - invoice_number
                          - date
                          - line_items (array of {description, quantity, unit_price, total})
                          - subtotal
                          - tax
                          - total"""
                      }
                  ]
              }
          ]
      )

      print(response.content[0].text)

  - title: "Open-Source Pipeline with Docling"
    language: "python"
    code: |
      from docling.document_converter import DocumentConverter
      from docling.datamodel.pipeline_options import PdfPipelineOptions

      # Configure pipeline
      pipeline_options = PdfPipelineOptions()
      pipeline_options.do_ocr = True
      pipeline_options.do_table_structure = True

      converter = DocumentConverter(pipeline_options=pipeline_options)

      # Convert PDF to structured document
      result = converter.convert("document.pdf")

      # Export as markdown (preserves structure)
      markdown = result.document.export_to_markdown()

      # Access structured elements
      for table in result.document.tables:
          print(f"Table on page {table.page_no}:")
          print(table.export_to_dataframe())

      # Access text with metadata for chunking
      for element in result.document.iterate_items():
          print(f"[{element.label}] {element.text[:100]}...")

