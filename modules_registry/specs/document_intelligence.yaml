identity:
  tagline: "AI-powered document understanding, extraction, and processing for enterprise workflows"
  description: |
    Document Intelligence encompasses the AI technologies and platforms that automatically
    understand, extract, classify, and process information from documents of all types:
    PDFs, images, scanned documents, forms, invoices, contracts, and more. This field
    combines computer vision (OCR, layout analysis), natural language processing (entity
    extraction, classification), and large language models (reasoning, summarization) into
    end-to-end document processing pipelines.

    The landscape includes cloud platforms (Azure AI Document Intelligence, Google Document AI,
    AWS Textract), open-source tools (Docling, Surya, PaddleOCR, DocTR), and LLM-based
    approaches that leverage vision-language models (GPT-4V, Claude Vision, Gemini) to
    understand documents directly from images without traditional OCR pipelines.

    Document Intelligence is critical for enterprise AI adoption because most organizational
    knowledge lives in unstructured documents. Converting these documents into structured,
    searchable, and actionable data is a prerequisite for RAG systems, knowledge management,
    compliance automation, and business process automation.
  logo_url: "/assets/modules/document_intelligence.svg"
  website: "https://azure.microsoft.com/en-us/products/ai-services/ai-document-intelligence"
  documentation: "https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/"
  license: "Various"
  pricing_model: "freemium"

