meta:
  slug: "replicate"
  name: "Replicate"
  version: "1.0.0"
  category: "deployment"
  subcategory: "model_hosting"
  status: "stable"
  last_updated: "2026-02-28"
  maintainer: "system"

identity:
  tagline: "Run and deploy ML models with a cloud API"
  description: |
    Replicate is a platform for running machine learning models in the cloud
    via a simple API. It hosts thousands of open-source models contributed by
    the community and model authors, covering text generation, image generation,
    audio, video, and more.

    Replicate's key value proposition is simplicity: any model packaged with Cog
    (Replicate's open-source container format) can be deployed and served via API
    with automatic scaling. Users can run models without managing infrastructure,
    GPUs, or containers.

    The platform is popular for rapid prototyping, accessing a wide variety of
    models through a single API, and deploying custom models without DevOps
    overhead. It charges per-second of compute time with no minimum commitment.
  logo_url: "/assets/modules/replicate.svg"
  website: "https://replicate.com"
  documentation: "https://replicate.com/docs"
  github: "https://github.com/replicate"
  license: "Proprietary"
  pricing_model: "paid"

capabilities:
  primary_use_cases:
    - "ML model hosting and serving"
    - "Image generation API"
    - "LLM inference"
    - "Audio/video model deployment"
    - "Custom model deployment with Cog"
  supported_operations:
