knowledge:
  entries:
    - topic: "Replicate vs Modal"
      content: |
        Replicate and Modal serve different needs:

        Replicate is model-centric: you push a model, get an API endpoint. Best for
        teams that want to deploy specific models quickly without writing serving code.
        The model catalog is a major advantage for discovery and prototyping.

        Modal is compute-centric: you push Python functions that run on GPUs. Best
        for teams that need custom inference logic, batch processing, or workloads
        beyond just model serving.

        Choose Replicate when: you want the simplest path to serving a model,
        you want to use community models, or you need multi-language SDK support.
        Choose Modal when: you need custom compute logic, batch processing,
        or tighter integration between model serving and application code.
      tags: ["comparison", "modal", "decision"]

code_examples:
  - title: "Run a Model"
    language: "python"
    code: |
      import replicate

      output = replicate.run(
          "meta/llama-3.1-70b-instruct",
          input={
              "prompt": "Explain vector databases in simple terms",
              "max_tokens": 256,
              "temperature": 0.7
          }
      )

      for text in output:
          print(text, end="")

  - title: "Deploy a Custom Model"
    language: "python"
    code: |
      import replicate

      # Create a deployment for production use
      deployment = replicate.deployments.create(
          name="my-llm-deployment",
          model="meta/llama-3.1-70b-instruct",
          hardware="gpu-a100-large",
          min_instances=1,
          max_instances=5
      )

      # Run prediction on deployment
      prediction = deployment.predictions.create(
          input={"prompt": "Hello, world!", "max_tokens": 100}
      )

