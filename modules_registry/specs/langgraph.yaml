identity:
  tagline: "State machine framework for building controllable, multi-step LLM agent workflows"
  description: |
    LangGraph is a framework for building stateful, multi-actor applications with LLMs,
    built on top of the LangChain ecosystem. It models agent workflows as directed graphs
    where nodes represent computation steps (LLM calls, tool use, data processing) and edges
    represent transitions between steps, including conditional branching.

    Unlike simple chain-based approaches, LangGraph provides explicit control flow through
    a state machine model. Developers define a graph of nodes and edges, with a shared state
    object that flows through the graph. Conditional edges enable dynamic routing based on
    LLM output, tool results, or custom logic.

    LangGraph supports cycles (loops), which is essential for agentic behavior where an LLM
    may need to call tools multiple times before producing a final answer. It also supports
    human-in-the-loop patterns, streaming, persistence, and multi-agent architectures where
    separate agents collaborate through a supervisor or peer-to-peer communication.

    LangGraph Platform provides managed deployment with built-in persistence, streaming,
    and a visual studio for debugging agent workflows.
  logo_url: "/assets/modules/langgraph.svg"
  website: "https://langchain-ai.github.io/langgraph/"
  documentation: "https://langchain-ai.github.io/langgraph/tutorials/"
  github: "https://github.com/langchain-ai/langgraph"
