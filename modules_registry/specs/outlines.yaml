identity:
  tagline: "Structured text generation with LLMs using guided decoding"
  description: |
    Outlines is an open-source library for structured text generation with large
    language models. Unlike post-hoc parsing approaches (like Instructor), Outlines
    constrains the generation process itself at the token level, guaranteeing that
    the output conforms to a specified format (JSON schema, regex, grammar, or
    choice from a set of options).

    Outlines works by modifying the token sampling probabilities during generation
    to only allow tokens that are valid according to the specified structure. This
    means the model can never produce invalid output, eliminating the need for
    retries or error handling.

    The library supports Hugging Face Transformers, vLLM, llama.cpp, and other
    local model backends. It is particularly valuable for self-hosted models where
    you cannot rely on provider-side JSON mode or function calling.
  logo_url: "/assets/modules/outlines.svg"
  website: "https://outlines-dev.github.io/outlines/"
  documentation: "https://outlines-dev.github.io/outlines/"
