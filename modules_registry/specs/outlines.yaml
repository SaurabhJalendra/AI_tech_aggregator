knowledge:
  entries:
    - topic: "Outlines vs Instructor"
      content: |
        Outlines and Instructor solve the same problem (structured LLM output)
        but at different levels:

        Outlines: constrains generation at the token level. The model literally
        cannot produce invalid output. Works with local models. Zero retries needed.
        Best for self-hosted models where you control the inference process.

        Instructor: validates output after generation and retries on failure.
        Works with any API provider (OpenAI, Anthropic, etc.). More ergonomic
        API with Pydantic integration. Best for API-based models where you
        cannot control token sampling.

        Use Outlines when: running local models, you need guaranteed valid output
        with no retries, or you're using vLLM for serving.

        Use Instructor when: using API-based models (OpenAI, Anthropic), you want
        the simplest integration, or you need provider flexibility.
      tags: ["comparison", "instructor", "decision"]

code_examples:
  - title: "JSON Schema Generation"
    language: "python"
    code: |
      import outlines
      from pydantic import BaseModel

      model = outlines.models.transformers("mistralai/Mistral-7B-Instruct-v0.3")

      class Character(BaseModel):
          name: str
          age: int
          weapon: str

      generator = outlines.generate.json(model, Character)

      result = generator("Create a fantasy RPG character.")
      print(result.name)    # Always valid
      print(result.age)     # Always an integer
      print(result.weapon)  # Always a string

  - title: "Regex-Constrained Generation"
    language: "python"
    code: |
      import outlines

      model = outlines.models.transformers("mistralai/Mistral-7B-Instruct-v0.3")

      # Generate valid IP addresses
      ip_regex = r"(\d{1,3}\.){3}\d{1,3}"
      generator = outlines.generate.regex(model, ip_regex)

      result = generator("What is a common localhost IP address?")
      print(result)  # e.g., "127.0.0.1" - guaranteed valid format

  - title: "Choice Selection"
    language: "python"
    code: |
      import outlines

      model = outlines.models.transformers("mistralai/Mistral-7B-Instruct-v0.3")

      generator = outlines.generate.choice(
          model,
          ["positive", "negative", "neutral"]
      )

      sentiment = generator("Classify: 'This product is amazing!'")
      print(sentiment)  # Guaranteed to be one of the three options

