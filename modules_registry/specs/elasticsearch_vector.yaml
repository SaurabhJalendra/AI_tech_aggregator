identity:
  tagline: "Enterprise search engine with native vector search, combining full-text and semantic retrieval"
  description: |
    Elasticsearch, the widely adopted distributed search and analytics engine, has evolved to
    include native vector search capabilities through its dense_vector field type and kNN search
    API. This makes it a compelling choice for organizations that need both traditional full-text
    search and modern semantic vector search in a single platform.

    Elasticsearch's vector search uses HNSW (Hierarchical Navigable Small World) graphs for
    approximate nearest neighbor search, with support for exact brute-force search when precision
    is paramount. The platform supports hybrid search natively, allowing queries to combine
    BM25 text scoring with vector similarity using Reciprocal Rank Fusion (RRF) or custom
    scoring functions.

    For organizations already running Elasticsearch for log analytics, application search, or
    observability, adding vector search capabilities avoids the need to introduce a separate
    vector database. The Elastic Learned Sparse Encoder (ELSER) model provides semantic search
    without requiring external embedding models, further simplifying the architecture.
