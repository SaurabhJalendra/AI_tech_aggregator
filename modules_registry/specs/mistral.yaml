knowledge:
  entries:
    - topic: "Mixture of Experts Architecture"
      content: |
        Mistral's MoE (Mixture of Experts) models are a key architectural innovation.
        Instead of a single dense network where every parameter activates for every
        token, MoE models have multiple expert sub-networks. A router network selects
        a subset of experts for each token.

        Mixtral 8x7B has 8 expert networks of ~7B parameters each, but only activates
        2 experts per token. Total parameter count is 46.7B, but active parameters
        per forward pass are only ~12.9B. This means inference cost is similar to a
        13B dense model while capability approaches a 70B dense model.

        Practical implications: MoE models require more memory (all parameters must
        be loaded) but less compute per token. A Mixtral 8x7B needs roughly 90GB of
        GPU memory at FP16 (similar to a 46B dense model) but runs at the speed of
        a 13B model. With INT4 quantization, it fits on a single A100 80GB.

        When to choose MoE vs dense: MoE is ideal when you need high capability
        with high throughput. Dense models (like Llama 70B) are better when memory
        is more constrained than compute, or when you need more predictable per-token
        latency.
      tags: ["architecture", "moe", "efficiency"]

    - topic: "Mistral for Multilingual Applications"
      content: |
        Mistral models have a distinct advantage in multilingual applications,
        particularly for European languages. Key considerations:

        Language coverage: Mistral models perform strongly across French, German,
        Spanish, Italian, Portuguese, Dutch, and other European languages. Performance
        on Asian languages (Chinese, Japanese, Korean) is competitive but Llama and
        GPT-4 may have slight edges.

        Training data balance: Mistral's European origin means more balanced
        representation of European languages in training data compared to
        predominantly English-trained models.

        Multilingual function calling: Mistral Large handles function calling
        reliably across languages -- the function descriptions and arguments can
        be in any supported language without degradation.

        Production recommendation: For applications serving primarily European
        markets, Mistral often provides the best quality-per-cost ratio. For
        global applications spanning many language families, benchmark against
        GPT-4o and Gemini on your specific language mix.
      tags: ["multilingual", "european", "language"]

    - topic: "Apache 2.0 Licensing Advantage"
      content: |
        Mistral's open-weight models use the Apache 2.0 license, which is the most
        permissive among major open-weight LLMs:

        Llama: Uses the Llama Community License, which includes usage restrictions
        (e.g., companies with 700M+ monthly users need a special license) and
        requires accepting Meta's terms.

        Mistral (Apache 2.0): No usage restrictions, no registration required, full
        commercial use, modification, and redistribution rights. The only requirement
        is preserving the license notice.

        This matters for: embedded applications where license compliance is audited,
        products that redistribute model weights to customers, on-device deployments
        where tracking license acceptance is impractical, and organizations with
        strict legal review processes.

        Note: Only Mistral's open-weight models (Mistral 7B, Mixtral 8x7B, Mixtral
        8x22B, Codestral) use Apache 2.0. Mistral Large and other proprietary models
        use standard commercial API terms.
      tags: ["licensing", "open-source", "legal"]

    - topic: "Codestral for Code Generation"
      content: |
        Codestral is Mistral's specialized code generation model, trained specifically
        for programming tasks. Key capabilities:

        Language support: Over 80 programming languages including Python, JavaScript,
        TypeScript, Java, C++, Rust, Go, and more. Strong performance on less common
        languages compared to general-purpose models.

        Fill-in-the-middle (FIM): Codestral supports FIM, where the model generates
        code to fill a gap between a prefix and suffix. This is critical for IDE
        integration and code completion, providing context-aware suggestions that
        account for surrounding code.

        Code review and explanation: Beyond generation, Codestral excels at
        explaining complex code, identifying bugs, suggesting refactoring, and
        generating documentation.

        Deployment: Available via Mistral API or self-hosted. At 22B parameters,
        it fits on a single A100 40GB at FP16 or a consumer GPU with INT4
        quantization. Integration with VS Code and JetBrains via the Continue
        extension.
      tags: ["code", "codestral", "programming"]

    - topic: "Limitations and Considerations"
      content: |
        Key limitations when building with Mistral models:

        1. Smaller context windows than competitors. Mixtral models support 32K-65K
        tokens, compared to 128K+ from Llama, GPT-4, and Claude. For long-document
        tasks, this may require chunking strategies.

        2. Mistral Large is proprietary and API-only. If you need frontier reasoning
        with self-hosting, consider Llama 3.1 405B instead.

        3. The ecosystem is smaller than OpenAI's or Meta's. Fewer fine-tuned
        variants available on Hugging Face, fewer tutorials and examples.

        4. MoE models have higher memory requirements than their active parameter
        count suggests. Plan GPU memory based on total parameters, not active.

        5. Mistral API rate limits and availability may be more constrained than
        major cloud provider endpoints. For high-throughput production, consider
        Bedrock or Azure deployments.

        6. Vision and audio capabilities are not yet available in Mistral models.
        For multimodal needs, consider Gemini, GPT-4o, or Llama 3.2 Vision.
      tags: ["limitations", "trade-offs"]

code_examples:
  - title: "Mistral API with Function Calling"
    language: "python"
    code: |
      from mistralai import Mistral

      client = Mistral(api_key="your-api-key")

      tools = [
          {
              "type": "function",
              "function": {
                  "name": "get_flight_status",
                  "description": "Get status of a flight by flight number",
                  "parameters": {
                      "type": "object",
                      "properties": {
                          "flight_number": {"type": "string"},
                          "date": {"type": "string", "format": "date"}
                      },
                      "required": ["flight_number"]
                  }
              }
          }
      ]

      response = client.chat.complete(
          model="mistral-large-latest",
          messages=[{"role": "user", "content": "What's the status of AF123?"}],
          tools=tools,
          tool_choice="auto"
      )

      # Process tool calls
      for tc in response.choices[0].message.tool_calls:
          print(f"Call: {tc.function.name}({tc.function.arguments})")

  - title: "Self-Hosted Mixtral with vLLM"
    language: "bash"
    code: |
      # Serve Mixtral 8x7B with vLLM
      vllm serve mistralai/Mixtral-8x7B-Instruct-v0.1 \
        --tensor-parallel-size 2 \
        --max-model-len 32768 \
        --quantization awq

      # Query via OpenAI-compatible API
      curl http://localhost:8000/v1/chat/completions \
        -H "Content-Type: application/json" \
        -d '{
          "model": "mistralai/Mixtral-8x7B-Instruct-v0.1",
          "messages": [
            {"role": "user", "content": "Explain the MoE architecture."}
          ],
          "max_tokens": 1024
        }'

  - title: "Codestral Fill-in-the-Middle"
    language: "python"
    code: |
      from mistralai import Mistral

      client = Mistral(api_key="your-api-key")

      response = client.fim.complete(
          model="codestral-latest",
          prompt="def fibonacci(n):\n    ",
          suffix="\n    return result",
          max_tokens=256,
          temperature=0
      )
      print(response.choices[0].message.content)

