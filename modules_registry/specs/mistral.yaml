identity:
  tagline: "European AI lab offering both open-weight and proprietary models with strong multilingual capabilities"
  description: |
    Mistral AI is a Paris-based AI company offering a spectrum of models from fully
    open-weight (Mistral 7B, Mixtral 8x7B, Mixtral 8x22B) to proprietary frontier
    models (Mistral Large, Mistral Medium). This dual approach gives teams flexibility
    to start with open-weight models for experimentation and self-hosting, then
    optionally use Mistral's API for higher-capability proprietary models.

    Mistral pioneered the Mixture of Experts (MoE) architecture for production LLMs
    with Mixtral, which activates only a subset of parameters per token, achieving
    strong performance at lower inference cost than comparably capable dense models.
    Mixtral 8x7B offers 70B-class performance with the inference cost of a 13B model.

    Mistral models are particularly strong in European languages and multilingual
    tasks, reflecting the company's European origin and training data emphasis. The
    models also excel at code generation, function calling, and structured output.

    Mistral's open-weight models are released under the Apache 2.0 license, the most
    permissive among major open-weight LLMs, with no usage restrictions or registration
    requirements. This makes them attractive for embedded applications, on-device
    deployment, and scenarios where licensing simplicity matters.
