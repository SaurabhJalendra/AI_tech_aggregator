identity:
  tagline: "AI-powered document parser for complex PDFs, tables, and structured documents"
  description: |
    LlamaParse is a managed document parsing service by LlamaIndex that uses AI models to
    extract structured content from complex documents including PDFs, PowerPoints, Word
    documents, and more. Unlike traditional parsers that rely on rule-based extraction,
    LlamaParse uses vision-language models to understand document layout, tables, charts,
    and hierarchical structure.

    The key advantage of LlamaParse is its ability to accurately parse complex tables,
    multi-column layouts, embedded images with captions, and nested structures that defeat
    traditional PDF extractors. It outputs clean markdown with preserved structure, making
    it ideal for downstream chunking and RAG pipelines.

    LlamaParse is offered as a cloud API with a free tier (1000 pages/day) and paid plans
    for higher volume. It integrates natively with LlamaIndex but can be used standalone
    with any RAG framework.
  logo_url: "/assets/modules/llamaparse.svg"
  website: "https://cloud.llamaindex.ai"
  documentation: "https://docs.cloud.llamaindex.ai/llamaparse/getting_started"
  github: "https://github.com/run-llama/llama_parse"
  license: "Proprietary"
  pricing_model: "freemium"

