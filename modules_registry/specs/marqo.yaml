knowledge:
  entries:
    - topic: "Marqo's Integrated Approach"
      content: |
        Most vector databases require a separate embedding pipeline: you generate
        embeddings with a model (e.g., OpenAI, Sentence Transformers), then store
        them in the database. This creates operational complexity and potential
        inconsistencies.

        Marqo integrates the embedding model into the search engine itself.
        When you add a document, Marqo generates the embedding internally.
        When you search, it embeds the query with the same model. This ensures
        consistency and simplifies the architecture.

        The trade-off is less flexibility in embedding model choice (limited to
        supported models) and coupling between the search engine and embedding
        model. For teams that want full control over their embedding pipeline,
        a separate model + vector database approach is more appropriate.
      tags: ["architecture", "comparison"]

code_examples:
  - title: "End-to-End Search"
    language: "python"
    code: |
      import marqo

      mq = marqo.Client(url="http://localhost:8882")

      # Create index with built-in model
      mq.create_index("my-docs", model="hf/all-MiniLM-L6-v2")

      # Add documents (no embedding needed!)
      mq.index("my-docs").add_documents([
          {"title": "Vector Database Guide", "content": "How to choose a vector DB..."},
          {"title": "RAG Architecture", "content": "Building retrieval-augmented generation..."},
          {"title": "LLM Deployment", "content": "Best practices for serving LLMs..."}
      ])

      # Search with text
      results = mq.index("my-docs").search("How to build a search system?")
      for hit in results["hits"]:
          print(f"{hit['title']}: {hit['_score']:.3f}")

benchmarks:
