meta:
  slug: "marqo"
  name: "Marqo"
  version: "1.0.0"
  category: "vector_databases"
  subcategory: "tensor_search"
  status: "stable"
  last_updated: "2026-02-28"
  maintainer: "system"

identity:
  tagline: "End-to-end tensor search engine with built-in embedding generation"
  description: |
    Marqo is an open-source tensor search engine that combines embedding
    generation and vector search in a single platform. Unlike most vector
    databases that require you to generate embeddings externally, Marqo
    handles the entire pipeline: it accepts raw text or images, generates
    embeddings using built-in models, indexes them, and performs search.

    Marqo supports both text and image search, multi-modal search (search
    images with text queries and vice versa), and hybrid text-vector search.
    It uses HNSW indexing for fast approximate nearest neighbor search and
    supports metadata filtering.

    The integrated approach simplifies the search pipeline by eliminating
    the need for separate embedding and indexing steps. Marqo is available
    as open-source (self-hosted) and as a managed cloud service.
  logo_url: "/assets/modules/marqo.svg"
  website: "https://www.marqo.ai"
  documentation: "https://docs.marqo.ai"
  github: "https://github.com/marqo-ai/marqo"
  license: "Apache-2.0"
  pricing_model: "freemium"

capabilities:
  primary_use_cases:
    - "End-to-end semantic search"
    - "Multi-modal search (text + images)"
    - "E-commerce product search"
    - "Content recommendation"
    - "Document search without embedding pipeline"
  supported_operations:
