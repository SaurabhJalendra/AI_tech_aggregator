    justification: "Good search performance with HNSW. Built-in embedding adds latency to indexing but simplifies the overall pipeline."
  scalability:
    score: 6
    justification: "Self-hosted scales with hardware. Cloud service handles larger workloads. Not as battle-tested at massive scale."
  ease_of_use:
    score: 9
    justification: "No separate embedding pipeline needed. Send text, get search results. Extremely low barrier to entry."
  cost_efficiency:
    score: 7
    justification: "Open-source with self-hosting option. Cloud service pricing is competitive."
  community:
    score: 5
    justification: "Smaller community than established vector databases. Active development but fewer third-party resources."
  maturity:
