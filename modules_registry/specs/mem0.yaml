knowledge:
  entries:
    - topic: "Memory Architecture"
      content: |
        Mem0's memory system works in layers:

        1. Memory Extraction: When a conversation is added, an LLM extracts
        key facts, preferences, and information as discrete memory entries.

        2. Memory Storage: Extracted memories are embedded and stored in a
        vector database with metadata (user ID, timestamp, category).

        3. Conflict Resolution: When new information contradicts existing
        memories, Mem0 uses an LLM to determine whether to update, merge,
        or keep both versions.

        4. Memory Retrieval: When context is needed, relevant memories are
        retrieved via semantic search and injected into the LLM prompt.

        This architecture enables AI assistants to build up a persistent
        understanding of each user over time, similar to how a human assistant
        would remember details about clients.
      tags: ["architecture", "memory", "design"]

code_examples:
  - title: "Basic Memory Usage"
    language: "python"
    code: |
      from mem0 import Memory

      m = Memory()

      # Add memories from a conversation
      m.add(
          "I prefer Python over JavaScript and use VS Code as my editor.",
          user_id="alice"
      )

      m.add(
          "My current project uses FastAPI with PostgreSQL.",
          user_id="alice"
      )

      # Search relevant memories
      memories = m.search("What programming tools does Alice use?", user_id="alice")
      for mem in memories:
          print(f"Memory: {mem['memory']}")
          print(f"Score: {mem['score']}")

  - title: "Agent with Persistent Memory"
    language: "python"
    code: |
      from mem0 import Memory
      from openai import OpenAI

      memory = Memory()
      client = OpenAI()

      def chat_with_memory(user_id: str, message: str) -> str:
          # Retrieve relevant memories
          relevant = memory.search(message, user_id=user_id, limit=5)
          memory_context = "\n".join([m["memory"] for m in relevant])

          # Generate response with memory context
          response = client.chat.completions.create(
              model="gpt-4o",
              messages=[
                  {"role": "system", "content": f"User memories:\n{memory_context}"},
                  {"role": "user", "content": message}
              ]
          )

          answer = response.choices[0].message.content

          # Store new memories from this interaction
          memory.add(f"User: {message}\nAssistant: {answer}", user_id=user_id)

          return answer

