identity:
  tagline: "Memory layer for AI agents and LLM applications"
  description: |
    Mem0 (formerly Embedchain) is a memory management system for AI agents and
    LLM applications. It provides a structured way to store, retrieve, and manage
    memories across conversations and sessions, enabling AI assistants to remember
    user preferences, past interactions, and learned information.

    Mem0 uses a combination of vector search and knowledge graph storage to
    maintain both semantic memories (facts and information) and episodic memories
    (conversation history). It supports automatic memory extraction from
    conversations, conflict resolution when new information contradicts existing
    memories, and memory decay for relevance management.

    The library integrates with popular LLM frameworks and can use various
    vector databases and LLM providers as backends. It is available as both
    an open-source library and a managed cloud service.
  logo_url: "/assets/modules/mem0.svg"
  website: "https://mem0.ai"
  documentation: "https://docs.mem0.ai"
  github: "https://github.com/mem0ai/mem0"
  license: "Apache-2.0"
  pricing_model: "freemium"

