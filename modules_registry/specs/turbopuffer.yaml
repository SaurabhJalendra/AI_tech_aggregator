identity:
  tagline: "Serverless vector database with storage-optimized architecture for cost-efficient search"
  description: |
    Turbopuffer is a serverless vector database designed for cost-efficient
    vector search at scale. It uses a storage-optimized architecture that keeps
    data on object storage (S3) with intelligent caching, achieving significantly
    lower costs than memory-resident vector databases while maintaining good
    query performance.

    Turbopuffer is designed for workloads where cost efficiency matters more
    than ultra-low latency. By leveraging object storage instead of keeping
    all vectors in memory, it can handle very large datasets at a fraction
    of the cost of memory-resident alternatives like Pinecone or Weaviate.

    The service provides a simple REST API with namespace-based data isolation,
    attribute filtering, and automatic scaling. It is particularly well-suited
    for applications with large vector datasets and moderate query latency
    requirements.
  logo_url: "/assets/modules/turbopuffer.svg"
  website: "https://turbopuffer.com"
  documentation: "https://turbopuffer.com/docs"
  github: "https://github.com/turbopuffer"
  license: "Proprietary"
  pricing_model: "paid"

