technical_specs:
  agent_patterns:
    - name: "Router Agent"
      description: "Routes queries to the most appropriate retriever or data source based on query analysis"
      complexity: "low"
      typical_llm_calls: "1-2"
    - name: "Sub-Question Agent"
      description: "Decomposes complex queries into sub-questions, retrieves for each, synthesizes"
      complexity: "medium"
      typical_llm_calls: "3-8"
    - name: "Self-Reflective Agent (Corrective RAG)"
      description: "Retrieves, evaluates relevance, re-retrieves or reformulates if quality is low"
      complexity: "medium"
      typical_llm_calls: "2-5"
    - name: "Multi-Step Research Agent"
      description: "Performs iterative research with planning, retrieval, analysis, and follow-up"
      complexity: "high"
      typical_llm_calls: "5-20"
    - name: "Tool-Augmented RAG Agent"
      description: "Combines retrieval with tools (calculators, APIs, databases) for comprehensive answers"
      complexity: "high"
      typical_llm_calls: "3-10"
  supported_llms:
    - "GPT-4o (recommended for complex reasoning)"
    - "Claude 3.5 Sonnet / Claude 4 Opus"
    - "Gemini 1.5 Pro"
    - "Llama 3 70B+ (for self-hosted)"
