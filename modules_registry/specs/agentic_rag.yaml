identity:
  tagline: "Agent-driven RAG patterns that dynamically plan, retrieve, and reason over multiple sources"
  description: |
    Agentic RAG represents a paradigm shift from static retrieve-then-generate pipelines to
    dynamic, agent-driven retrieval workflows. Instead of a fixed sequence of retrieval steps,
    an LLM agent decides what to retrieve, when to retrieve, and whether the retrieved
    information is sufficient to answer the question - iterating as needed.

    In traditional RAG, the pipeline is predetermined: embed query, retrieve top-k chunks,
    generate answer. Agentic RAG replaces this with an intelligent agent that can decompose
    complex questions, query multiple data sources, evaluate retrieval quality, perform
    follow-up searches, and synthesize information from multiple retrieval rounds.

    Key patterns include: (1) Routing agents that direct queries to the most appropriate
    data source, (2) Multi-step agents that break complex queries into sub-questions and
    retrieve iteratively, (3) Self-reflective agents that evaluate their own answers and
    re-retrieve if quality is insufficient, and (4) Tool-using agents that combine retrieval
    with computation, API calls, or database queries.

    Agentic RAG is particularly valuable for complex enterprise queries that span multiple
    knowledge bases, require reasoning across documents, or need real-time data augmentation.
    The trade-off is higher latency, cost, and complexity compared to simple RAG pipelines.
