comparison_dimensions:
  performance:
    score: 9
    justification: "Significantly outperforms static RAG on complex, multi-hop, and multi-source queries. Self-correction reduces hallucination and incomplete answers."
  scalability:
    score: 5
    justification: "Multiple LLM calls per query increase cost and latency linearly with query complexity. Not suitable for high-throughput simple queries."
  ease_of_use:
    score: 5
    justification: "Requires understanding of agent patterns, prompt engineering for agent behavior, and careful error handling for multi-step workflows."
  cost_efficiency:
    score: 4
    justification: "3-20x more LLM calls per query compared to standard RAG. Cost-effective only when query complexity justifies the additional computation."
  community:
    score: 7
    justification: "Rapidly growing interest with active research and framework development. LlamaIndex and LangChain provide strong foundations."
  maturity:
    score: 5
    justification: "Emerging pattern with limited production case studies. Agent reliability and predictability are active challenges."
  flexibility:
    score: 9
    justification: "Highly adaptable to different domains and query types. Agent behavior can be customized through prompting and tool configuration."
  data_privacy:
    score: 6
    justification: "Multiple LLM calls increase the surface area for data exposure. Can use self-hosted LLMs but with increased infrastructure complexity."

knowledge:
  entries:
    - topic: "Agentic RAG Patterns"
      content: |
        Agentic RAG encompasses several distinct patterns, each suited to different use cases:

        1. Router Pattern: The simplest agentic pattern. An LLM analyzes the incoming query
        and routes it to the most appropriate retriever or data source. For example, routing
        technical questions to a code documentation index and business questions to a policy
        document index. This adds one LLM call but significantly improves retrieval relevance
        for multi-domain applications.

        2. Sub-Question Decomposition: For complex queries like "Compare the cost and
        performance of Pinecone vs Weaviate for a 10M vector deployment," the agent decomposes
        this into sub-questions: "What is Pinecone's pricing for 10M vectors?", "What is
        Weaviate's pricing at that scale?", "Pinecone performance benchmarks?", etc. Each
        sub-question is retrieved independently, and results are synthesized.

        3. Corrective RAG (CRAG): After initial retrieval, the agent evaluates whether the
        retrieved documents are relevant and sufficient. If relevance is low, the agent
        reformulates the query or searches alternative sources. This self-correction loop
        significantly reduces hallucination from irrelevant context.

        4. Adaptive RAG: Combines routing, retrieval, and self-reflection. The agent first
        classifies the query complexity, then selects the appropriate strategy: direct LLM
        response for simple questions, single retrieval for factual questions, or multi-step
        retrieval for complex questions.
      tags: ["patterns", "architecture", "core"]

    - topic: "When to Use Agentic RAG"
      content: |
        Agentic RAG provides the most value in these scenarios:

        1. Multi-source queries: When the answer requires information from multiple knowledge
        bases, databases, or APIs. Example: "What is our current AWS spend on ML infrastructure,
        and how does it compare to industry benchmarks?"

        2. Complex reasoning: When the query requires multi-step reasoning, comparison, or
        analysis that a single retrieval cannot satisfy. Example: "Which of our microservices
        are most at risk of failure based on recent incident patterns and dependency analysis?"

        3. Variable query complexity: When queries range from simple fact lookup to complex
        analysis. An adaptive agent can match response effort to query complexity.

        4. Quality-critical applications: When hallucination or incomplete answers are
        unacceptable. Self-reflective agents that verify their own answers before responding
        provide higher answer quality.

        Agentic RAG is NOT recommended when:
        - Query volume is very high and latency must be under 1 second
        - Queries are uniformly simple and well-served by standard RAG
        - Budget is constrained (agent workflows cost 3-20x standard RAG)
        - Deterministic, reproducible responses are required (agents introduce non-determinism)
      tags: ["decision", "when-to-use"]

    - topic: "Implementation with LangGraph"
      content: |
        LangGraph is particularly well-suited for agentic RAG because it provides stateful,
        graph-based agent workflows with explicit control flow.

        A typical LangGraph agentic RAG workflow:
        1. START node: Receives user query
        2. Classify node: Determines query complexity and type
        3. Route node: Directs to appropriate retrieval strategy
        4. Retrieve node: Performs retrieval from selected source(s)
        5. Evaluate node: Assesses retrieval quality (relevance, completeness)
        6. Decision node: If quality is sufficient, proceed to generate; otherwise, loop back
           to retrieve with reformulated query
        7. Generate node: Produces final answer from retrieved context
        8. END node: Returns response

        LangGraph advantages for agentic RAG:
        - Explicit state management across retrieval rounds
        - Conditional edges for dynamic routing
        - Built-in retry and error handling
        - Visualization of agent workflow for debugging
        - Streaming support for real-time feedback

        The graph-based approach makes the agent behavior more predictable and debuggable
        compared to freeform agent loops, which is critical for production deployments.
      tags: ["langgraph", "implementation", "workflow"]

    - topic: "Challenges and Best Practices"
      content: |
        Key challenges when building agentic RAG systems:

        1. Agent reliability: Agents can enter infinite loops, make poor routing decisions,
        or fail to converge on an answer. Mitigate with maximum iteration limits, timeout
        mechanisms, and fallback strategies (e.g., fall back to standard RAG after 3 failed
        agent iterations).

        2. Latency management: Multi-step retrieval adds significant latency. Mitigate with
        parallel sub-question retrieval, streaming intermediate results to the user, and
        caching frequently used agent decisions.

        3. Cost control: Implement token budgets per query to prevent runaway costs. Log
        and monitor per-query LLM call counts. Use cheaper models for routing and evaluation
        steps, reserving expensive models for final generation.

        4. Observability: Agentic workflows are harder to debug than linear pipelines. Use
        tracing tools (LangSmith, Phoenix, Weights & Biases) to log every agent decision,
        retrieval result, and evaluation score.

        5. Testing: Test agent behavior with a diverse set of queries covering simple,
        complex, multi-source, and adversarial cases. Evaluate not just answer quality but
        also the efficiency of the agent's retrieval strategy.

        Best practice: Start with the simplest agent pattern that solves your problem (router),
        and add complexity (sub-questions, self-reflection) only when evaluation shows the
        need.
      tags: ["challenges", "best-practices", "production"]

code_examples:
  - title: "Router Agent with LlamaIndex"
    language: "python"
    code: |
      from llama_index.core.query_engine import RouterQueryEngine
      from llama_index.core.selectors import LLMSingleSelector
      from llama_index.core.tools import QueryEngineTool

      # Create query engines for different data sources
      tech_tool = QueryEngineTool.from_defaults(
          query_engine=tech_docs_engine,
          description="Technical documentation about infrastructure and code"
      )
      policy_tool = QueryEngineTool.from_defaults(
          query_engine=policy_docs_engine,
          description="Company policies, compliance, and business processes"
      )
      metrics_tool = QueryEngineTool.from_defaults(
          query_engine=metrics_engine,
          description="Performance metrics, dashboards, and monitoring data"
      )

      # Router automatically selects the right source
      router_engine = RouterQueryEngine(
          selector=LLMSingleSelector.from_defaults(),
          query_engine_tools=[tech_tool, policy_tool, metrics_tool]
      )

      response = router_engine.query(
          "What is our SLA for API response times?"
      )  # Routes to policy_docs_engine

  - title: "Corrective RAG with LangGraph"
    language: "python"
    code: |
      from langgraph.graph import StateGraph, END
      from typing import TypedDict, List

      class AgentState(TypedDict):
          query: str
          documents: List[str]
          generation: str
          relevance_score: float
          attempts: int

      def retrieve(state: AgentState):
          docs = retriever.invoke(state["query"])
          return {"documents": [d.page_content for d in docs]}

      def evaluate_relevance(state: AgentState):
          # LLM evaluates if retrieved docs are relevant
          score = relevance_evaluator.invoke({
              "query": state["query"],
              "documents": state["documents"]
          })
          return {"relevance_score": score}

      def should_retry(state: AgentState):
          if state["relevance_score"] > 0.7:
              return "generate"
          if state["attempts"] >= 3:
              return "generate"  # Fallback after max attempts
          return "reformulate"

      def reformulate_query(state: AgentState):
          new_query = query_rewriter.invoke(state["query"])
          return {"query": new_query, "attempts": state["attempts"] + 1}

      def generate(state: AgentState):
          answer = llm.invoke({
              "context": state["documents"],
              "query": state["query"]
          })
          return {"generation": answer}

      # Build the graph
      graph = StateGraph(AgentState)
      graph.add_node("retrieve", retrieve)
      graph.add_node("evaluate", evaluate_relevance)
      graph.add_node("reformulate", reformulate_query)
      graph.add_node("generate", generate)

      graph.set_entry_point("retrieve")
      graph.add_edge("retrieve", "evaluate")
      graph.add_conditional_edges("evaluate", should_retry)
      graph.add_edge("reformulate", "retrieve")
      graph.add_edge("generate", END)

      app = graph.compile()
      result = app.invoke({"query": "...", "attempts": 0})

  - title: "Sub-Question Agent with LlamaIndex"
    language: "python"
    code: |
      from llama_index.core.query_engine import SubQuestionQueryEngine
      from llama_index.core.tools import QueryEngineTool, ToolMetadata

      # Define tools for different knowledge domains
      tools = [
          QueryEngineTool(
              query_engine=vector_db_engine,
              metadata=ToolMetadata(
                  name="vector_databases",
                  description="Information about vector databases: "
                  "Pinecone, Weaviate, Qdrant, Milvus, ChromaDB"
              )
          ),
          QueryEngineTool(
              query_engine=embedding_engine,
              metadata=ToolMetadata(
                  name="embeddings",
                  description="Information about embedding models "
                  "and techniques"
              )
          ),
          QueryEngineTool(
              query_engine=deployment_engine,
              metadata=ToolMetadata(
                  name="deployment",
                  description="ML deployment, infrastructure, "
                  "and operations"
              )
          )
      ]

      # Agent decomposes complex queries into sub-questions
      agent = SubQuestionQueryEngine.from_defaults(
          query_engine_tools=tools,
          llm=llm
      )

      # Complex query gets decomposed automatically
      response = agent.query(
          "Design a production RAG system for a 10M document "
          "knowledge base with sub-second latency requirements. "
          "What vector database, embedding model, and deployment "
          "architecture should I use?"
      )

