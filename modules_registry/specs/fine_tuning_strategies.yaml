identity:
  tagline: "Comprehensive guide to fine-tuning approaches for adapting LLMs to domain-specific tasks"
  description: |
    Fine-tuning is the process of further training a pre-trained language model on
    task-specific or domain-specific data to improve its performance on targeted
    applications. This module covers the strategic landscape of fine-tuning: when to
    fine-tune vs. use prompting or RAG, which approach to select, how to prepare data,
    and how to evaluate results.

    The fine-tuning landscape has evolved significantly. Full fine-tuning (updating all
    model parameters) remains the gold standard for maximum customization but requires
    substantial compute. Parameter-efficient fine-tuning (PEFT) methods like LoRA and
    QLoRA have democratized fine-tuning by reducing GPU requirements by 10-100x while
    retaining 90-95% of full fine-tuning quality.

    Beyond supervised fine-tuning (SFT), alignment techniques like RLHF and DPO enable
    training models to follow preferences and policies, adjusting not just what the
    model knows but how it behaves. These techniques are essential for safety alignment,
    brand voice consistency, and output style control.

    The key decision framework is: use prompting for quick experiments and simple
    customization, use RAG for adding knowledge, and use fine-tuning for changing
    behavior, output format, or deep domain expertise. These approaches are
    complementary and are often combined in production systems.
