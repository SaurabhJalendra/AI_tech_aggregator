identity:
  tagline: "Industry-leading large language models powering the modern AI ecosystem"
  description: |
    OpenAI provides the GPT family of large language models, including GPT-4o, GPT-4.5,
    and the reasoning-focused o1 and o3 series. These models are accessible via a REST API
    and power a vast ecosystem of AI applications, from chatbots to code generation to
    complex multi-step reasoning tasks.

    The OpenAI API offers a unified interface for chat completions, embeddings, image
    generation (DALL-E), text-to-speech, speech-to-text (Whisper), and fine-tuning.
    Function calling (tool use) is a first-class feature, enabling structured agent
    workflows where the model can invoke external tools and APIs.

    OpenAI models consistently rank at or near the top of public benchmarks for general
    reasoning, code generation, and instruction following. The trade-offs include higher
    cost compared to open-source alternatives, lack of on-premises deployment options
    (outside Azure OpenAI), and limited transparency into model weights and training data.
  logo_url: "/assets/modules/openai.svg"
  website: "https://openai.com"
  documentation: "https://platform.openai.com/docs"
  github: "https://github.com/openai/openai-python"
  license: "Proprietary"
  pricing_model: "paid"

