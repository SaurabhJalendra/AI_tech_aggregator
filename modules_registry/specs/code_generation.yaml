identity:
  tagline: "AI-powered code generation techniques and tools for automated software development"
  description: |
    Code generation encompasses the set of AI techniques, models, and tools that automatically
    produce source code from natural language descriptions, partial code context, or formal
    specifications. This has become one of the most impactful applications of large language
    models, fundamentally changing how software is written.

    Modern code generation spans a wide spectrum: from inline code completion (GitHub Copilot,
    Cursor) to full-program synthesis from natural language (Claude, GPT-4), to specialized
    code models optimized for programming tasks (CodeLlama, DeepSeek Coder, StarCoder). The
    field also includes code translation between languages, test generation, bug fixing,
    documentation generation, and code review.

    The architecture of code generation systems typically involves a large language model
    (either general-purpose or code-specialized) augmented with context retrieval (codebase
    search, documentation lookup, API references) and output validation (syntax checking,
    type checking, test execution). Agent-based systems like Claude Code, Devin, and SWE-Agent
    take this further by autonomously planning, executing, and iterating on code changes.
  logo_url: "/assets/modules/code_generation.svg"
  website: "https://github.com/features/copilot"
  documentation: "https://docs.github.com/en/copilot"
  license: "Various"
  pricing_model: "freemium"

