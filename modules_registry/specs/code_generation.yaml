knowledge:
  entries:
    - topic: "Code Generation Architecture Patterns"
      content: |
        Modern code generation systems use several architectural patterns:

        1. Direct Generation: Send a prompt to an LLM and receive code. Simple but limited
        by context window and lacks awareness of the broader codebase. Works well for
        standalone functions and scripts.

        2. Retrieval-Augmented Generation (RAG): Index the codebase and retrieve relevant
        files, functions, and documentation as context for the LLM. This enables codebase-aware
        generation that follows existing patterns and conventions. Tools like Cursor and
        Continue use this approach.

        3. Agent-Based Generation: An LLM agent that can read files, write code, run tests,
        and iterate based on results. Claude Code, Devin, and SWE-Agent represent this
        pattern. The agent plans changes across multiple files, executes them, validates
        through testing, and self-corrects.

        4. Fine-Tuned Models: Models trained or fine-tuned specifically on code (CodeLlama,
        StarCoder, DeepSeek Coder). These are more efficient for pure code tasks but less
        capable at reasoning about complex requirements compared to frontier general models.

        The trend is toward agent-based systems that combine all these patterns: retrieve
        context from the codebase, generate code using a powerful LLM, validate through
        execution, and iterate until the task is complete.
      tags: ["architecture", "patterns", "agents"]

    - topic: "Choosing the Right Code Generation Approach"
      content: |
        The choice of code generation approach depends on the task complexity and requirements:

        Inline Completion (Copilot, Cursor Tab): Best for routine code, boilerplate, and
        pattern completion. Provides 2-5x speed improvement for common coding tasks. Low
        risk since the developer reviews each suggestion in real-time.

        Chat-Based Generation (Claude, GPT-4, Cursor Chat): Best for generating complete
        functions, explaining code, debugging, and design discussions. Works well when you
        can describe what you want in natural language.

        Agent-Based Generation (Claude Code, Copilot Workspace): Best for multi-file changes,
        feature implementation, and refactoring. The agent handles planning and execution
        across the codebase. Requires clear task specification and review of results.

        Specialized Models (DeepSeek Coder, CodeLlama): Best when self-hosting is required
        for privacy, cost optimization at scale, or when you need to fine-tune on proprietary
        code patterns. Performance gap with frontier models is narrowing.

        For enterprise adoption, start with inline completion (lowest risk, highest ROI),
        then expand to chat-based generation, and finally agent-based tools as teams develop
        effective review practices for AI-generated code.
      tags: ["decision", "comparison", "enterprise"]

    - topic: "Code Generation Best Practices"
      content: |
        Key best practices for effective code generation:

        1. Provide clear context: Include relevant type definitions, function signatures,
        and examples in the prompt. The more context the model has about your codebase
        conventions, the better the output.

        2. Specify constraints explicitly: Language version, framework, coding style, error
        handling approach, and performance requirements should be stated upfront.

        3. Use iterative refinement: Generate an initial version, then refine through
        follow-up prompts. Complex code rarely comes out perfect on the first generation.

        4. Always review and test: AI-generated code can contain subtle bugs, security
        vulnerabilities, or logic errors. Treat generated code the same as a junior
        developer's pull request.

        5. Leverage test-driven generation: Write tests first (or describe expected behavior),
        then generate implementation. This gives the model clear success criteria and makes
        validation straightforward.

        6. Be aware of training data cutoffs: Models may generate code using deprecated APIs
        or outdated patterns. Provide documentation for newer APIs in the context.

        7. Separate generation from sensitive data: Avoid including API keys, credentials,
        or PII in prompts to code generation tools, especially cloud-based ones.
      tags: ["best-practices", "tips"]

    - topic: "Evaluation and Benchmarks"
      content: |
        Code generation quality is measured through several benchmarks:

        HumanEval: 164 Python programming problems testing function-level generation.
        Top models achieve 90%+ pass@1. Widely used but limited to simple, self-contained
        problems.

        MBPP (Mostly Basic Programming Problems): 974 crowd-sourced Python problems.
        Broader coverage than HumanEval but still focused on isolated functions.

        SWE-bench: Real GitHub issues requiring multi-file changes in real repositories.
        Much more representative of actual software engineering. Top agents solve 40-50%
        of issues (as of early 2026), compared to 15-20% a year ago.

        LiveCodeBench: Continuously updated benchmark using new competitive programming
        problems, avoiding contamination from training data.

        Key metrics: pass@1 (first attempt success), pass@k (success in k attempts),
        and for agents: resolution rate (percentage of tasks completed correctly).

        In practice, benchmark scores don't fully predict real-world utility. Factors like
        context utilization, instruction following, and codebase awareness matter more than
        performance on isolated problems.
      tags: ["evaluation", "benchmarks", "metrics"]

code_examples:
  - title: "Code Generation with Claude API"
    language: "python"
    code: |
      import anthropic

      client = anthropic.Anthropic()

      response = client.messages.create(
          model="claude-sonnet-4-20250514",
          max_tokens=4096,
          system="You are an expert software engineer. Generate clean, well-documented code.",
          messages=[
              {
                  "role": "user",
                  "content": """
                  Create a Python FastAPI endpoint that:
                  1. Accepts a JSON body with 'query' and optional 'filters' fields
                  2. Performs vector search against a Pinecone index
                  3. Returns ranked results with metadata
                  4. Includes proper error handling and input validation
                  """
              }
          ]
      )

      print(response.content[0].text)

  - title: "Test-Driven Code Generation"
    language: "python"
    code: |
      import anthropic

      client = anthropic.Anthropic()

      # Provide tests first, then ask for implementation
      response = client.messages.create(
          model="claude-sonnet-4-20250514",
          max_tokens=4096,
          messages=[
              {
                  "role": "user",
                  "content": """
                  Here are the tests. Write the implementation that passes all of them:

                  ```python
                  def test_chunk_text_basic():
                      result = chunk_text("Hello world. This is a test.", chunk_size=20, overlap=5)
                      assert len(result) >= 2
                      assert all(len(c) <= 20 for c in result)

                  def test_chunk_text_overlap():
                      text = "ABCDEFGHIJ" * 5
                      chunks = chunk_text(text, chunk_size=15, overlap=5)
                      for i in range(len(chunks) - 1):
                          assert chunks[i][-5:] == chunks[i+1][:5]

                  def test_chunk_text_empty():
                      assert chunk_text("", chunk_size=10, overlap=2) == []
                  ```
                  """
              }
          ]
      )

  - title: "RAG-Enhanced Code Generation"
    language: "python"
    code: |
      from langchain_anthropic import ChatAnthropic
      from langchain_core.prompts import ChatPromptTemplate

      # Retrieve relevant code context from codebase
      def get_code_context(query: str, codebase_retriever) -> str:
          """Retrieve relevant files and functions from the codebase."""
          docs = codebase_retriever.invoke(query)
          return "\n\n".join([
              f"# File: {doc.metadata['file_path']}\n{doc.page_content}"
              for doc in docs
          ])

      llm = ChatAnthropic(model="claude-sonnet-4-20250514")

      prompt = ChatPromptTemplate.from_template("""
      You are generating code for an existing codebase. Follow the patterns
      and conventions shown in the context below.

      Relevant codebase context:
      {context}

      Task: {task}

      Generate code that integrates naturally with the existing codebase.
      """)

      chain = prompt | llm

      result = chain.invoke({
          "context": get_code_context("user authentication", retriever),
          "task": "Add a password reset endpoint following existing auth patterns"
      })

