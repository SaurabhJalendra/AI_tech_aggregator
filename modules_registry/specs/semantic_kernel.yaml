knowledge:
  entries:
    - topic: "Kernel, Plugins, and Functions"
      content: |
        The Kernel is the central orchestrator in Semantic Kernel. It manages AI services
        (LLM connections), plugins (function collections), and memory (vector stores). Think
        of it as a dependency injection container specialized for AI operations.

        Plugins are collections of KernelFunctions that represent capabilities. There are two
        types of functions:
        - Native functions: Regular code (C#, Python, Java) decorated with @kernel_function.
          These are deterministic operations like database queries, API calls, or calculations.
        - Prompt functions: LLM-powered functions defined by prompt templates. These handle
          tasks requiring natural language understanding or generation.

        Auto Function Calling is a key feature: when enabled, the Kernel automatically detects
        when the LLM wants to call a function, executes it, and feeds the result back to the
        LLM. This creates a natural tool-use loop without manual intervention. The developer
        just registers functions and lets the Kernel handle orchestration.

        This plugin architecture mirrors enterprise software patterns, making it natural for
        teams already using dependency injection and service-oriented design.
      tags: ["kernel", "plugins", "core"]

    - topic: "Agent Framework"
      content: |
        Semantic Kernel's agent framework provides abstractions for building AI agents:

        ChatCompletionAgent: A simple agent backed by any chat completion model. Supports
        auto function calling with registered plugins. Good for single-agent scenarios
        and building blocks for multi-agent systems.

        OpenAIAssistantAgent: Wraps OpenAI's Assistants API, providing managed threads,
        file search, and code interpreter capabilities. Useful when you want OpenAI to
        manage conversation state.

        AgentGroupChat: Orchestrates conversations between multiple agents. Supports
        selection strategies (round-robin, custom) and termination strategies (function-based,
        message count, keyword detection). Agents can have different LLMs, plugins, and
        system prompts.

        Agent collaboration patterns: (1) Sequential — agents take turns in order.
        (2) Handoff — agents route to specific other agents based on context.
        (3) Collaborative — a selection strategy picks the best agent for each turn.
        (4) Hierarchical — a coordinator agent manages sub-agents.
      tags: ["agents", "multi-agent", "orchestration"]

    - topic: "Process Framework for Business Workflows"
      content: |
        The Process Framework (in preview) enables building complex, event-driven business
        workflows that combine AI agents with traditional business logic:

        KernelProcess: Defines a workflow as a series of steps with state and transitions.
        Steps can be AI-powered (agent calls) or traditional code (database operations,
        API calls, approvals).

        Key capabilities:
        - Event-driven execution: Steps emit and respond to events
        - Durable execution: Workflow state persists across failures and restarts
        - Human-in-the-loop: Steps can pause and wait for human input or approval
        - State management: Each step maintains typed state that persists across executions
        - Nested processes: Processes can contain sub-processes for complex workflows

        Example use case: A document review process where (1) an AI agent extracts key
        information, (2) a human reviewer approves or requests changes, (3) an agent
        generates a summary, (4) the summary is stored in a database, and (5) stakeholders
        are notified. The Process Framework orchestrates this end-to-end with state
        management and error handling.
      tags: ["process", "workflow", "enterprise"]

    - topic: "When to Choose Semantic Kernel"
      content: |
        Semantic Kernel is the right choice when: (1) You're building in the Microsoft
        ecosystem — Azure OpenAI, .NET, Microsoft 365. The integration is seamless and
        leverages existing enterprise infrastructure. (2) You need multi-language support —
        SK is the only major framework with first-class .NET, Python, AND Java SDKs.
        (3) Your team has enterprise software engineering background — the plugin/DI
        architecture feels natural to .NET and Java developers. (4) You need durable
        business process orchestration — the Process Framework handles long-running,
        stateful workflows with human approval. (5) You're building Copilot-style
        experiences — SK is literally the foundation of Microsoft Copilot.

        Semantic Kernel is NOT the right choice when: (1) You need the broadest ecosystem
        of integrations — LangChain has more third-party connectors. (2) You want the
        simplest multi-agent experience — CrewAI's role-playing model is more intuitive.
        (3) You're building Python-only RAG applications — LlamaIndex has deeper retrieval
        capabilities. (4) You need the most flexible agent conversation patterns — AutoGen
        has more variety. (5) You're prototyping rapidly and don't need enterprise structure.
      tags: ["decision", "comparison"]

    - topic: "Prompt Engineering with Semantic Kernel"
      content: |
        Semantic Kernel provides a structured approach to prompt engineering:

        Prompt Templates: Use Handlebars or Jinja2 syntax for dynamic prompts with variables,
        conditionals, and loops. Templates can call other kernel functions inline, enabling
        composable prompts.

        Prompt Execution Settings: Configure model parameters (temperature, top_p, max_tokens)
        per prompt function. Different settings can be defined for different AI services,
        allowing a single prompt to adapt to the model being used.

        Chat History: Built-in chat history management integrates with prompt templates.
        The ChatCompletionService automatically manages conversation context, truncation,
        and system message injection.

        Prompt Rendering: The template engine renders prompts with provided variables and
        kernel function results before sending to the LLM. This separation of template
        definition and rendering enables testing prompts independently.

        Best practices: Use YAML-defined prompt functions for version control, test prompts
        with different models using execution settings, and leverage auto function calling
        to let the model decide when to use tools rather than hardcoding tool invocation.
      tags: ["prompts", "templates", "engineering"]

code_examples:
  - title: "Kernel with Plugins and Auto Function Calling"
    language: "python"
    code: |
      import asyncio
      from semantic_kernel import Kernel
      from semantic_kernel.connectors.ai.open_ai import AzureChatCompletion
      from semantic_kernel.functions import kernel_function

      class WeatherPlugin:
          @kernel_function(description="Get weather for a city")
          def get_weather(self, city: str) -> str:
              """Returns current weather for the specified city."""
              # Your weather API logic here
              return f"The weather in {city} is 72F and sunny."

      class CalendarPlugin:
          @kernel_function(description="Check calendar availability")
          def check_availability(self, date: str) -> str:
              """Check if a date has open slots."""
              return f"You have 2 open slots on {date}: 10am and 2pm."

      async def main():
          kernel = Kernel()

          # Add AI service
          kernel.add_service(AzureChatCompletion(
              deployment_name="gpt-4o",
              endpoint="https://your-endpoint.openai.azure.com",
              api_key="your-key"
          ))

          # Add plugins
          kernel.add_plugin(WeatherPlugin(), plugin_name="Weather")
          kernel.add_plugin(CalendarPlugin(), plugin_name="Calendar")

          # Auto function calling - the LLM decides when to use tools
          from semantic_kernel.connectors.ai.open_ai import OpenAIChatPromptExecutionSettings
          settings = OpenAIChatPromptExecutionSettings(
              function_choice_behavior="auto"
          )

          result = await kernel.invoke_prompt(
              "What's the weather in Seattle and do I have availability tomorrow?",
              settings=settings
          )
          print(result)

      asyncio.run(main())

  - title: "Multi-Agent Group Chat"
    language: "python"
    code: |
      import asyncio
      from semantic_kernel import Kernel
      from semantic_kernel.agents import ChatCompletionAgent, AgentGroupChat
      from semantic_kernel.agents.strategies import (
          SequentialSelectionStrategy,
          KernelFunctionTerminationStrategy,
      )
      from semantic_kernel.connectors.ai.open_ai import OpenAIChatCompletion

      async def main():
          kernel = Kernel()
          kernel.add_service(OpenAIChatCompletion(model="gpt-4o"))

          researcher = ChatCompletionAgent(
              kernel=kernel,
              name="Researcher",
              instructions="You research topics thoroughly and present factual findings.",
          )

          critic = ChatCompletionAgent(
              kernel=kernel,
              name="Critic",
              instructions="You critically evaluate research for gaps and biases. Say APPROVED when satisfied.",
          )

          writer = ChatCompletionAgent(
              kernel=kernel,
              name="Writer",
              instructions="You synthesize research into clear, concise reports.",
          )

          chat = AgentGroupChat(
              agents=[researcher, critic, writer],
              selection_strategy=SequentialSelectionStrategy(),
              termination_strategy=KernelFunctionTerminationStrategy(
                  agents=[critic],
                  maximum_iterations=6,
              ),
          )

          await chat.add_chat_message(message="Analyze the trade-offs of managed vs self-hosted vector databases.")

          async for message in chat.invoke():
              print(f"{message.name}: {message.content[:200]}")

      asyncio.run(main())

  - title: "RAG with Memory Connector"
    language: "python"
    code: |
      import asyncio
      from semantic_kernel import Kernel
      from semantic_kernel.connectors.ai.open_ai import (
          OpenAIChatCompletion,
          OpenAITextEmbedding,
      )
      from semantic_kernel.connectors.memory.qdrant import QdrantMemoryStore
      from semantic_kernel.memory import SemanticTextMemory

      async def main():
          kernel = Kernel()
          kernel.add_service(OpenAIChatCompletion(model="gpt-4o"))

          # Setup memory with Qdrant
          memory_store = QdrantMemoryStore(url="http://localhost:6333", vector_size=1536)
          embedding = OpenAITextEmbedding(model="text-embedding-3-small")
          memory = SemanticTextMemory(storage=memory_store, embeddings_generator=embedding)

          # Store knowledge
          await memory.save_information(
              collection="docs",
              id="doc1",
              text="Pinecone serverless scales automatically based on usage."
          )
          await memory.save_information(
              collection="docs",
              id="doc2",
              text="Qdrant supports payload filtering with rich query expressions."
          )

          # Retrieve and use in prompt
          results = await memory.search(collection="docs", query="auto-scaling", limit=3)
          context = "\n".join([r.text for r in results])

          answer = await kernel.invoke_prompt(
              f"Based on this context:\n{context}\n\nQuestion: Which database auto-scales?"
          )
          print(answer)

      asyncio.run(main())

