identity:
  tagline: "Microsoft's open-source SDK for integrating LLMs into enterprise applications with AI agents and plugins"
  description: |
    Semantic Kernel is Microsoft's open-source SDK for building AI agents and integrating large
    language models into enterprise applications. It provides a lightweight, extensible
    architecture centered around a Kernel that orchestrates AI services, plugins (collections
    of functions), and memory, with first-class support for .NET, Python, and Java.

    The framework is designed for enterprise software teams who need to add AI capabilities to
    existing applications rather than build AI-native products from scratch. It follows
    familiar software engineering patterns — dependency injection, plugin architecture,
    strongly-typed function definitions — making it approachable for enterprise developers
    who may not have deep AI/ML experience.

    Semantic Kernel's agent framework supports single-agent and multi-agent patterns including
    AgentGroupChat for collaborative agent conversations. The Process Framework enables
    building complex, event-driven business workflows with durable execution, state
    management, and human approval gates.

    As the foundation for Microsoft's Copilot products, Semantic Kernel is battle-tested at
    massive scale. It integrates natively with Azure OpenAI, Microsoft 365, and the broader
    Azure ecosystem, while also supporting OpenAI, Anthropic, Google, and local models via
    Ollama and HuggingFace.
