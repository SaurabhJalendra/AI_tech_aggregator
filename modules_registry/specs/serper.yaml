identity:
  tagline: "Fast and affordable Google Search API for developers and AI applications"
  description: |
    Serper provides a clean REST API to access Google Search results programmatically.
    It returns structured JSON data from Google Search including organic results,
    knowledge graph data, people also ask, and related searches. Unlike Tavily which
    processes and extracts page content, Serper focuses on delivering raw Google
    Search results quickly and affordably.

    Serper supports multiple search types including web search, image search, news
    search, shopping, and maps. It is commonly used in AI agent workflows where
    Google-quality search results are needed without the complexity and cost of
    Google's official Custom Search API.

    The service is known for its speed (sub-second responses) and generous free
    tier (2,500 searches). It has become a popular choice in the LangChain ecosystem
    as an alternative to SerpAPI for Google search integration.
  logo_url: "/assets/modules/serper.svg"
  website: "https://serper.dev"
  documentation: "https://serper.dev/docs"
  github: "https://github.com/serper-dev"
  license: "Proprietary"
  pricing_model: "freemium"

