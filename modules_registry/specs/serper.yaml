knowledge:
  entries:
    - topic: "When to Choose Serper vs Tavily"
      content: |
        Serper and Tavily serve different needs in the AI search space:

        Choose Serper when: (1) You need raw Google Search results with SERP features
        like knowledge graphs and People Also Ask, (2) Speed is critical and you need
        sub-500ms responses, (3) You need image, news, or shopping search in addition
        to web search, (4) Budget is a concern and you want the cheapest per-query pricing,
        (5) You want to handle content extraction yourself.

        Choose Tavily when: (1) You need pre-extracted, clean content ready for LLM
        consumption, (2) You want to minimize the scraping and parsing work in your
        pipeline, (3) You are building RAG with web sources and need the content,
        not just links, (4) You need the search context helper for prompt building.

        Many production systems use both: Serper for quick factual lookups where
        Google's knowledge graph provides direct answers, and Tavily for deep
        research where extracted page content is needed.
      tags: ["comparison", "decision", "tavily"]

    - topic: "Integration with LangChain"
      content: |
        Serper integrates with LangChain through the GoogleSerperAPIWrapper and
        the corresponding tool class. The integration supports web, news, and
        image search modes.

        The GoogleSerperResults tool returns the full JSON response from Serper,
        including organic results, knowledge graph data, and related searches.
        This gives agents access to rich structured data beyond simple text snippets.

        For simple question-answering agents, the GoogleSerperRun tool returns
        a condensed text summary of results, which uses fewer tokens in the
        agent's context window.
      tags: ["langchain", "integration"]

code_examples:
  - title: "Basic Google Search"
    language: "python"
    code: |
      import requests
      import json

      url = "https://google.serper.dev/search"
      payload = json.dumps({
          "q": "best vector databases for production 2026",
          "num": 10
      })
      headers = {
          "X-API-KEY": "your-api-key",
          "Content-Type": "application/json"
      }

      response = requests.post(url, headers=headers, data=payload)
      results = response.json()

      for item in results.get("organic", []):
          print(f"{item['title']}: {item['link']}")

  - title: "LangChain Agent with Serper"
    language: "python"
    code: |
      from langchain_community.utilities import GoogleSerperAPIWrapper
      from langchain.agents import initialize_agent, AgentType
      from langchain_openai import ChatOpenAI
      from langchain.tools import Tool

      search = GoogleSerperAPIWrapper()
      tools = [
          Tool(
              name="Google Search",
              func=search.run,
              description="Search Google for recent information"
          )
      ]

      llm = ChatOpenAI(model="gpt-4o", temperature=0)
      agent = initialize_agent(tools, llm, agent=AgentType.ZERO_SHOT_REACT_DESCRIPTION)

      result = agent.run("What are the latest AI infrastructure trends?")

