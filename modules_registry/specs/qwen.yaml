identity:
  tagline: Alibaba Qwen open-weight family — multilingual and strong coding variants
  description: 'Qwen is a foundation model family in the Alibaba ecosystem, catalogued

    for architecture decisions at the generation step of AI pipelines. This module
    covers

    model capabilities, context, modalities, deployment fit, and trade-offs — not
    API vendor

    integration (see cloud_api modules such as openai or google_gemini for that layer).


    Strengths: Many size tiers, Strong multilingual, Active releases.

    Tradeoffs: Less Western enterprise narrative.'
  logo_url: /assets/modules/qwen.svg
  website: https://qwenlm.github.io
  documentation: https://github.com/QwenLM/Qwen
  github: https://github.com/QwenLM/Qwen
  license: Apache-2.0
  pricing_model: open_source
