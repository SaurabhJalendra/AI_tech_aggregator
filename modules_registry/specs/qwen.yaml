knowledge:
  entries:
  - topic: When to choose Qwen
    content: 'Choose Qwen when your architecture needs multilingual rag

      and you can accept tradeoffs: Less Western enterprise narrative.

      Pair with retrieval and evaluation modules; use cloud_api entries only

      when the decision is specifically about API routing, billing, or VPC — not

      model family selection.'
    tags:
    - model-selection
    - architecture
    - foundation_model
  - topic: Qwen vs alternatives
    content: 'Compare against llama_3, deepseek, gemma at the foundation_model layer
      only.

      Do not compare to inference hosts (groq_inference), local runners (ollama),
      or

      provider APIs (openai) in the same shortlist — the advisor enforces layer separation.'
    tags:
    - comparison
    - trade-offs
