knowledge:
  entries:
    - topic: "Core Metrics Explained"
      content: |
        RAGAS defines four core metrics for RAG evaluation:

        1. Faithfulness (0-1): Measures whether the generated answer is factually consistent
        with the retrieved context. It decomposes the answer into individual claims and
        checks each claim against the context. A faithfulness of 1.0 means every claim in
        the answer is supported by the retrieved documents. This catches hallucination.

        2. Answer Relevancy (0-1): Measures whether the answer addresses the question asked.
        It generates hypothetical questions from the answer and measures their similarity
        to the original question. Penalizes irrelevant or incomplete answers.

        3. Context Precision (0-1): Measures whether the retrieved documents are relevant
        to the question and properly ranked. Higher precision means the most relevant
        documents appear first in the retrieval results.

        4. Context Recall (0-1): Measures whether all the information needed to answer the
        question was retrieved. Requires a ground truth answer for comparison. Identifies
        gaps in retrieval.

        Together, these metrics cover the full RAG pipeline: retrieval quality (precision +
        recall) and generation quality (faithfulness + relevancy).
      tags: ["metrics", "evaluation", "fundamentals"]

    - topic: "When to Choose RAGAS"
      content: |
        RAGAS is the right choice when:

        1. You're building a RAG pipeline and need automated quality evaluation. RAGAS
        provides purpose-built metrics that understand retrieval and generation quality.

        2. You lack human-annotated evaluation data. RAGAS's reference-free metrics
        (faithfulness, answer relevancy, context precision) don't require ground truth
        answers, making them ideal for early-stage development.

        3. You want to set up CI/CD quality gates. RAGAS metrics can be integrated into
        automated pipelines to catch regressions when prompts, retrievers, or models change.

        4. You need to generate synthetic test data. RAGAS can create question-answer pairs
        from your documents, bootstrapping an evaluation dataset.

        Alternatives to consider: DeepEval for broader LLM testing beyond RAG, custom
        LLM-as-judge prompts for domain-specific evaluation, human evaluation for
        high-stakes applications, or TruLens for evaluation with built-in observability.
      tags: ["decision", "comparison"]

    - topic: "Synthetic Test Data Generation"
      content: |
        RAGAS provides a test data generator that creates evaluation datasets from your
        documents. This solves a critical bootstrapping problem: you need evaluation data
        to measure RAG quality, but creating labeled data manually is expensive and slow.

        The generator works by:
        1. Reading your source documents
        2. Identifying key information and relationships
        3. Generating questions of varying difficulty (simple, reasoning, multi-context)
        4. Creating reference answers grounded in the source documents

        The distribution of question types can be controlled to test specific capabilities.
        Simple questions test basic retrieval, reasoning questions test whether the LLM can
        synthesize information, and multi-context questions test whether the retriever can
        gather information from multiple documents.

        Best practices: Generate 50-100 synthetic questions for initial evaluation, then
        gradually add human-curated questions for edge cases and domain-specific scenarios.
        Always review synthetic data for quality before using it as a benchmark.
      tags: ["synthetic-data", "test-generation", "evaluation"]

    - topic: "Integration with CI/CD Pipelines"
      content: |
        RAGAS can be integrated into CI/CD pipelines to automatically evaluate RAG quality
        on every code change. The typical setup:

        1. Maintain a versioned evaluation dataset (synthetic + curated) in your repository.

        2. On each PR that modifies the RAG pipeline (prompts, retriever config, model):
           - Run the RAG pipeline on the evaluation dataset
           - Compute RAGAS metrics (faithfulness, relevancy, precision, recall)
           - Compare against baseline thresholds
           - Fail the PR if metrics drop below thresholds

        3. Recommended thresholds to start with:
           - Faithfulness >= 0.85 (catch hallucination)
           - Answer relevancy >= 0.80
           - Context precision >= 0.75
           - Context recall >= 0.70 (if ground truth available)

        4. Track metrics over time in your experiment tracker (MLflow, W&B) to identify
        trends and catch gradual degradation.

        Cost tip: Use a smaller evaluation set (20-50 samples) for PR checks, and run the
        full evaluation set nightly or on release candidates.
      tags: ["ci-cd", "automation", "best-practices"]

code_examples:
  - title: "Basic RAG Evaluation"
    language: "python"
    code: |
      from ragas import evaluate
      from ragas.metrics import (
          faithfulness,
          answer_relevancy,
          context_precision,
          context_recall,
      )
      from datasets import Dataset

      # Prepare evaluation data
      eval_data = Dataset.from_dict({
          "question": ["What is PagedAttention?"],
          "answer": ["PagedAttention is a memory management technique..."],
          "contexts": [["PagedAttention divides KV cache into blocks..."]],
          "ground_truth": ["PagedAttention manages KV cache using paging..."]
      })

      # Run evaluation
      result = evaluate(
          eval_data,
          metrics=[
              faithfulness,
              answer_relevancy,
              context_precision,
              context_recall,
          ],
      )

      print(result)
      # {'faithfulness': 0.92, 'answer_relevancy': 0.88,
      #  'context_precision': 0.85, 'context_recall': 0.90}

  - title: "Synthetic Test Data Generation"
    language: "python"
    code: |
      from ragas.testset import TestsetGenerator
      from ragas.testset.evolutions import simple, reasoning, multi_context
      from langchain_openai import ChatOpenAI, OpenAIEmbeddings
      from langchain_community.document_loaders import DirectoryLoader

      # Load documents
      loader = DirectoryLoader("./docs", glob="**/*.md")
      documents = loader.load()

      # Configure generator
      generator_llm = ChatOpenAI(model="gpt-4o")
      critic_llm = ChatOpenAI(model="gpt-4o")
      embeddings = OpenAIEmbeddings()

      generator = TestsetGenerator.from_langchain(
          generator_llm, critic_llm, embeddings
      )

      # Generate test set
      testset = generator.generate_with_langchain_docs(
          documents,
          test_size=50,
          distributions={simple: 0.5, reasoning: 0.25, multi_context: 0.25}
      )

      # Convert to evaluation format
      eval_dataset = testset.to_dataset()

  - title: "Custom Metric Definition"
    language: "python"
    code: |
      from ragas.metrics.base import MetricWithLLM
      from ragas.metrics import AspectCritique

      # Use built-in aspect critique for custom dimensions
      conciseness = AspectCritique(
          name="conciseness",
          definition="Is the answer concise and to the point without unnecessary verbosity?",
      )

      technical_accuracy = AspectCritique(
          name="technical_accuracy",
          definition="Does the answer use correct technical terminology and avoid factual errors about the technology described?",
      )

      # Evaluate with custom metrics
      from ragas import evaluate

      result = evaluate(
          eval_data,
          metrics=[conciseness, technical_accuracy],
      )

