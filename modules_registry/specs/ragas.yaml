identity:
  tagline: "Framework for evaluating Retrieval Augmented Generation pipelines with reference-free metrics"
  description: |
    RAGAS (Retrieval Augmented Generation Assessment) is an open-source evaluation framework
    specifically designed for assessing the quality of RAG pipelines. It provides a suite of
    metrics that evaluate both the retrieval and generation components of a RAG system, many
    of which are reference-free -- meaning they do not require human-annotated ground truth
    answers.

    The core metrics include faithfulness (is the answer grounded in the retrieved context?),
    answer relevancy (does the answer address the question?), context precision (are the
    retrieved documents relevant?), and context recall (are all necessary documents retrieved?).
    These metrics use LLMs as judges, making evaluation scalable without human annotators.

    RAGAS also provides synthetic test data generation, allowing teams to create evaluation
    datasets from their own documents. This solves the cold-start problem where teams lack
    labeled evaluation data when first building a RAG system. The framework integrates with
    LangChain, LlamaIndex, and can be used with any RAG implementation through its simple API.
  logo_url: "/assets/modules/ragas.svg"
  website: "https://ragas.io"
  documentation: "https://docs.ragas.io"
  github: "https://github.com/explodinggradients/ragas"
  license: "Apache-2.0"
  pricing_model: "open_source"

