knowledge:
  entries:
    - topic: "Vespa for Advanced RAG"
      content: |
        Vespa enables RAG architectures that go beyond simple vector search:

        1. Hybrid retrieval: Combine BM25 text search with vector ANN search
        in a single query, with configurable fusion weights.

        2. ML-ranked results: Apply cross-encoder reranking or custom ONNX
        models directly in the serving layer, eliminating a separate reranking
        service.

        3. Multi-phase ranking: First phase uses cheap features (BM25 + vector),
        second phase applies expensive ML models only to top candidates.

        4. Real-time updates: Documents are searchable immediately after indexing,
        important for knowledge bases that need to stay current.

        This makes Vespa ideal for production RAG systems where retrieval quality
        is critical and simple vector search is insufficient.
      tags: ["rag", "hybrid", "ranking"]

code_examples:
  - title: "Hybrid Search Query"
    language: "python"
    code: |
      from vespa.application import Vespa

      app = Vespa(url="http://localhost:8080")

      response = app.query(
          yql="select * from documents where "
              "userQuery() or "
              "({targetHits: 100}nearestNeighbor(embedding, query_embedding))",
          query="vector database comparison",
          ranking="hybrid_rank",
          body={
              "input.query(query_embedding)": query_vector,
              "hits": 10
          }
      )

      for hit in response.hits:
          print(f"{hit['fields']['title']}: {hit['relevance']:.4f}")

