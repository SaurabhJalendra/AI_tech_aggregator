identity:
  tagline: "Open-source big data serving engine for search, recommendation, and AI applications"
  description: |
    Vespa is an open-source big data serving engine developed by Yahoo (now
    part of Verizon). It combines full-text search, vector search, structured
    data filtering, and machine-learned ranking in a single platform designed
    to serve at massive scale.

    Vespa is battle-tested at Yahoo-scale workloads (billions of documents,
    tens of thousands of queries per second). It supports real-time indexing,
    distributed computing, and sophisticated ranking with custom ML models.
    For AI applications, Vespa provides native vector search (ANN), hybrid
    search, and the ability to run inference within the serving layer.

    While more complex to set up than purpose-built vector databases, Vespa
    is unmatched for applications that need the combination of full-text search,
    vector search, and ML ranking at enterprise scale.
  logo_url: "/assets/modules/vespa.svg"
  website: "https://vespa.ai"
  documentation: "https://docs.vespa.ai"
  github: "https://github.com/vespa-engine/vespa"
  license: "Apache-2.0"
  pricing_model: "open_source"

