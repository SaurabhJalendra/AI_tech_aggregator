identity:
  tagline: "Natively multimodal AI with the longest context windows and deep Google Cloud integration"
  description: |
    Google Gemini is a family of natively multimodal large language models built by
    Google DeepMind. Unlike the google_gemini module which focuses on API integration,
    this module covers Gemini as a model choice within AI architectures -- its unique
    multimodal capabilities, massive context windows, cost structure, and the design
    patterns it enables.

    Gemini's defining characteristic is its native multimodality. Rather than bolting
    vision or audio onto a text model, Gemini processes text, images, audio, and video
    within a unified architecture. This enables genuinely cross-modal reasoning --
    answering questions about specific moments in a video, analyzing charts with
    surrounding text context, or processing audio recordings with visual slides.

    The Gemini 2.0 lineup includes Flash (fast and cost-efficient, 1M context),
    Pro (highest capability), and the experimental models with even larger contexts.
    Gemini 1.5 Pro retains its position with a 2-million-token context window, the
    largest commercially available, enabling processing of entire codebases, hours of
    video, or hundreds of documents in a single request.

    Gemini is available through Google AI Studio for rapid prototyping and Vertex AI
    for enterprise deployments with full Google Cloud security and compliance controls.
