identity:
  tagline: "Serverless, embedded vector database built on Lance columnar format"
  description: |
    LanceDB is an open-source, embedded vector database built on the Lance columnar
    data format. It runs in-process with your application, requiring no separate
    server or infrastructure. Data is stored in Lance format on local disk or
    cloud object storage (S3, GCS, Azure Blob).

    LanceDB supports multi-modal data (vectors, text, images, video) stored together
    in a single table with full SQL filtering capabilities. The Lance format provides
    efficient columnar access, versioning, and fast random access patterns ideal
    for vector search workloads.

    The embedded architecture makes LanceDB ideal for edge deployments, development
    environments, and applications where operational simplicity is valued. It
    supports both Python and JavaScript SDKs and integrates with LangChain and
    LlamaIndex.
  logo_url: "/assets/modules/lancedb.svg"
  website: "https://lancedb.com"
  documentation: "https://lancedb.github.io/lancedb/"
  github: "https://github.com/lancedb/lancedb"
  license: "Apache-2.0"
  pricing_model: "open_source"

