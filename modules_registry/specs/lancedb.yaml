comparison_dimensions:
  performance:
    score: 7
    justification: "Good query performance for datasets that fit in memory. Lance format provides efficient I/O patterns."
  scalability:
    score: 5
    justification: "Embedded architecture limits scalability. Best for datasets under 100M vectors. No distributed mode."
  ease_of_use:
    score: 9
    justification: "Zero infrastructure setup. Import and use in Python with no server needed."
  cost_efficiency:
    score: 10
    justification: "Open-source with no server costs. Storage on local disk or cheap object storage."
  community:
    score: 6
    justification: "Growing community. Smaller than established vector databases but active development."
  maturity:
    score: 5
    justification: "Relatively new database. Core Lance format is stable but the database layer is still maturing."
  flexibility:
    score: 7
    justification: "Multi-modal support, SQL filtering, cloud storage backends. Limited by embedded architecture."
  data_privacy:
    score: 10
    justification: "Fully local. Data stored on your own disk or cloud storage. No external services."

knowledge:
  entries:
    - topic: "LanceDB vs ChromaDB"
      content: |
        Both are embedded vector databases but with different strengths:

        LanceDB advantages: Lance columnar format for efficient storage, cloud
        object storage support (S3/GCS), multi-modal data, SQL filtering,
        data versioning, better for larger datasets.

        ChromaDB advantages: simpler API, easier to get started, more framework
        integrations, larger community, client-server mode for production.

        Choose LanceDB when: you need cloud storage backends, multi-modal data,
        SQL filtering, data versioning, or are building edge/serverless applications.

        Choose ChromaDB when: you want the simplest possible API for prototyping,
        need client-server architecture, or want the largest community ecosystem.
      tags: ["comparison", "chromadb"]

code_examples:
  - title: "Basic Vector Search"
    language: "python"
    code: |
      import lancedb
      import numpy as np

      db = lancedb.connect("./my-lance-db")

      # Create table with vectors
      data = [
          {"text": "RAG pipeline guide", "vector": np.random.randn(384).tolist()},
          {"text": "Vector database comparison", "vector": np.random.randn(384).tolist()},
          {"text": "LLM deployment tips", "vector": np.random.randn(384).tolist()},
      ]

      table = db.create_table("docs", data)

      # Search
      query_vector = np.random.randn(384).tolist()
      results = table.search(query_vector).limit(3).to_pandas()
      print(results[["text", "_distance"]])

  - title: "LangChain Integration"
    language: "python"
    code: |
      from langchain_community.vectorstores import LanceDB
      from langchain_openai import OpenAIEmbeddings
      import lancedb

      db = lancedb.connect("./lance-store")
      embeddings = OpenAIEmbeddings(model="text-embedding-3-small")

      vectorstore = LanceDB.from_documents(
          documents,
          embeddings,
          connection=db,
          table_name="knowledge-base"
      )

      results = vectorstore.similarity_search("How does RAG work?", k=5)

