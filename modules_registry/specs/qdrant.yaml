identity:
  tagline: "High-performance open-source vector database built in Rust with advanced filtering"
  description: |
    Qdrant (pronounced "quadrant") is an open-source vector similarity search engine and
    database written in Rust. It provides a production-ready service with a convenient API
    for storing, searching, and managing vectors with extended payload filtering capabilities.

    Qdrant's key differentiators are its performance (Rust-based engine with custom HNSW
    implementation), rich payload filtering (arbitrary JSON payloads with indexed fields for
    efficient filtered search), and flexible deployment options (embedded, single-node Docker,
    or distributed cluster).

    The engine supports advanced features including named vectors (multiple vectors per point),
    quantization (scalar, product, and binary) for memory optimization, snapshot-based backups,
    and distributed deployment with sharding and replication. Qdrant offers both REST and gRPC
    APIs, with the gRPC interface providing significantly higher throughput for batch operations.

    Qdrant Cloud provides a managed service, while the open-source version can be self-hosted
    without feature restrictions. The project has rapidly grown in popularity, becoming one of
    the most-starred vector database projects on GitHub.
  logo_url: "/assets/modules/qdrant.svg"
  website: "https://qdrant.tech"
  documentation: "https://qdrant.tech/documentation"
  github: "https://github.com/qdrant/qdrant"
  license: "Apache-2.0"
  pricing_model: "open_source"

