knowledge:
  entries:
    - topic: "Langfuse vs LangSmith"
      content: |
        Langfuse and LangSmith are the two leading LLM observability platforms:

        Langfuse advantages: open-source, self-hostable, framework-agnostic,
        MIT license, community-driven. Works equally well with LangChain,
        LlamaIndex, or custom code.

        LangSmith advantages: deeper LangChain integration, more mature evaluation
        features, LangChain Hub for prompt sharing, better documentation for
        LangChain-specific workflows.

        Choose Langfuse when: you need self-hosting for data privacy, you use
        multiple frameworks or custom code, you want open-source flexibility,
        or you prefer vendor independence.

        Choose LangSmith when: you're deeply invested in the LangChain ecosystem,
        you want the most polished LangChain debugging experience, or you need
        LangChain Hub for prompt management.
      tags: ["comparison", "langsmith", "decision"]

code_examples:
  - title: "Python Decorator Tracing"
    language: "python"
    code: |
      from langfuse.decorators import observe, langfuse_context

      @observe()
      def rag_pipeline(query: str) -> str:
          context = retrieve(query)
          answer = generate(query, context)
          return answer

      @observe()
      def retrieve(query: str) -> list[str]:
          results = vector_store.search(query, top_k=5)
          return [r.text for r in results]

      @observe(as_type="generation")
      def generate(query: str, context: list[str]) -> str:
          response = openai.chat.completions.create(
              model="gpt-4o",
              messages=[{"role": "user", "content": f"Context: {context}\n{query}"}]
          )
          return response.choices[0].message.content

      # All calls are automatically traced to Langfuse
      result = rag_pipeline("What is vector search?")

  - title: "LangChain Callback Integration"
    language: "python"
    code: |
      from langfuse.callback import CallbackHandler

      langfuse_handler = CallbackHandler(
          public_key="pk-...",
          secret_key="sk-...",
          host="https://cloud.langfuse.com"
      )

      # Pass to any LangChain invocation
      chain.invoke(
          {"question": "What is RAG?"},
          config={"callbacks": [langfuse_handler]}
      )

