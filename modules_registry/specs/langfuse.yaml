identity:
  tagline: "Open-source LLM observability, tracing, and evaluation platform"
  description: |
    Langfuse is an open-source observability platform purpose-built for LLM
    applications. It provides tracing, prompt management, evaluation, and
    analytics for RAG pipelines, agents, and other AI applications.

    Langfuse captures the full execution trace of LLM applications including
    retrieval steps, LLM calls, tool usage, and custom spans. This enables
    debugging, performance optimization, and quality monitoring. The platform
    also supports evaluation with scoring functions, human feedback collection,
    and dataset management.

    Being open-source and self-hostable, Langfuse is popular among teams that
    need LLM observability without sending data to third-party services. It
    integrates with major frameworks including LangChain, LlamaIndex, and the
    OpenAI SDK through decorators and callbacks.
  logo_url: "/assets/modules/langfuse.svg"
  website: "https://langfuse.com"
  documentation: "https://langfuse.com/docs"
  github: "https://github.com/langfuse/langfuse"
  license: "MIT"
  pricing_model: "freemium"

