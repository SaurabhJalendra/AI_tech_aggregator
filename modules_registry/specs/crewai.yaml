identity:
  tagline: "Framework for orchestrating role-playing autonomous AI agents that collaborate on complex tasks"
  description: |
    CrewAI is an open-source framework for building multi-agent systems where specialized AI
    agents collaborate to accomplish complex tasks. It uses a role-playing paradigm where each
    agent has a defined role, goal, and backstory, enabling natural division of labor across
    agents with different expertise.

    The framework introduces three core abstractions: Agents (autonomous entities with roles
    and tools), Tasks (specific assignments with expected outputs), and Crews (teams of agents
    working together on a process). Crews can operate in sequential mode (agents work one after
    another) or hierarchical mode (a manager agent delegates and coordinates).

    CrewAI focuses on developer experience with a simple, intuitive API that makes multi-agent
    orchestration accessible without deep knowledge of agent architectures. It supports tool
    integration via LangChain tools and its own CrewAI Tools library, which includes web
    search, file operations, code execution, and RAG tools out of the box.

    CrewAI Enterprise (CrewAI+) adds a deployment platform with agent monitoring, versioning,
    and a visual workflow builder. The open-source framework supports any LLM provider through
    LiteLLM integration, enabling both cloud and local model deployment.
  logo_url: "/assets/modules/crewai.svg"
  website: "https://www.crewai.com"
  documentation: "https://docs.crewai.com"
  github: "https://github.com/crewAIInc/crewAI"
