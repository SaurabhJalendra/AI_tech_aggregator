identity:
  tagline: "Open-source framework for adding structural, type, and quality validation to LLM outputs"
  description: |
    Guardrails AI is an open-source Python framework that validates, structures, and
    controls the outputs of large language models. It wraps LLM API calls and applies
    validators to ensure outputs meet specified quality, safety, and format requirements
    before they reach end users.

    The framework uses a Guard object that sits between your application and the LLM.
    Guards apply validators -- reusable checks that verify specific properties of the
    output. Validators range from simple structural checks (is the output valid JSON?)
    to AI-powered quality checks (is the output free of PII, toxicity, or hallucination?).
    When validation fails, Guardrails can re-prompt the LLM, apply fixes, or return
    an error.

    The Guardrails Hub is a community registry of pre-built validators covering common
    needs like PII detection, profanity filtering, SQL injection prevention, competitor
    mention blocking, and factual accuracy checking. Custom validators can be created
    in a few lines of Python. The framework supports both synchronous and streaming
    LLM responses.
  logo_url: "/assets/modules/guardrails_ai.svg"
  website: "https://www.guardrailsai.com"
  documentation: "https://docs.guardrailsai.com"
  github: "https://github.com/guardrails-ai/guardrails"
  license: "Apache-2.0"
  pricing_model: "freemium"

