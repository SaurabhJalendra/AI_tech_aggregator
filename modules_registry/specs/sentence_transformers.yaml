identity:
  tagline: "State-of-the-art text and image embeddings with Python"
  description: |
    Sentence Transformers is a Python library for computing dense vector embeddings
    for sentences, paragraphs, and images. Built on top of Hugging Face Transformers,
    it provides easy-to-use interfaces for over 5,000 pre-trained models from the
    Hugging Face Hub, including popular models like all-MiniLM-L6-v2, BGE, E5, and GTE.

    The library supports training and fine-tuning embedding models with a variety
    of loss functions optimized for different use cases: semantic similarity,
    information retrieval, clustering, and paraphrase mining. It also provides
    utilities for evaluation, data loading, and model export.

    Sentence Transformers is the most widely used open-source embedding library,
    powering thousands of applications in semantic search, RAG, and text classification.
    It runs locally without API costs and supports GPU acceleration for high-throughput
    embedding generation.
  logo_url: "/assets/modules/sentence_transformers.svg"
  website: "https://www.sbert.net"
  documentation: "https://www.sbert.net/docs/"
  github: "https://github.com/UKPLab/sentence-transformers"
  license: "Apache-2.0"
  pricing_model: "open_source"

