knowledge:
  entries:
    - topic: "Choosing the Right Model"
      content: |
        With thousands of models available, choosing the right one depends on your
        use case, language, and performance requirements:

        For English semantic search and RAG: all-MiniLM-L6-v2 (fast, 384 dims) or
        bge-large-en-v1.5 (better quality, 1024 dims). Check the MTEB leaderboard
        for the latest rankings.

        For multilingual applications: multilingual-e5-large or paraphrase-multilingual-MiniLM-L12-v2.

        For code search: models fine-tuned on code like codesearchnet or unixcoder.

        Key trade-offs: larger models produce better embeddings but are slower and
        use more memory. Dimension size affects storage costs in vector databases.
        A 384-dim model uses 4x less storage than a 1536-dim model.

        The MTEB (Massive Text Embedding Benchmark) leaderboard on Hugging Face
        is the best resource for comparing model quality across different tasks.
      tags: ["models", "selection", "comparison"]

    - topic: "Fine-Tuning for Domain-Specific Applications"
      content: |
        Pre-trained embedding models work well for general text but fine-tuning
        on domain-specific data can significantly improve retrieval quality. Sentence
        Transformers provides a complete fine-tuning framework.

        Common fine-tuning approaches: (1) Contrastive learning with positive/negative
        pairs using MultipleNegativesRankingLoss, (2) Triplet learning with anchor,
        positive, negative examples, (3) Knowledge distillation from a larger teacher
        model.

        A practical workflow: collect query-document pairs from search logs or
        user feedback, format as training data, fine-tune a base model for 1-3
        epochs, evaluate on a held-out test set. Even 1000 high-quality pairs
        can significantly improve domain retrieval.

        The library also supports Matryoshka Representation Learning, which trains
        models to produce embeddings that work well at multiple dimensions, allowing
        you to truncate embeddings for storage savings without major quality loss.
      tags: ["fine-tuning", "training", "domain"]

code_examples:
  - title: "Generate Embeddings"
    language: "python"
    code: |
      from sentence_transformers import SentenceTransformer

      model = SentenceTransformer("all-MiniLM-L6-v2")

      sentences = [
          "How to deploy a RAG pipeline",
          "Vector database comparison guide",
          "Machine learning infrastructure best practices"
      ]

      embeddings = model.encode(sentences)
      print(f"Shape: {embeddings.shape}")  # (3, 384)

      # Compute similarity
      similarity = model.similarity(embeddings[0], embeddings[1])
      print(f"Similarity: {similarity:.4f}")

  - title: "Semantic Search"
    language: "python"
    code: |
      from sentence_transformers import SentenceTransformer, util

      model = SentenceTransformer("all-MiniLM-L6-v2")

      # Corpus of documents
      corpus = [
          "Pinecone is a managed vector database",
          "LangChain is an LLM orchestration framework",
          "RAG combines retrieval with generation",
          "Fine-tuning improves model performance on specific tasks"
      ]
      corpus_embeddings = model.encode(corpus, convert_to_tensor=True)

      # Search
      query = "How to build a search system with AI"
      query_embedding = model.encode(query, convert_to_tensor=True)

      hits = util.semantic_search(query_embedding, corpus_embeddings, top_k=3)
      for hit in hits[0]:
          print(f"Score: {hit['score']:.4f} | {corpus[hit['corpus_id']]}")

  - title: "Fine-Tuning with Contrastive Loss"
    language: "python"
    code: |
      from sentence_transformers import SentenceTransformer, InputExample, losses
      from torch.utils.data import DataLoader

      model = SentenceTransformer("all-MiniLM-L6-v2")

      # Training pairs: (query, relevant_document)
      train_examples = [
          InputExample(texts=["deploy ML model", "Guide to ML deployment on Kubernetes"]),
          InputExample(texts=["vector search", "How vector similarity search works"]),
      ]

      train_dataloader = DataLoader(train_examples, shuffle=True, batch_size=16)
      train_loss = losses.MultipleNegativesRankingLoss(model)

      model.fit(
          train_objectives=[(train_dataloader, train_loss)],
          epochs=3,
          warmup_steps=100
      )
      model.save("fine-tuned-model")

