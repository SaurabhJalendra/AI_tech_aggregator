identity:
  tagline: "Open-source tool for testing, evaluating, and red-teaming LLM prompts"
  description: |
    Promptfoo is an open-source CLI and library for testing and evaluating LLM
    outputs. It allows developers to define test cases for prompts, run them
    against multiple LLM providers simultaneously, and compare results using
    automated assertions and evaluators.

    Promptfoo uses a YAML-based configuration to define prompts, test variables,
    providers (LLM endpoints), and assertions. This makes it easy to integrate
    prompt testing into CI/CD pipelines, ensuring that prompt changes don't
    introduce regressions.

    The tool also supports red-teaming with built-in adversarial test generation
    for detecting prompt injection vulnerabilities, harmful outputs, and
    compliance violations. It has become a standard tool for teams that treat
    prompts as code with proper testing.
  logo_url: "/assets/modules/promptfoo.svg"
  website: "https://promptfoo.dev"
  documentation: "https://promptfoo.dev/docs/intro"
  github: "https://github.com/promptfoo/promptfoo"
  license: "MIT"
  pricing_model: "open_source"

