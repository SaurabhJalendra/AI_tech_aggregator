knowledge:
  entries:
    - topic: "Prompt Testing in CI/CD"
      content: |
        Promptfoo enables treating prompts as tested code:

        1. Define your prompts in files alongside your code.
        2. Create a promptfooconfig.yaml with test cases covering expected behaviors.
        3. Add assertions for each test case (output contains X, passes LLM rubric, etc.).
        4. Run promptfoo eval in CI to verify prompts on every pull request.

        This catches regressions when prompts are modified and ensures new prompts
        meet quality criteria before deployment. The eval results can be compared
        across runs to track quality trends.

        For RAG applications, test cases can include specific retrieval scenarios
        where you know the expected answer, ensuring the full pipeline works
        correctly end-to-end.
      tags: ["ci-cd", "testing", "workflow"]

code_examples:
  - title: "Promptfoo Configuration"
    language: "yaml"
    code: |
      # promptfooconfig.yaml
      prompts:
        - "Answer the question based on context: {{context}}\n\nQ: {{question}}"

      providers:
        - openai:gpt-4o
        - anthropic:messages:claude-sonnet-4-20250514

      tests:
        - vars:
            context: "The Eiffel Tower is 330 meters tall."
            question: "How tall is the Eiffel Tower?"
          assert:
            - type: contains
              value: "330"
            - type: llm-rubric
              value: "Answer should mention the height in meters"

        - vars:
            context: "Python was created by Guido van Rossum."
            question: "Who created Python?"
          assert:
            - type: contains
              value: "Guido"

  - title: "Run Evaluation from CLI"
    language: "bash"
    code: |
      # Install
      npm install -g promptfoo

      # Run evaluation
      promptfoo eval

      # View results in browser
      promptfoo view

      # Run in CI (exits with error code if assertions fail)
      promptfoo eval --no-cache --ci

