identity:
  tagline: "Open-source toolkit for adding programmable safety guardrails to LLM-powered applications"
  description: |
    NVIDIA NeMo Guardrails is an open-source toolkit for adding programmable guardrails to
    large language model applications. It allows developers to define rules and constraints
    that control the behavior of LLM-powered systems, preventing harmful outputs, enforcing
    topic boundaries, ensuring factual accuracy, and maintaining compliance with organizational
    policies.

    NeMo Guardrails uses a domain-specific language called Colang to define conversational
    flows and safety rules. These rules are enforced at runtime through a combination of
    LLM-based evaluation, embedding-based classification, and programmable actions. The system
    intercepts both user inputs and LLM outputs, applying checks before the response reaches
    the user.

    The toolkit supports multiple guardrail types: input rails (filtering harmful or off-topic
    user inputs), output rails (checking LLM responses for safety, accuracy, and policy
    compliance), retrieval rails (validating retrieved context in RAG systems), and dialog
    rails (ensuring conversations follow defined flows). It integrates with any LLM provider
    and can be added to existing applications with minimal code changes.
  logo_url: "/assets/modules/nemo_guardrails.svg"
  website: "https://github.com/NVIDIA/NeMo-Guardrails"
  documentation: "https://docs.nvidia.com/nemo/guardrails/"
  github: "https://github.com/NVIDIA/NeMo-Guardrails"
  license: "Apache-2.0"
  pricing_model: "open_source"

