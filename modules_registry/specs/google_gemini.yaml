identity:
  tagline: "Multimodal AI models with massive context windows and deep Google Cloud integration"
  description: |
    Google Gemini is a family of multimodal large language models developed by Google
    DeepMind. The lineup includes Gemini 2.0 Flash, Gemini 2.0 Pro, and Gemini 1.5 Pro,
    offering a range of capability and cost tradeoffs. Gemini models are natively
    multimodal, processing text, images, audio, and video in a single model architecture.

    The standout feature of Gemini is its massive context window. Gemini 1.5 Pro supports
    up to 2 million tokens of context, enabling processing of entire books, hours of video,
    or very large codebases in a single request. Gemini 2.0 Flash provides 1 million tokens
    of context at significantly lower cost and faster speed.

    Gemini is accessible via the Google AI Studio (Gemini API) for developers and via
    Vertex AI for enterprise deployments. The Vertex AI integration provides access to
    Google Cloud's MLOps ecosystem, including grounding with Google Search for factual
    accuracy, enterprise security controls, and VPC Service Controls for data isolation.

    Gemini's competitive advantages include the longest context windows available, strong
    cost efficiency (especially Flash models), native multimodal understanding, and tight
    integration with the Google Cloud ecosystem. Trade-offs include a smaller third-party
    ecosystem compared to OpenAI and less community mindshare.
  logo_url: "/assets/modules/google_gemini.svg"
  website: "https://deepmind.google/technologies/gemini/"
  documentation: "https://ai.google.dev/gemini-api/docs"
  github: "https://github.com/google-gemini/generative-ai-python"
  license: "Proprietary"
  pricing_model: "freemium"

