identity:
  tagline: "Protocols and patterns for multi-agent communication and tool use"
  description: |
    Agent communication protocols define how AI agents discover, interact with, and
    orchestrate each other and external tools. As AI systems evolve from single-model
    applications to multi-agent architectures, standardized communication protocols
    become essential for interoperability.

    The landscape features two major protocol families: Anthropic's Model Context Protocol
    (MCP) for connecting models to data sources and tools, and Google's Agent-to-Agent (A2A)
    protocol for direct agent interoperability. These represent different philosophies —
    MCP focuses on model-tool integration while A2A focuses on agent-agent collaboration.

    Beyond these standards, practical patterns like function calling, tool use, and custom
    message-passing architectures remain widely used. The choice of protocol depends on
    whether you're building tool integrations, multi-agent systems, or both.
  website: "https://modelcontextprotocol.io"
  documentation: "https://modelcontextprotocol.io/docs"
  license: "Open Source"
  pricing_model: "open_source"

