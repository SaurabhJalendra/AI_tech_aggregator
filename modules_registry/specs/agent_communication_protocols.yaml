    justification: "MCP can run locally (stdio transport). A2A involves network calls between agents. Privacy depends on deployment."

knowledge:
  entries:
    - topic: "MCP (Model Context Protocol) Overview"
      content: |
        The Model Context Protocol (MCP) is an open standard created by Anthropic for connecting
        AI models to external data sources and tools. It provides a standardized interface for
        LLMs to discover and use tools, read resources, and interact with external systems.

        MCP uses a client-server architecture. The MCP client runs alongside the LLM (in the
        host application), and MCP servers expose capabilities (tools, resources, prompts).
        Communication uses JSON-RPC 2.0 over either stdio (for local servers) or SSE (for
        remote servers).

        Three core primitives: (1) Tools — functions the model can invoke (e.g., search a
        database, call an API), (2) Resources — data the model can read (e.g., file contents,
        database records), (3) Prompts — templated interactions for common workflows.

        The ecosystem has grown rapidly with 1000+ community-built MCP servers for databases,
        APIs, file systems, and developer tools. Major IDEs (Cursor, VS Code with Copilot,
        Claude Code) support MCP natively.
      tags: ["mcp", "protocol", "overview"]

    - topic: "Google A2A Protocol"
      content: |
        Google's Agent-to-Agent (A2A) protocol enables AI agents built on different frameworks
        to communicate and collaborate. While MCP focuses on connecting models to tools, A2A
        focuses on connecting agents to each other.

        A2A defines: (1) Agent Cards — JSON metadata describing an agent's capabilities,
        (2) Task objects — units of work that agents exchange, (3) Streaming support for
        long-running tasks, (4) Push notifications for asynchronous updates.

        A key differentiator is that A2A treats agents as opaque services. An A2A client
        doesn't need to know the internal architecture of the agent it's talking to — it only
        needs to know its capabilities (from the Agent Card) and can send tasks accordingly.

        A2A is designed for enterprise scenarios where multiple specialized agents (each
        potentially built by different teams or vendors) need to collaborate on complex
        workflows. For example, a customer service system might route between a billing agent,
        a technical support agent, and a returns agent via A2A.
      tags: ["a2a", "google", "protocol"]

    - topic: "MCP vs A2A: When to Use Which"
      content: |
        MCP and A2A solve different problems and are complementary rather than competing.

        Use MCP when: You need to connect a single LLM to external tools and data sources.
        Think of MCP as "plugins for AI models." Examples: giving Claude access to your database,
        connecting GPT-4 to your internal APIs, letting an LLM read and write files.

        Use A2A when: You need multiple AI agents to collaborate on tasks. Think of A2A as
        "networking for AI agents." Examples: a research agent delegating subtasks to a
        data-gathering agent, a customer service system routing between specialized agents.

        In practice, many systems use both: individual agents use MCP to connect to their
        tools, and A2A to communicate with other agents. An agent might use MCP to access
        a database, process the data, and then send results to another agent via A2A.

        For most developers building their first AI application, MCP is the right starting
        point. A2A becomes relevant when you have multiple agents that need to work together.
      tags: ["comparison", "decision", "mcp", "a2a"]

    - topic: "Function Calling and Tool Use Patterns"
      content: |
        Function calling (also called tool use) is the most basic form of agent-tool
        communication. All major LLM providers support it: OpenAI's function calling,
        Anthropic's tool use, Google's function calling in Gemini.

        The pattern is simple: define functions with names, descriptions, and parameter schemas.
        Send these definitions with the conversation. The model decides when to call a function
        and returns structured arguments. Your application executes the function and sends the
        result back to the model.

        Best practices for function definitions: (1) Write detailed descriptions — the model
        uses these to decide when to call the function. (2) Keep parameter schemas simple —
        avoid deeply nested objects. (3) Return structured data — JSON is better than
        unstructured text. (4) Handle errors gracefully — return error information the model
        can use to retry or ask for clarification.

        For complex tool use patterns, consider: parallel function calling (multiple tools in
        one turn), chained function calling (output of one tool feeds into another), and
        conditional function calling (the model decides between multiple tools based on context).
      tags: ["function-calling", "tool-use", "patterns"]

    - topic: "Building MCP Servers"
      content: |
        Building an MCP server exposes your data or functionality to any MCP-compatible LLM
        client. The Anthropic MCP SDK provides TypeScript and Python implementations.

        A basic MCP server defines tools using decorators. Each tool has a name, description,
        and input schema. The server handles JSON-RPC communication automatically.

        For production MCP servers: (1) Use descriptive tool names and detailed descriptions.
        The model relies on these to decide when to use your tool. (2) Validate inputs
        carefully — the model may send unexpected parameter combinations. (3) Return
        structured results with clear success/failure indicators. (4) Implement rate limiting
        and authentication if the server will be exposed remotely.

        The stdio transport is simplest for local development. For remote deployment, use the
        SSE transport with proper authentication. Consider running MCP servers in Docker
        containers for isolation and portability.
      tags: ["mcp", "development", "building"]

code_examples:
  - title: "MCP Server (Python)"
    language: "python"
    code: |
      from mcp.server import Server
      from mcp.types import Tool, TextContent

      server = Server("my-tool-server")

      @server.tool()
      async def search_database(query: str, limit: int = 5) -> list[TextContent]:
          """Search the product database for matching items."""
          results = await db.search(query, limit=limit)
          return [TextContent(type="text", text=str(r)) for r in results]

      @server.tool()
      async def get_user_profile(user_id: str) -> TextContent:
          """Get a user's profile information."""
          profile = await db.get_user(user_id)
          return TextContent(type="text", text=json.dumps(profile))

      # Run with: python -m mcp.server.stdio my_server

  - title: "Claude Tool Use (Anthropic API)"
    language: "python"
    code: |
      import anthropic

      client = anthropic.Anthropic()

      tools = [{
          "name": "get_weather",
          "description": "Get current weather for a location",
          "input_schema": {
              "type": "object",
              "properties": {
                  "location": {"type": "string", "description": "City name"}
              },
              "required": ["location"]
          }
      }]

      response = client.messages.create(
          model="claude-sonnet-4-20250514",
          max_tokens=1024,
          tools=tools,
          messages=[{"role": "user", "content": "What's the weather in Tokyo?"}]
      )

      # Check if model wants to use a tool
      for block in response.content:
          if block.type == "tool_use":
              result = call_weather_api(block.input["location"])
              # Send result back to Claude...

