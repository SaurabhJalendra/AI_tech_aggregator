    score: 7
    justification: "Overhead depends on protocol. MCP adds minimal latency. A2A has HTTP overhead per agent hop."
  scalability:
    score: 7
    justification: "MCP scales well for tool integrations. Multi-agent systems face coordination complexity at scale."
  ease_of_use:
    score: 6
    justification: "MCP has good SDKs. A2A is newer with fewer examples. Custom protocols require significant engineering."
  cost_efficiency:
    score: 8
    justification: "Protocols themselves are free. Cost is in the LLM calls each agent makes."
  community:
    score: 8
    justification: "MCP has growing ecosystem (1000+ community servers). A2A is newer. Function calling is universal."
