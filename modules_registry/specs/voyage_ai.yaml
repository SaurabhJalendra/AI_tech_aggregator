identity:
  tagline: "High-performance embedding models specialized for code, legal, finance, and multilingual retrieval"
  description: |
    Voyage AI provides a family of embedding models that consistently rank at the top of
    retrieval benchmarks, particularly for domain-specific use cases. Their models include
    voyage-3 (general purpose), voyage-code-3 (optimized for code retrieval), voyage-law-2
    (legal domain), voyage-finance-2 (financial domain), and voyage-multilingual-2.

    Voyage models are trained with retrieval in mind, using contrastive learning on large-scale
    curated datasets. They support both query and document input types for asymmetric search,
    similar to Cohere's approach. The models accept long context windows up to 32,000 tokens,
    making them suitable for embedding entire documents without chunking.

    Voyage AI was founded by researchers from Stanford and has been recognized for consistently
    outperforming larger competitors on domain-specific benchmarks. The company was acquired by
    Anthropic, further strengthening its position in the AI ecosystem.
  logo_url: "/assets/modules/voyage_ai.svg"
  website: "https://www.voyageai.com"
  documentation: "https://docs.voyageai.com"
  github: "https://github.com/voyage-ai/voyageai-python"
  license: "Proprietary"
  pricing_model: "freemium"

