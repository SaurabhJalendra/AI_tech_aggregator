knowledge:
  entries:
    - topic: "Model Selection Guide"
      content: |
        Anthropic offers three model tiers optimized for different use cases:

        Claude Opus 4: The most capable model, excelling at complex analysis, nuanced
        writing, advanced math, coding, and agentic multi-step tasks. Use Opus for tasks
        where quality is paramount: legal analysis, scientific research, complex code
        architecture, and long-running agent workflows. Extended thinking mode makes it
        particularly strong for problems requiring deep reasoning.

        Claude Sonnet 4: The best balance of capability and cost for most production
        workloads. Sonnet 4 handles the vast majority of tasks with quality close to
        Opus at a fraction of the cost. Ideal for: customer-facing chatbots, code
        generation, document summarization, data extraction, and standard RAG pipelines.
        This should be your default choice.

        Claude Haiku 3.5: Optimized for speed and cost. Best for high-volume, lower-
        complexity tasks like classification, entity extraction, simple Q&A, content
        moderation, and routing decisions. At $0.80/1M input tokens, it is economical for
        high-throughput pipelines.

        General guidance: Start with Sonnet 4 for most tasks. Upgrade to Opus 4 for complex
        reasoning or long-running agents. Use Haiku 3.5 for classification, extraction, and
        high-volume simple tasks.
      tags: ["model-selection", "decision"]

    - topic: "Extended Thinking for Complex Reasoning"
      content: |
        Extended thinking is a Claude feature that enables the model to perform internal
        chain-of-thought reasoning before producing its final response. When enabled, Claude
        generates a thinking block (visible to the developer but presented separately from the
        response) where it works through the problem step by step.

        This is particularly effective for: math and logic problems, multi-step coding tasks,
        complex analysis requiring weighing multiple factors, and planning in agentic workflows.

        To use extended thinking, set the thinking parameter in your API request with a
        budget_tokens value that controls how many tokens Claude can use for its internal
        reasoning. Higher budgets allow deeper reasoning on harder problems.

        Key considerations: Extended thinking increases latency and token usage (you pay for
        thinking tokens). The thinking content is returned separately from the response content.
        For simple tasks, extended thinking is unnecessary overhead. Reserve it for problems
        where you observe quality improvements from deeper reasoning.

        Extended thinking pairs well with tool use for complex agentic workflows where the
        model needs to reason about which tools to call and how to interpret results.
      tags: ["extended-thinking", "reasoning", "advanced"]

    - topic: "Prompt Caching for Cost Reduction"
      content: |
        Anthropic's prompt caching feature allows you to mark portions of your prompt as
        cacheable using cache_control breakpoints. When subsequent requests share the same
        cached prefix, you receive a 90% discount on those input tokens after a small
        initial write cost.

        The cache has a 5-minute TTL that refreshes on each cache hit, making it effective
        for repeated conversations with the same system prompt, RAG pipelines where the
        retrieved context is appended to a large static prompt, or batch processing where
        many items share the same instructions.

        To use caching, add cache_control: {"type": "ephemeral"} to system messages or
        specific content blocks. The minimum cacheable prefix is 1024 tokens for Haiku and
        2048 tokens for Sonnet/Opus.

        Cost breakdown: Cache writes cost 25% more than base input tokens. Cache reads cost
        90% less than base input tokens. For any prompt repeated more than 2-3 times within
        the TTL window, caching saves money.

        Best practice: Place stable content (system prompt, few-shot examples, reference
        documents) at the beginning of the prompt with cache breakpoints, and variable
        content (user query, conversation history) at the end.
      tags: ["prompt-caching", "cost", "optimization"]

    - topic: "Tool Use and Agentic Patterns"
      content: |
        Claude supports tool use (function calling) through the tools parameter in the Messages
        API. You define tools with names, descriptions, and JSON Schema input specifications.
        Claude decides when to call tools and generates structured arguments.

        Claude's tool use has several distinctive features:
        - Parallel tool calls: Claude can request multiple tool invocations in a single turn
        - Chained reasoning: Claude can use tool results to decide on subsequent tool calls
        - Computer use: A specialized tool type that allows Claude to interact with desktop
          GUIs by generating mouse clicks, keyboard inputs, and screenshot analysis

        For agentic architectures, Claude works well in a loop pattern:
        1. Send the user request with available tools
        2. Claude responds with tool_use content blocks
        3. Your application executes the tools and returns tool_result blocks
        4. Claude processes the results and either calls more tools or produces a final answer
        5. Repeat until Claude produces a text-only response (no tool calls)

        Best practices: Keep tool descriptions concise but precise. Include parameter
        descriptions and examples. Use enums to constrain parameter values. For complex
        agents, provide a system prompt that explains the overall workflow and when to use
        each tool.
      tags: ["tool-use", "agents", "function-calling"]

    - topic: "When to Choose Claude vs Alternatives"
      content: |
        Choose Claude when:
        - You need to process very long documents (200K token context window across all tiers)
        - Analysis, writing quality, and nuanced instruction following are priorities
        - Safety and thoughtful handling of edge cases matter to your application
        - You want prompt caching for cost-effective repeated large prompts
        - You need extended thinking for complex reasoning tasks
        - Multi-cloud availability (direct API + Bedrock + Vertex) is important

        Consider OpenAI GPT when:
        - You need the largest ecosystem of third-party integrations and tutorials
        - Audio input/output (native multimodal) is required
        - Fine-tuning API access is needed
        - You want the broadest range of model sizes and specializations

        Consider Google Gemini when:
        - You need context windows beyond 200K tokens (Gemini supports up to 2M)
        - Google Search grounding for factual accuracy is important
        - You are heavily invested in Google Cloud Platform
        - Lowest cost for long-context tasks is the priority

        Consider Ollama / local models when:
        - Data must never leave your infrastructure
        - You need offline or air-gapped inference
        - Cost predictability with no per-token charges is essential
      tags: ["decision", "comparison"]

    - topic: "Limitations and Trade-offs"
      content: |
        Key limitations to consider when adopting Claude:

        1. No fine-tuning API: Unlike OpenAI, Anthropic does not offer a public fine-tuning
        service. You must rely on prompt engineering, few-shot examples, and prompt caching
        to customize behavior.

        2. No audio modality: Claude processes text and images but does not support audio
        input or text-to-speech output natively. Use a separate speech service if needed.

        3. No self-hosted option: Claude is available only via API (direct, Bedrock, or
        Vertex). For fully air-gapped environments, consider open-weight models via Ollama.

        4. Rate limits: Default rate limits are lower than some competitors. Enterprise
        agreements or Bedrock provisioned throughput can address this.

        5. Output length: Maximum output varies by model (8K-32K tokens). For very long
        generation tasks, you may need to implement continuation logic.

        6. Regional availability: Direct API is US-hosted. For EU data residency, use
        Amazon Bedrock or Google Vertex AI in EU regions.
      tags: ["limitations", "trade-offs"]

code_examples:
  - title: "Basic Message with System Prompt"
    language: "python"
    code: |
      import anthropic

      client = anthropic.Anthropic()  # Uses ANTHROPIC_API_KEY env var

      message = client.messages.create(
          model="claude-sonnet-4-20250514",
          max_tokens=1024,
          system="You are a senior software architect. Be concise and practical.",
          messages=[
              {"role": "user", "content": "What are the key differences between REST and gRPC?"}
          ]
      )

      print(message.content[0].text)

  - title: "Tool Use (Function Calling)"
    language: "python"
    code: |
      import anthropic
      import json

      client = anthropic.Anthropic()

      tools = [
          {
              "name": "query_database",
              "description": "Execute a SQL query against the analytics database",
              "input_schema": {
                  "type": "object",
                  "properties": {
                      "query": {"type": "string", "description": "SQL query to execute"},
                      "limit": {"type": "integer", "description": "Max rows to return"}
                  },
                  "required": ["query"]
              }
          }
      ]

      response = client.messages.create(
          model="claude-sonnet-4-20250514",
          max_tokens=1024,
          tools=tools,
          messages=[
              {"role": "user", "content": "How many users signed up last month?"}
          ]
      )

      # Process tool use blocks
      for block in response.content:
          if block.type == "tool_use":
              print(f"Tool: {block.name}")
              print(f"Input: {json.dumps(block.input, indent=2)}")

  - title: "Streaming with Extended Thinking"
    language: "python"
    code: |
      import anthropic

      client = anthropic.Anthropic()

      with client.messages.stream(
          model="claude-sonnet-4-20250514",
          max_tokens=16000,
          thinking={
              "type": "enabled",
              "budget_tokens": 10000
          },
          messages=[
              {
                  "role": "user",
                  "content": "Solve this step by step: If a train travels at 60mph for "
                             "2.5 hours, then 80mph for 1.75 hours, what is the average "
                             "speed for the entire journey?"
              }
          ]
      ) as stream:
          for event in stream:
              if event.type == "content_block_delta":
                  if hasattr(event.delta, "thinking"):
                      print(f"[Thinking] {event.delta.thinking}", end="")
                  elif hasattr(event.delta, "text"):
                      print(event.delta.text, end="")

  - title: "Prompt Caching with RAG Context"
    language: "python"
    code: |
      import anthropic

      client = anthropic.Anthropic()

      # Large reference document is cached across requests
      response = client.messages.create(
          model="claude-sonnet-4-20250514",
          max_tokens=1024,
          system=[
              {
                  "type": "text",
                  "text": "You are a legal assistant. Use the reference document to answer questions.",
              },
              {
                  "type": "text",
                  "text": large_legal_document,  # 50K+ tokens, cached after first call
                  "cache_control": {"type": "ephemeral"}
              }
          ],
          messages=[
              {"role": "user", "content": "What are the termination clauses?"}
          ]
      )

      # Subsequent calls with the same system prompt get 90% input discount
      print(f"Cache read tokens: {response.usage.cache_read_input_tokens}")
      print(f"Cache creation tokens: {response.usage.cache_creation_input_tokens}")

