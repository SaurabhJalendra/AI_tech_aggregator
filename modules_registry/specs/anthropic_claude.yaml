identity:
  tagline: "Frontier AI models built for safety, reliability, and extended context understanding"
  description: |
    Anthropic's Claude family of large language models includes Claude Opus 4, Claude
    Sonnet 4, and Claude Haiku 3.5. These models are designed with a focus on safety,
    steerability, and honest behavior while delivering frontier-level performance on
    reasoning, analysis, code generation, and creative tasks.

    Claude models are accessible via the Anthropic API, Amazon Bedrock, and Google Cloud
    Vertex AI. The API supports streaming, tool use (function calling), vision (image
    analysis), structured JSON output, extended thinking for complex reasoning, and
    computer use capabilities for GUI automation.

    A distinguishing feature of Claude is its very large context window of 200K tokens
    across all models, enabling processing of entire codebases, long legal documents, or
    extensive conversation histories in a single request. Claude models are also known for
    nuanced instruction following, lower hallucination rates on factual tasks, and
    thoughtful handling of ambiguous or sensitive requests.
  logo_url: "/assets/modules/anthropic_claude.svg"
  website: "https://www.anthropic.com"
  documentation: "https://docs.anthropic.com"
  github: "https://github.com/anthropics/anthropic-sdk-python"
  license: "Proprietary"
  pricing_model: "paid"

