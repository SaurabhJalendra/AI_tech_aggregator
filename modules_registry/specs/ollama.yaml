identity:
  tagline: "Run open-weight LLMs locally with a single command"
  description: |
    Ollama is an open-source tool for running large language models locally on your own
    hardware. It packages model weights, configuration, and a runtime into a simple
    command-line interface and local API server, making it trivial to download and run
    models like Llama 3.3, Mistral, Gemma 2, Phi-4, Qwen 2.5, and DeepSeek-R1 on a
    laptop, workstation, or server.

    Ollama provides an OpenAI-compatible REST API, enabling drop-in replacement of cloud
    LLM providers in existing applications. This compatibility means tools built for the
    OpenAI API (LangChain, LlamaIndex, Open WebUI, etc.) can switch to Ollama with minimal
    code changes, running entirely on local infrastructure.

    The primary value proposition is data privacy and cost control. No data ever leaves
    your machine, there are no per-token charges, and inference can run fully offline.
    The trade-off is that local models require capable hardware (especially GPU VRAM) and
    generally do not match the quality of frontier cloud models like GPT-4o or Claude Opus
    on the most demanding tasks, though the gap narrows with each generation of open-weight
    models.
  logo_url: "/assets/modules/ollama.svg"
  website: "https://ollama.com"
  documentation: "https://github.com/ollama/ollama/blob/main/docs/api.md"
  github: "https://github.com/ollama/ollama"
  license: "MIT"
  pricing_model: "open_source"

