knowledge:
  entries:
    - topic: "DSPy vs LangChain"
      content: |
        DSPy and LangChain take fundamentally different approaches to LLM programming:

        LangChain is imperative: you manually craft prompts, chain them together,
        and iterate on prompt text through trial and error. Great for building
        applications quickly with explicit control.

        DSPy is declarative: you define what the pipeline should do (signatures
        and modules) and let the optimizer figure out how (prompts, examples,
        configurations). Better for systematic optimization and reproducibility.

        Use LangChain when: you need rapid prototyping, explicit control over
        prompts, extensive integrations, or a mature ecosystem with many examples.

        Use DSPy when: you want systematic prompt optimization, your pipeline
        has multiple LLM steps that need co-optimization, you have evaluation
        data and metrics to optimize against, or manual prompt engineering
        is hitting diminishing returns.

        They can be used together: DSPy can optimize prompts that are then
        deployed in a LangChain application.
      tags: ["comparison", "langchain", "decision"]

code_examples:
  - title: "Basic RAG with DSPy"
    language: "python"
    code: |
      import dspy

      # Configure LLM
      lm = dspy.LM("openai/gpt-4o-mini")
      dspy.configure(lm=lm)

      # Define RAG module
      class RAG(dspy.Module):
          def __init__(self, num_passages=3):
              self.retrieve = dspy.Retrieve(k=num_passages)
              self.generate = dspy.ChainOfThought("context, question -> answer")

          def forward(self, question):
              context = self.retrieve(question).passages
              return self.generate(context=context, question=question)

      # Use
      rag = RAG()
      result = rag(question="What is vector search?")
      print(result.answer)

  - title: "Optimize with BootstrapFewShot"
    language: "python"
    code: |
      import dspy
      from dspy.evaluate import Evaluate
      from dspy.teleprompt import BootstrapFewShot

      # Define metric
      def answer_accuracy(example, prediction, trace=None):
          return prediction.answer.lower() == example.answer.lower()

      # Compile/optimize
      optimizer = BootstrapFewShot(metric=answer_accuracy, max_bootstrapped_demos=4)
      optimized_rag = optimizer.compile(RAG(), trainset=train_examples)

      # Evaluate
      evaluator = Evaluate(devset=dev_examples, metric=answer_accuracy)
      score = evaluator(optimized_rag)
      print(f"Accuracy: {score}%")

