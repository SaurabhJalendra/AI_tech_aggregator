identity:
  tagline: "Programming framework for optimizing LLM pipelines with automatic prompt tuning"
  description: |
    DSPy is a framework from Stanford NLP for programming and optimizing LLM
    pipelines. Instead of manually engineering prompts, DSPy treats LLM calls as
    declarative modules with input/output signatures. An optimizer (compiler)
    automatically generates and tunes prompts or fine-tunes models to maximize
    a specified metric.

    DSPy introduces a paradigm shift: rather than writing prompts, you write
    programs using modules (ChainOfThought, ReAct, RAG) and let the optimizer
    find the best prompts, few-shot examples, and configurations. This makes
    LLM pipelines more systematic, reproducible, and maintainable.

    The framework supports all major LLM providers and can optimize prompts
    for any model. It is particularly valuable for complex pipelines where
    manual prompt engineering is insufficient or unmaintainable.
