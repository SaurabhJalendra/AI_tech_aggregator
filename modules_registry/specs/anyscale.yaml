knowledge:
  entries:
    - topic: "Anyscale vs Modal"
      content: |
        Anyscale and Modal both provide GPU compute for AI workloads:

        Anyscale: Built on Ray for distributed computing. Best for workloads that
        benefit from Ray's distributed primitives (distributed training, multi-GPU
        serving, batch processing across clusters). More complex but more powerful
        for truly distributed workloads.

        Modal: Serverless functions with GPU. Best for single-function workloads,
        simple API serving, and scenarios where operational simplicity matters most.
        Simpler but less powerful for distributed computing.

        Choose Anyscale when: you need distributed training, multi-node model
        serving, or complex batch processing. Choose Modal when: you want
        the simplest possible deployment for single-model serving or GPU functions.
      tags: ["comparison", "modal", "decision"]

code_examples:
  - title: "Deploy LLM with Anyscale"
    language: "python"
    code: |
      import anyscale
      from ray import serve
      from vllm import LLM, SamplingParams

      @serve.deployment(ray_actor_options={"num_gpus": 1})
      class LLMDeployment:
          def __init__(self):
              self.llm = LLM(model="meta-llama/Llama-3.1-70B-Instruct",
                             tensor_parallel_size=4)

          async def __call__(self, request):
              prompt = request.query_params.get("prompt")
              params = SamplingParams(temperature=0.7, max_tokens=256)
              outputs = self.llm.generate([prompt], params)
              return outputs[0].outputs[0].text

      app = LLMDeployment.bind()

