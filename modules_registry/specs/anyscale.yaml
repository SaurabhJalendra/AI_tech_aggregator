identity:
  tagline: "Production AI platform built on Ray for scalable ML workloads"
  description: |
    Anyscale is a managed platform built on Ray, the open-source distributed
    computing framework. It provides infrastructure for training, fine-tuning,
    and serving AI models at scale. Anyscale simplifies the operational complexity
    of running distributed ML workloads across clusters of CPUs and GPUs.

    Anyscale is the commercial offering from the creators of Ray, providing
    managed Ray clusters, GPU orchestration, model serving (via Ray Serve and
    vLLM), and fine-tuning pipelines. It is designed for teams that need the
    power of distributed computing without managing infrastructure.

    The platform is particularly strong for LLM serving at scale, distributed
    training, and batch inference workloads where Ray's distributed computing
    primitives provide significant advantages.
  logo_url: "/assets/modules/anyscale.svg"
  website: "https://www.anyscale.com"
  documentation: "https://docs.anyscale.com"
  github: "https://github.com/anyscale"
  license: "Proprietary"
  pricing_model: "paid"

