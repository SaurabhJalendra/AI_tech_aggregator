identity:
  tagline: "Advanced query rewriting techniques for improved retrieval: HyDE, multi-query, and step-back prompting"
  description: |
    Query transformation encompasses a set of techniques that modify or augment user queries
    before retrieval to improve the quality and coverage of retrieved documents. These
    techniques address the fundamental challenge that user queries are often short, ambiguous,
    or phrased differently from the language used in source documents.

    Key techniques include HyDE (Hypothetical Document Embeddings), which generates a
    hypothetical answer and uses its embedding for retrieval; multi-query, which generates
    multiple rephrased versions of the query to capture different perspectives; and step-back
    prompting, which abstracts the query to a higher-level question before retrieval.

    These methods leverage LLMs to bridge the vocabulary gap between queries and documents,
    significantly improving retrieval recall. They are especially valuable in RAG pipelines
    where the quality of retrieved context directly impacts the final answer quality.

    Query transformation is typically implemented as a preprocessing step before the retriever,
    adding one LLM call but often dramatically improving the relevance of retrieved documents.
