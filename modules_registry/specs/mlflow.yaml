comparison_dimensions:
  performance:
    score: 7
    justification: "Lightweight tracking overhead. Server performance depends on backend database choice."
  scalability:
    score: 8
    justification: "Scales with backend infrastructure. Production deployments handle millions of runs."
  ease_of_use:
    score: 7
    justification: "Simple API for basic tracking. Full platform setup requires more configuration than managed alternatives."
  cost_efficiency:
    score: 10
    justification: "Fully open-source with no licensing costs. Infrastructure costs are your own."
  community:
    score: 9
    justification: "Largest open-source ML lifecycle community. Extensive integrations and contributions."
  maturity:
    score: 9
    justification: "Created in 2018 by Databricks. Battle-tested at thousands of organizations."
  flexibility:
    score: 9
    justification: "Works with any ML framework. Supports traditional ML and LLM applications. Self-hosted or managed."
  data_privacy:
    score: 9
    justification: "Self-hosted on your own infrastructure with full data control. No external data sharing required."

knowledge:
  entries:
    - topic: "MLflow vs Weights & Biases"
      content: |
        MLflow and W&B are the two dominant experiment tracking platforms:

        MLflow advantages: fully open-source, self-hosted for complete data control,
        broader ML lifecycle coverage (model registry, deployment), deep Databricks
        integration, no vendor lock-in.

        W&B advantages: better visualization and dashboards, easier setup (cloud-hosted),
        more polished UI, better collaboration features, Weave for LLM evaluation.

        Choose MLflow when: you need self-hosted for data privacy, you're on Databricks,
        you want open-source with no vendor dependency, or you need the full ML lifecycle
        (not just tracking).

        Choose W&B when: you want the best visualization experience, cloud-hosted
        convenience, collaborative team features, or LLM-specific evaluation with Weave.
      tags: ["comparison", "weights-biases", "decision"]

code_examples:
  - title: "Experiment Tracking"
    language: "python"
    code: |
      import mlflow

      mlflow.set_experiment("rag-optimization")

      with mlflow.start_run():
          mlflow.log_params({
              "embedding_model": "text-embedding-3-small",
              "chunk_size": 512,
              "retriever_top_k": 5
          })

          # Run your pipeline and evaluate
          metrics = evaluate_rag_pipeline(config)

          mlflow.log_metrics({
              "faithfulness": metrics["faithfulness"],
              "relevancy": metrics["relevancy"],
              "latency_p50_ms": metrics["latency_p50"]
          })

  - title: "LLM Evaluation"
    language: "python"
    code: |
      import mlflow

      # Evaluate an LLM with built-in metrics
      results = mlflow.evaluate(
          model="openai:/gpt-4o",
          data=eval_dataset,
          targets="ground_truth",
          model_type="question-answering",
          extra_metrics=[
              mlflow.metrics.faithfulness(),
              mlflow.metrics.answer_relevancy()
          ]
      )

      print(f"Faithfulness: {results.metrics['faithfulness/mean']}")

benchmarks:
