  subcategory: "ml_lifecycle"
  status: "stable"
  last_updated: "2026-02-28"
  maintainer: "system"

identity:
  tagline: "Open-source platform for the complete ML lifecycle"
  description: |
    MLflow is an open-source platform for managing the end-to-end machine learning
    lifecycle. It provides tools for experiment tracking, model packaging, model
    registry, and deployment. Originally created by Databricks, MLflow has become
    the most widely used open-source ML lifecycle platform.

    MLflow's four core components are: Tracking (logging parameters, metrics, and
    artifacts), Projects (packaging ML code for reproducibility), Models (standard
    format for packaging models), and Model Registry (centralized model store with
    versioning and stage transitions).

    MLflow has expanded to support LLM applications with MLflow AI Gateway (unified
    API for multiple LLM providers), LLM evaluation tools, and tracing for LLM
    pipelines. It integrates deeply with Databricks but runs independently on
    any infrastructure.
  logo_url: "/assets/modules/mlflow.svg"
  website: "https://mlflow.org"
  documentation: "https://mlflow.org/docs/latest/"
  github: "https://github.com/mlflow/mlflow"
  license: "Apache-2.0"
  pricing_model: "open_source"

capabilities:
  primary_use_cases:
    - "ML experiment tracking"
    - "Model versioning and registry"
    - "ML model deployment"
    - "LLM evaluation"
    - "Reproducible ML pipelines"
