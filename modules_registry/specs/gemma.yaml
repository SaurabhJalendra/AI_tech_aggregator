identity:
  tagline: Google's lightweight open models for edge, on-device, and cost-efficient
    RAG
  description: 'Gemma is a foundation model family in the Google ecosystem, catalogued

    for architecture decisions at the generation step of AI pipelines. This module
    covers

    model capabilities, context, modalities, deployment fit, and trade-offs — not
    API vendor

    integration (see cloud_api modules such as openai or google_gemini for that layer).


    Strengths: Small footprint, Google research lineage, Good for SLMs.

    Tradeoffs: Not frontier-class on hard reasoning.'
  logo_url: /assets/modules/gemma.svg
  website: https://ai.google.dev/gemma
  documentation: https://ai.google.dev/gemma/docs
  github: https://github.com/google-gemma
  license: Gemma License
  pricing_model: open_source
