knowledge:
  entries:
  - topic: When to choose Gemma
    content: 'Choose Gemma when your architecture needs edge inference

      and you can accept tradeoffs: Not frontier-class on hard reasoning.

      Pair with retrieval and evaluation modules; use cloud_api entries only

      when the decision is specifically about API routing, billing, or VPC — not

      model family selection.'
    tags:
    - model-selection
    - architecture
    - foundation_model
  - topic: Gemma vs alternatives
    content: 'Compare against phi, llama_3, gemini_flash at the foundation_model layer
      only.

      Do not compare to inference hosts (groq_inference), local runners (ollama),
      or

      provider APIs (openai) in the same shortlist — the advisor enforces layer separation.'
    tags:
    - comparison
    - trade-offs
code_examples:
- title: Reference architecture slot — Gemma
  language: python
  code: '# Foundation model slot: gemma

    # Generation step follows retrieval; outputs go to evaluation.

    PIPELINE_LLM = "gemma"'
