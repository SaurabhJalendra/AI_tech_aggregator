knowledge:
  entries:
  - topic: When to choose Claude Sonnet
    content: 'Choose Claude Sonnet when your architecture needs production chat

      and you can accept tradeoffs: Less peak reasoning than Opus.

      Pair with retrieval and evaluation modules; use cloud_api entries only

      when the decision is specifically about API routing, billing, or VPC — not

      model family selection.'
    tags:
    - model-selection
    - architecture
    - foundation_model
  - topic: Claude Sonnet vs alternatives
    content: 'Compare against gpt4_1, gemini_flash, claude_opus at the foundation_model
      layer only.

      Do not compare to inference hosts (groq_inference), local runners (ollama),
      or

      provider APIs (openai) in the same shortlist — the advisor enforces layer separation.'
    tags:
    - comparison
    - trade-offs
