identity:
  tagline: Balanced Claude tier for production workloads — capability without Opus
    cost
  description: 'Claude Sonnet is a foundation model family in the Anthropic ecosystem,
    catalogued

    for architecture decisions at the generation step of AI pipelines. This module
    covers

    model capabilities, context, modalities, deployment fit, and trade-offs — not
    API vendor

    integration (see cloud_api modules such as openai or google_gemini for that layer).


    Strengths: Cost-performance balance, Reliable instruction following, Prompt caching.

    Tradeoffs: Less peak reasoning than Opus, No on-prem weights.'
