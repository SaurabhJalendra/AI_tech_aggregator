knowledge:
  entries:
    - topic: "Why Instructor Over Raw JSON Mode"
      content: |
        While many LLMs support JSON mode natively, Instructor adds critical
        production features:

        1. Validation: Pydantic ensures types, constraints, and custom validators
        are satisfied. Raw JSON mode just gives you JSON, not validated data.

        2. Automatic retries: If the LLM output fails validation, Instructor
        sends the error back to the LLM for correction. This dramatically
        improves reliability.

        3. Streaming: Instructor supports partial object streaming, where you
        get partial Pydantic objects as tokens arrive. This enables progressive
        UI updates with typed data.

        4. Provider abstraction: Same Pydantic models work across OpenAI,
        Anthropic, Google, and others without changing your extraction code.

        5. Complex types: Nested models, optional fields, lists, enums, and
        custom validators all work naturally with Pydantic.
      tags: ["comparison", "json-mode", "features"]

code_examples:
  - title: "Basic Structured Extraction"
    language: "python"
    code: |
      import instructor
      from openai import OpenAI
      from pydantic import BaseModel

      client = instructor.from_openai(OpenAI())

      class UserInfo(BaseModel):
          name: str
          age: int
          email: str

      user = client.chat.completions.create(
          model="gpt-4o",
          response_model=UserInfo,
          messages=[
              {"role": "user", "content": "John Doe is 30 years old. Email: john@example.com"}
          ]
      )

      print(user.name)   # "John Doe"
      print(user.age)    # 30
      print(user.email)  # "john@example.com"

  - title: "Complex Extraction with Validation"
    language: "python"
    code: |
      import instructor
      from openai import OpenAI
      from pydantic import BaseModel, Field, field_validator

      client = instructor.from_openai(OpenAI())

      class TechComparison(BaseModel):
          name: str
          category: str
          pros: list[str] = Field(min_length=2)
          cons: list[str] = Field(min_length=1)
          score: int = Field(ge=1, le=10)

          @field_validator("score")
          @classmethod
          def validate_score(cls, v):
              if v < 1 or v > 10:
                  raise ValueError("Score must be between 1 and 10")
              return v

      comparison = client.chat.completions.create(
          model="gpt-4o",
          response_model=TechComparison,
          messages=[
              {"role": "user", "content": "Evaluate Pinecone as a vector database"}
          ],
          max_retries=3
      )

  - title: "Streaming Partial Objects"
    language: "python"
    code: |
      import instructor
      from openai import OpenAI
      from pydantic import BaseModel

      client = instructor.from_openai(OpenAI())

      class Report(BaseModel):
          title: str
          summary: str
          recommendations: list[str]

      for partial in client.chat.completions.create_partial(
          model="gpt-4o",
          response_model=Report,
          messages=[{"role": "user", "content": "Write a report on vector DB trends"}]
      ):
          print(partial.model_dump())  # Partial object updates as tokens stream

