identity:
  tagline: "Structured outputs from LLMs using Pydantic models"
  description: |
    Instructor is a Python library that makes it easy to get structured, typed
    outputs from LLMs. It patches LLM client libraries (OpenAI, Anthropic, Google,
    Mistral, etc.) to accept Pydantic models as response schemas, handling
    validation, retries, and parsing automatically.

    Instead of parsing free-text LLM responses with fragile regex or string
    manipulation, Instructor lets you define a Pydantic model and get back a
    validated Python object. If the LLM output doesn't match the schema,
    Instructor automatically retries with the validation error message,
    leveraging the LLM's ability to self-correct.

    Instructor supports multiple modes including function calling, JSON mode,
    and tool use depending on the provider. It has become the de facto standard
    for structured LLM output in Python applications.
  logo_url: "/assets/modules/instructor.svg"
  website: "https://python.useinstructor.com"
  documentation: "https://python.useinstructor.com"
  github: "https://github.com/jxnl/instructor"
  license: "MIT"
  pricing_model: "open_source"

