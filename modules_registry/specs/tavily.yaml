identity:
  tagline: "Search API built specifically for AI agents and LLM applications"
  description: |
    Tavily is a search engine and API designed from the ground up for AI applications.
    Unlike traditional search APIs that return a list of links, Tavily returns
    clean, relevant content optimized for LLM consumption. It handles the full
    pipeline of searching, scraping, filtering, and extracting relevant content
    from web pages, delivering concise answers and source documents ready for
    RAG pipelines.

    Tavily offers two main modes: a search API that returns relevant snippets
    and sources, and an extract API that pulls structured content from specific
    URLs. Both are designed to minimize token usage while maximizing information
    quality for downstream LLM processing.

    The service has gained strong adoption in the AI agent ecosystem, with native
    integrations in LangChain, LlamaIndex, CrewAI, and other agent frameworks.
    It is particularly popular for building research agents and real-time
    information retrieval systems.
  logo_url: "/assets/modules/tavily.svg"
  website: "https://tavily.com"
  documentation: "https://docs.tavily.com"
  github: "https://github.com/tavily-ai/tavily-python"
  license: "Proprietary"
  pricing_model: "freemium"

