knowledge:
  entries:
    - topic: "How Tavily Differs from Traditional Search APIs"
      content: |
        Traditional search APIs like Google Custom Search or Bing Search return
        a list of URLs with brief snippets. Building an AI application on top of
        these requires additional steps: fetching each page, parsing HTML, extracting
        relevant content, and filtering noise. This adds latency, complexity, and cost.

        Tavily handles this entire pipeline internally. When you make a search request,
        Tavily searches the web, visits the most relevant pages, extracts and cleans
        the content, and returns structured results with relevant text snippets. The
        response is optimized for LLM context windows, reducing token waste.

        The advanced search mode goes further by performing deeper content extraction
        and cross-referencing multiple sources. This is particularly valuable for
        research tasks where accuracy and comprehensiveness matter more than speed.
      tags: ["comparison", "architecture"]

    - topic: "Using Tavily with AI Agents"
      content: |
        Tavily is designed as a tool for AI agents. In the LangChain ecosystem,
        TavilySearchResults is one of the most commonly used tools for giving
        agents web access. The tool returns structured search results that agents
        can reason over to answer questions or gather information.

        For agent frameworks like CrewAI and AutoGen, Tavily provides pre-built
        tool definitions that can be directly assigned to agents. This allows
        multi-agent systems to have dedicated research agents that use Tavily
        for information gathering.

        Best practices for agent integration: (1) Use basic search for simple
        factual queries, (2) Use advanced search for complex research tasks,
        (3) Set include_domains to restrict to authoritative sources when accuracy
        is critical, (4) Use the get_search_context helper to get pre-formatted
        content ready for LLM prompts.
      tags: ["agents", "integration", "best-practices"]

    - topic: "Tavily Extract API"
      content: |
        The Extract API complements the Search API by allowing you to pull
        structured content from specific URLs. This is useful when you already
        know which pages contain relevant information and need to extract their
        content cleanly.

        The Extract API handles JavaScript-rendered pages, removes boilerplate
        (navigation, ads, footers), and returns the main content in clean text
        format. It supports batch extraction of multiple URLs in a single call.

        Common use cases include: extracting documentation pages for a knowledge
        base, pulling product information from known e-commerce URLs, and
        converting web articles into structured data for downstream processing.
      tags: ["extract", "scraping", "api"]

code_examples:
  - title: "Basic Web Search"
    language: "python"
    code: |
      from tavily import TavilyClient

      client = TavilyClient(api_key="your-api-key")

      # Simple search
      response = client.search(
          query="latest developments in RAG architectures 2026",
          search_depth="advanced",
          max_results=5
      )

      for result in response["results"]:
          print(f"Title: {result['title']}")
          print(f"URL: {result['url']}")
          print(f"Content: {result['content'][:200]}")
          print("---")

  - title: "LangChain Agent with Tavily Search"
    language: "python"
    code: |
      from langchain_community.tools.tavily_search import TavilySearchResults
      from langchain_openai import ChatOpenAI
      from langchain.agents import create_tool_calling_agent, AgentExecutor
      from langchain_core.prompts import ChatPromptTemplate

      # Create Tavily search tool
      search_tool = TavilySearchResults(max_results=5)

      # Create agent
      llm = ChatOpenAI(model="gpt-4o")
      prompt = ChatPromptTemplate.from_messages([
          ("system", "You are a research assistant. Use search to find information."),
          ("human", "{input}"),
          ("placeholder", "{agent_scratchpad}")
      ])
      agent = create_tool_calling_agent(llm, [search_tool], prompt)
      executor = AgentExecutor(agent=agent, tools=[search_tool])

      result = executor.invoke({"input": "What are the newest vector databases in 2026?"})

  - title: "Search Context for RAG"
    language: "python"
    code: |
      from tavily import TavilyClient

      client = TavilyClient(api_key="your-api-key")

      # Get pre-formatted context for LLM
      context = client.get_search_context(
          query="How does hybrid search work in vector databases?",
          max_tokens=4000
      )

      # Use context directly in your prompt
      prompt = f"""Based on the following information:
      {context}

      Answer: How does hybrid search work in vector databases?"""

