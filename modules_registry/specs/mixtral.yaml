identity:
  tagline: Mistral's sparse MoE open-weight model — strong quality per dollar when
    self-hosted
  description: 'Mixtral is a foundation model family in the Mistral ecosystem, catalogued

    for architecture decisions at the generation step of AI pipelines. This module
    covers

    model capabilities, context, modalities, deployment fit, and trade-offs — not
    API vendor

    integration (see cloud_api modules such as openai or google_gemini for that layer).


    Strengths: MoE efficiency, Open weights, Good multilingual.

    Tradeoffs: MoE serving complexity, Less turnkey than APIs.'
  logo_url: /assets/modules/mixtral.svg
  website: https://mistral.ai
  documentation: https://docs.mistral.ai
  github: https://github.com/mistralai/mistral-inference
  license: Apache-2.0
  pricing_model: open_source
