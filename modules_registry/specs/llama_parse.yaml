knowledge:
  entries:
    - topic: "When to Choose LlamaParse"
      content: |
        LlamaParse excels in scenarios where document complexity exceeds what
        traditional parsing can handle:

        1. Financial documents with complex tables spanning multiple pages,
        footnotes, and mixed text/numeric content.
        2. Research papers with equations, figures, and multi-column layouts.
        3. Technical documentation with code blocks, diagrams, and nested lists.
        4. Scanned documents where OCR alone produces poor results.

        For simpler documents (plain text PDFs, basic DOCX files), open-source
        alternatives like Docling or Unstructured provide comparable quality
        at no cost. LlamaParse's advantage is specifically in handling the
        hard cases where layout complexity matters.
      tags: ["decision", "comparison"]

    - topic: "Integration with LlamaIndex RAG Pipeline"
      content: |
        LlamaParse is designed as the first step in a LlamaIndex RAG pipeline.
        The typical workflow is:

        1. Parse documents with LlamaParse to get structured markdown.
        2. Use a MarkdownNodeParser or SentenceSplitter to create nodes.
        3. Generate embeddings with an embedding model.
        4. Index nodes in a vector store.
        5. Create a query engine for retrieval and generation.

        The LlamaParseReader class integrates directly with LlamaIndex's
        ingestion pipeline, handling the parse-to-node conversion automatically.
        This tight integration is LlamaParse's main advantage over standalone
        parsing services.
      tags: ["llamaindex", "rag", "pipeline"]

code_examples:
  - title: "Basic Document Parsing"
    language: "python"
    code: |
      from llama_parse import LlamaParse

      parser = LlamaParse(
          api_key="your-api-key",
          result_type="markdown"
      )

      # Parse a document
      documents = parser.load_data("path/to/complex-report.pdf")

      for doc in documents:
          print(doc.text[:500])

  - title: "LlamaIndex RAG Pipeline"
    language: "python"
    code: |
      from llama_parse import LlamaParse
      from llama_index.core import VectorStoreIndex
      from llama_index.core.node_parser import MarkdownNodeParser

      # Parse documents
      parser = LlamaParse(api_key="your-key", result_type="markdown")
      documents = parser.load_data("financial_report.pdf")

      # Create nodes from markdown
      node_parser = MarkdownNodeParser()
      nodes = node_parser.get_nodes_from_documents(documents)

      # Build index and query
      index = VectorStoreIndex(nodes)
      query_engine = index.as_query_engine()

      response = query_engine.query("What was the revenue growth in Q4?")

