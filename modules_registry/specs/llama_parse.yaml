identity:
  tagline: "LlamaIndex's managed document parsing service for complex PDFs and documents"
  description: |
    LlamaParse is a managed document parsing service developed by LlamaIndex
    (formerly GPT Index). It uses proprietary models to parse complex documents
    including PDFs with tables, charts, diagrams, and mixed layouts into clean
    structured output optimized for LLM consumption.

    LlamaParse differentiates itself by using LLM-powered parsing for complex
    elements that traditional OCR and layout analysis struggle with, such as
    interpreting charts, understanding figure captions, and extracting structured
    data from complex table layouts. It produces markdown output with preserved
    structure.

    The service integrates natively with LlamaIndex and is available as a cloud
    API. It is particularly strong at handling financial documents, research papers,
    and technical documentation with complex formatting.
  logo_url: "/assets/modules/llama_parse.svg"
  website: "https://cloud.llamaindex.ai"
  documentation: "https://docs.cloud.llamaindex.ai/llamaparse/getting_started"
  github: "https://github.com/run-llama/llama_parse"
  license: "Proprietary"
  pricing_model: "freemium"

