identity:
  tagline: "Open-source distributed vector database built for billion-scale similarity search"
  description: |
    Milvus is an open-source vector database designed from the ground up for massive-scale
    vector similarity search. Developed by Zilliz and graduated as a Linux Foundation AI
    project, Milvus is engineered to handle billion-vector datasets with consistent
    performance through its cloud-native, distributed architecture.

    Milvus separates storage and compute, using a shared-storage architecture built on
    object storage (S3, MinIO) with a message queue (Pulsar, Kafka) for write-ahead logging.
    This design enables independent scaling of query nodes, data nodes, and index nodes,
    making it suitable for enterprise deployments where data volume and query load can
    vary independently.

    The database supports multiple index types including IVF, HNSW, DiskANN, and GPU-based
    indexes (GPU-IVF, GPU-CAGRA), providing flexibility to optimize for different
    latency-throughput-recall tradeoffs. Milvus also supports hybrid search combining
    dense vectors, sparse vectors, and scalar filtering in a single query.

    Zilliz Cloud offers a fully managed Milvus service, while Milvus Lite provides an
    embedded version for development and edge deployment.
  logo_url: "/assets/modules/milvus.svg"
  website: "https://milvus.io"
  documentation: "https://milvus.io/docs"
  github: "https://github.com/milvus-io/milvus"
  license: "Apache-2.0"
  pricing_model: "open_source"

