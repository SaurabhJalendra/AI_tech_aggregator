knowledge:
  entries:
    - topic: "Choosing the Right Claude Tier"
      content: |
        Selecting the right Claude model tier is a critical architecture decision that
        balances capability, latency, and cost:

        Claude Opus 4: Use for tasks requiring deep reasoning, multi-step planning, or
        agentic workflows where quality cannot be compromised. Examples include complex
        code refactoring across multiple files, legal document analysis with nuanced
        interpretation, research synthesis across many sources, and autonomous agent
        loops that require reliable tool use. Expect 10-30 second response times for
        complex queries. Pricing is approximately 5-10x Sonnet.

        Claude Sonnet 4: The default choice for most production applications. Provides
        80-90% of Opus quality at significantly lower cost and faster speed. Ideal for
        RAG pipelines, customer-facing chatbots, content generation, code assistance,
        and structured extraction. Response times typically 2-8 seconds.

        Claude Haiku 3.5: Optimized for high-throughput, low-latency tasks. Use for
        intent classification, content moderation, entity extraction, query routing
        in multi-agent systems, and any task where sub-second response times matter
        more than nuanced reasoning. Cost is roughly 1/10th of Sonnet.

        A common pattern is to use Haiku for routing and classification, Sonnet for
        the majority of user-facing tasks, and Opus for the hardest problems or as
        a fallback when Sonnet's output quality is insufficient.
      tags: ["model-selection", "architecture", "cost"]

    - topic: "Extended Thinking for Complex Reasoning"
      content: |
        Extended thinking is a Claude feature that enables chain-of-thought reasoning
        within the model before generating the final response. When enabled, Claude
        produces a thinking block (visible or hidden depending on configuration) where
        it works through the problem step by step.

        This is particularly valuable for: mathematical proofs and calculations, complex
        code debugging, multi-constraint optimization problems, legal or policy analysis
        requiring consideration of multiple factors, and strategic planning tasks.

        To use extended thinking, set the thinking parameter in your API call. You can
        control the budget (maximum thinking tokens) to balance reasoning depth against
        latency and cost. A budget of 5000-10000 tokens covers most use cases. For
        extremely complex problems, budgets up to 50000 tokens may be warranted.

        Design consideration: extended thinking adds latency (typically 5-30 seconds
        depending on budget). For interactive applications, consider showing a
        "thinking" indicator to users, or use extended thinking only for queries
        classified as complex by a faster model (Haiku).
      tags: ["extended-thinking", "reasoning", "advanced"]

    - topic: "Designing Agentic Workflows with Claude"
      content: |
        Claude's tool use capabilities make it well-suited for agentic systems where
        the model orchestrates multi-step workflows by calling external tools and APIs.

        Key design principles for Claude-based agents:

        1. Tool definitions should be precise and include examples. Claude follows tool
        schemas strictly, so well-defined schemas reduce errors significantly.

        2. Use system prompts to establish the agent's role, constraints, and decision
        framework. Claude's strong instruction following means the system prompt is
        a reliable control mechanism.

        3. Implement tool result validation before passing results back to Claude. The
        agent loop should catch and handle tool failures gracefully.

        4. For multi-agent systems, use Haiku as a router to classify incoming requests
        and delegate to specialized Sonnet or Opus agents. This keeps costs manageable
        while maintaining quality on complex tasks.

        5. Computer use capabilities allow Claude to interact with GUIs, enabling
        automation of web-based workflows, testing, and data entry tasks that lack
        APIs. This is available on Sonnet and Opus models.

        6. Set reasonable iteration limits (typically 5-15 tool calls per turn) to
        prevent runaway agent loops, and implement cost tracking per session.
      tags: ["agents", "tool-use", "architecture"]

    - topic: "Long Context Strategies"
      content: |
        Claude's 200K-token context window enables architectural patterns that reduce
        or eliminate the need for traditional RAG retrieval:

        Stuffing: For documents under 200K tokens, pass the entire document directly
        in context. This avoids retrieval errors and chunking artifacts. Works well
        for single-document analysis, code review, and contract analysis.

        Hierarchical summarization: For content exceeding the context window, first
        use Haiku to summarize sections, then pass summaries to Sonnet/Opus for
        synthesis. This is cheaper and often more effective than RAG for tasks
        requiring holistic understanding.

        Hybrid RAG + Long Context: Use vector search to retrieve relevant chunks,
        then include more surrounding context than you would with a smaller context
        window. For example, retrieve the top 5 chunks but include 2000 tokens of
        context around each chunk rather than just 500.

        Prompt caching: For repeated queries against the same large document, use
        Anthropic's prompt caching to reduce cost and latency. The cached prefix
        is only billed once, making multi-turn conversations over large documents
        significantly cheaper.
      tags: ["long-context", "rag", "architecture"]

    - topic: "Limitations and Considerations"
      content: |
        Important limitations to consider when building with Claude:

        1. No fine-tuning: Unlike GPT-4 or Gemini, Claude does not offer fine-tuning.
        For domain-specific behavior, rely on system prompts, few-shot examples, and
        RAG rather than model customization.

        2. Rate limits: Default rate limits may constrain high-throughput applications.
        Work with Anthropic's sales team for increased limits, or deploy through
        Bedrock/Vertex AI for higher throughput.

        3. No real-time data: Claude's training cutoff means it lacks knowledge of
        recent events. Use tool use or RAG to provide current information.

        4. Image-only vision: Claude processes images and PDFs but does not handle
        audio or video natively. For multimodal pipelines requiring audio/video,
        consider Gemini or use preprocessing tools.

        5. Output length limits: While context windows are large, maximum output
        tokens are capped per model tier. For tasks requiring very long outputs,
        implement continuation strategies.

        6. Pricing on extended thinking: Thinking tokens consume the same per-token
        cost as output tokens, which can significantly increase costs for complex
        reasoning tasks. Monitor and budget accordingly.
      tags: ["limitations", "trade-offs", "planning"]

code_examples:
  - title: "Multi-tier Model Routing"
    language: "python"
    code: |
      import anthropic

      client = anthropic.Anthropic()

      def route_and_respond(user_query: str) -> str:
          # Step 1: Use Haiku to classify complexity
          classification = client.messages.create(
              model="claude-haiku-3-5-20250101",
              max_tokens=50,
              messages=[{"role": "user", "content": f"Classify as SIMPLE or COMPLEX: {user_query}"}],
              system="Respond with exactly SIMPLE or COMPLEX."
          )
          complexity = classification.content[0].text.strip()

          # Step 2: Route to appropriate model
          model = "claude-sonnet-4-20250101" if complexity == "SIMPLE" else "claude-opus-4-20250101"
          response = client.messages.create(
              model=model,
              max_tokens=4096,
              messages=[{"role": "user", "content": user_query}]
          )
          return response.content[0].text

  - title: "Extended Thinking for Complex Analysis"
    language: "python"
    code: |
      import anthropic

      client = anthropic.Anthropic()

      response = client.messages.create(
          model="claude-opus-4-20250101",
          max_tokens=16000,
          thinking={
              "type": "enabled",
              "budget_tokens": 10000
          },
          messages=[{
              "role": "user",
              "content": "Analyze this codebase for security vulnerabilities..."
          }]
      )

      # Access thinking and response separately
      for block in response.content:
          if block.type == "thinking":
              print(f"Reasoning: {block.thinking}")
          elif block.type == "text":
              print(f"Response: {block.text}")

  - title: "Agentic Tool Use Loop"
    language: "python"
    code: |
      import anthropic

      client = anthropic.Anthropic()
      tools = [
          {
              "name": "search_docs",
              "description": "Search internal documentation",
              "input_schema": {
                  "type": "object",
                  "properties": {
                      "query": {"type": "string"}
                  },
                  "required": ["query"]
              }
          }
      ]

      messages = [{"role": "user", "content": "Find our deployment guidelines"}]

      # Agent loop with iteration limit
      for _ in range(10):
          response = client.messages.create(
              model="claude-sonnet-4-20250101",
              max_tokens=4096,
              tools=tools,
              messages=messages
          )
          if response.stop_reason == "end_turn":
              break
          # Process tool calls
          for block in response.content:
              if block.type == "tool_use":
                  result = execute_tool(block.name, block.input)
                  messages.append({"role": "assistant", "content": response.content})
                  messages.append({
                      "role": "user",
                      "content": [{"type": "tool_result", "tool_use_id": block.id, "content": result}]
                  })

