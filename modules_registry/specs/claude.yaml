identity:
  tagline: "Anthropic's reasoning-first LLM family optimized for safety, long context, and agentic workflows"
  description: |
    Claude is Anthropic's flagship family of large language models, encompassing Opus 4,
    Sonnet 4, and Haiku 3.5 tiers. Unlike the anthropic_claude module which focuses on
    the API integration surface, this module covers Claude as a model choice within an
    AI stack -- its architecture tradeoffs, reasoning characteristics, context handling
    strategies, and how to design systems that leverage Claude's distinctive strengths.

    Claude models are trained with Constitutional AI (CAI) and RLHF, resulting in models
    that are notably steerable, follow nuanced instructions reliably, and exhibit lower
    hallucination rates on factual reasoning tasks compared to peers. The 200K-token
    context window across all tiers enables architectures that minimize chunking and
    retrieval complexity by fitting large documents directly into context.

    Claude Opus 4 represents the frontier for complex reasoning, multi-step planning,
    and agentic tool use. Sonnet 4 provides an excellent balance of capability and
    cost for production workloads, while Haiku 3.5 delivers fast, cost-efficient
    inference for high-throughput classification, extraction, and routing tasks.

    Key differentiators include extended thinking mode for chain-of-thought reasoning
    on hard problems, computer use capabilities for GUI automation agents, and strong
    performance on code generation, analysis, and multi-file refactoring tasks.
