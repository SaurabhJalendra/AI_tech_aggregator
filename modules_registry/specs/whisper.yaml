knowledge:
  entries:
    - topic: "Model Selection Guide"
      content: |
        Choosing the right Whisper model size depends on your accuracy requirements, latency
        budget, and available hardware:

        Tiny (39M): Best for real-time applications on CPU where accuracy is less critical.
        Suitable for command recognition and short utterances. ~32x faster than large.

        Base (74M): Good balance for CPU-based transcription of clear audio in common languages.
        Suitable for meeting transcription where some errors are acceptable.

        Small (244M): Recommended starting point for most applications. Runs well on modest
        GPUs and provides good accuracy across languages.

        Medium (769M): Strong multilingual performance. Recommended for non-English languages
        and noisy audio environments.

        Large-v3 (1.55B): Highest accuracy, especially for challenging audio (accents, noise,
        technical jargon). Requires a capable GPU (8GB+ VRAM).

        Turbo (809M): OpenAI's optimized model offering large-v3 quality at ~8x the speed.
        Recommended for production workloads needing both accuracy and throughput.

        For production deployments, faster-whisper (CTranslate2 backend) provides 4x speedup
        and 2x memory reduction compared to the original implementation while maintaining
        identical accuracy.
      tags: ["models", "selection", "performance"]

    - topic: "Production Deployment Patterns"
      content: |
        Common production deployment patterns for Whisper:

        1. Batch Processing: Use faster-whisper or WhisperX for offline transcription of
        audio files. Process files in parallel across multiple GPU workers. This is ideal
        for transcribing archives, podcasts, or video libraries.

        2. Real-Time Streaming: Use whisper-streaming or similar wrappers that segment audio
        into chunks and process them incrementally. Combine with VAD (Voice Activity Detection)
        to only process speech segments. Typical latency: 1-3 seconds behind real-time.

        3. API Service: Deploy behind a FastAPI or gRPC service with a queue for handling
        concurrent requests. Use GPU instances with batched inference for cost efficiency.

        4. Edge Deployment: Use whisper.cpp for CPU-only deployment on edge devices.
        The tiny and base models run in real-time on modern CPUs without GPU acceleration.

        5. Hybrid Pipeline: Use Whisper for transcription, then pipe output to an LLM for
        summarization, entity extraction, or question answering. This is the foundation
        of many voice AI applications.

        Key production considerations: implement retry logic for long audio files, use VAD
        preprocessing to skip silence, monitor word error rate (WER) on your specific domain,
        and consider fine-tuning on domain-specific vocabulary.
      tags: ["deployment", "production", "architecture"]

    - topic: "faster-whisper and Performance Optimization"
      content: |
        faster-whisper is a reimplementation of Whisper using CTranslate2, providing significant
        performance improvements:

        - 4x faster inference than the original OpenAI implementation
        - 2x less memory usage through INT8 quantization
        - Identical transcription accuracy (same model weights)
        - Batched inference support for throughput optimization

        Installation: pip install faster-whisper

        Additional optimization techniques:
        1. INT8 quantization: Halves memory usage with negligible accuracy impact
        2. VAD filtering: Use Silero VAD to skip non-speech segments, reducing processing time
        by 30-50% on typical audio
        3. Batched inference: Process multiple audio segments in parallel on a single GPU
        4. Chunked processing: Split long audio into overlapping chunks for consistent memory
        usage regardless of input length

        For maximum throughput on a single GPU, combine faster-whisper with batched inference
        and VAD filtering. A single NVIDIA A100 can transcribe approximately 150 hours of
        audio per hour of compute using the large-v3 model with these optimizations.
      tags: ["optimization", "faster-whisper", "performance"]

    - topic: "Limitations and Workarounds"
      content: |
        Known limitations of Whisper and how to address them:

        1. Hallucination on silence or noise: Whisper may generate phantom text when processing
        silent or very noisy segments. Workaround: Use VAD preprocessing to detect and skip
        non-speech regions before passing audio to Whisper.

        2. No native speaker diarization: Whisper does not identify who is speaking.
        Workaround: Use WhisperX or pyannote-audio for speaker diarization, then align
        timestamps with Whisper transcription.

        3. Repetition loops: On some audio, especially with background music, the model can
        get stuck in repetition loops. Workaround: Use temperature fallback (try temperature
        0 first, then increase) and set compression_ratio_threshold.

        4. Language confusion: On short audio clips or code-switched speech, language detection
        may be unreliable. Workaround: Explicitly set the language parameter when known.

        5. Punctuation inconsistency: Punctuation quality varies by language. For languages
        with lower punctuation accuracy, post-process with a punctuation restoration model.

        6. No streaming in the official API: The model processes complete audio segments.
        Real-time streaming requires community wrappers that handle chunking and buffer
        management.
      tags: ["limitations", "workarounds"]

code_examples:
  - title: "Basic Transcription"
    language: "python"
    code: |
      import whisper

      model = whisper.load_model("turbo")

      # Transcribe audio file
      result = model.transcribe("audio.mp3")
      print(result["text"])

      # With options
      result = model.transcribe(
          "audio.mp3",
          language="en",
          task="transcribe",
          word_timestamps=True,
          fp16=True
      )

      for segment in result["segments"]:
          print(f"[{segment['start']:.1f}s -> {segment['end']:.1f}s] {segment['text']}")

  - title: "faster-whisper for Production"
    language: "python"
    code: |
      from faster_whisper import WhisperModel

      # Load model with INT8 quantization
      model = WhisperModel("large-v3", device="cuda", compute_type="int8")

      # Transcribe with VAD filtering
      segments, info = model.transcribe(
          "audio.mp3",
          beam_size=5,
          language="en",
          vad_filter=True,
          vad_parameters=dict(min_silence_duration_ms=500)
      )

      print(f"Detected language: {info.language} (prob: {info.language_probability:.2f})")

      for segment in segments:
          print(f"[{segment.start:.2f}s -> {segment.end:.2f}s] {segment.text}")

  - title: "Real-Time Streaming Pipeline"
    language: "python"
    code: |
      from faster_whisper import WhisperModel
      import sounddevice as sd
      import numpy as np
      import queue

      model = WhisperModel("base", device="cpu", compute_type="int8")
      audio_queue = queue.Queue()

      def audio_callback(indata, frames, time, status):
          audio_queue.put(indata.copy())

      # Record and transcribe in chunks
      CHUNK_DURATION = 3  # seconds
      SAMPLE_RATE = 16000

      with sd.InputStream(samplerate=SAMPLE_RATE, channels=1,
                          callback=audio_callback):
          buffer = np.array([], dtype=np.float32)
          while True:
              data = audio_queue.get()
              buffer = np.append(buffer, data.flatten())
              if len(buffer) >= SAMPLE_RATE * CHUNK_DURATION:
                  segments, _ = model.transcribe(buffer, language="en")
                  for seg in segments:
                      print(seg.text, end=" ", flush=True)
                  buffer = np.array([], dtype=np.float32)

