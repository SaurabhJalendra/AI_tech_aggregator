identity:
  tagline: "Open-source automatic speech recognition model with robust multilingual support"
  description: |
    OpenAI Whisper is an open-source automatic speech recognition (ASR) system trained on
    680,000 hours of multilingual and multitask supervised data collected from the web. It
    approaches human-level robustness and accuracy on English speech recognition and supports
    transcription and translation across 99 languages.

    Whisper uses a Transformer-based encoder-decoder architecture. The audio is converted to
    a log-Mel spectrogram, processed by the encoder, and then decoded autoregressively into
    text tokens. The model is available in multiple sizes (tiny, base, small, medium, large,
    turbo) allowing users to trade accuracy for speed depending on their use case.

    Being fully open-source (MIT license), Whisper can be self-hosted, fine-tuned on domain
    specific data, and integrated into any pipeline without per-API-call costs. The community
    has built extensive tooling around it including faster inference engines (faster-whisper,
    whisper.cpp), real-time streaming wrappers, and speaker diarization integrations.
  logo_url: "/assets/modules/whisper.svg"
  website: "https://openai.com/research/whisper"
  documentation: "https://github.com/openai/whisper/blob/main/README.md"
  github: "https://github.com/openai/whisper"
  license: "MIT"
  pricing_model: "open_source"

