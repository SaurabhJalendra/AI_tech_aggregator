identity:
  tagline: "Industry-standard text embedding models from OpenAI for semantic search and RAG"
  description: |
    OpenAI's text-embedding models convert text into dense vector representations that capture
    semantic meaning. The current generation includes text-embedding-3-small and text-embedding-3-large,
    which offer significant improvements in quality and cost efficiency over the previous ada-002 model.

    A key innovation in the v3 models is native dimension reduction via the "dimensions" parameter,
    allowing developers to trade off embedding quality for storage and compute savings without
    retraining. For example, text-embedding-3-large can produce embeddings at 256, 1024, or the
    full 3072 dimensions, all from the same model.

    OpenAI embeddings are the most widely adopted embedding API in the industry, with first-class
    support in virtually every AI framework and vector database. They are accessed via a simple
    REST API or official SDKs and are priced per token processed.
  logo_url: "/assets/modules/openai_embeddings.svg"
  website: "https://platform.openai.com"
  documentation: "https://platform.openai.com/docs/guides/embeddings"
  github: "https://github.com/openai/openai-python"
  license: "Proprietary"
  pricing_model: "paid"

