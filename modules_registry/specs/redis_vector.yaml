comparison_dimensions:
  performance:
    score: 9
    justification: "In-memory architecture delivers sub-millisecond vector query latency. HNSW index provides consistent performance. Fastest vector search for datasets that fit in memory."
  scalability:
    score: 7
    justification: "Scales vertically with memory. Redis Cluster provides horizontal scaling but vector indexes are per-shard. Dataset size limited by available RAM, which is expensive at scale."
  ease_of_use:
    score: 7
    justification: "Familiar Redis interface with vector extensions. Redis Stack simplifies setup. However, index creation and schema design require understanding RediSearch query syntax."
  cost_efficiency:
    score: 5
    justification: "In-memory storage is expensive at scale. 1M 1536-dim vectors requires ~6GB RAM. Cost-effective for caching and small-medium datasets but expensive for billion-vector workloads."
  community:
    score: 9
