  - title: "Semantic Cache Implementation"
    language: "python"
    code: |
      import redis
      import numpy as np
      import hashlib
      from openai import OpenAI

      r = redis.Redis(host="localhost", port=6379)
      openai_client = OpenAI()

      SIMILARITY_THRESHOLD = 0.95
      CACHE_TTL = 3600  # 1 hour

      def get_embedding(text):
          resp = openai_client.embeddings.create(
              model="text-embedding-3-small", input=text
          )
          return resp.data[0].embedding

      def semantic_cache_query(query: str) -> str:
          query_embedding = get_embedding(query)
          query_bytes = np.array(query_embedding, dtype=np.float32).tobytes()

          # Search for similar cached queries
          q = (Query("*=>[KNN 1 @embedding $vec AS score]")
               .return_fields("response", "score")
               .dialect(2))
          results = r.ft("cache_idx").search(q, query_params={"vec": query_bytes})

          if results.docs and float(results.docs[0].score) < (1 - SIMILARITY_THRESHOLD):
              return results.docs[0].response  # Cache hit

          # Cache miss: call LLM
          llm_response = openai_client.chat.completions.create(
              model="gpt-4o", messages=[{"role": "user", "content": query}]
          ).choices[0].message.content

          # Store in cache with TTL
          cache_key = f"cache:{hashlib.md5(query.encode()).hexdigest()}"
          r.hset(cache_key, mapping={
              "query": query,
              "response": llm_response,
              "embedding": query_bytes,
          })
          r.expire(cache_key, CACHE_TTL)

          return llm_response

  - title: "LangChain Integration"
    language: "python"
    code: |
      from langchain_community.vectorstores.redis import Redis as RedisVectorStore
      from langchain_openai import OpenAIEmbeddings

      embeddings = OpenAIEmbeddings(model="text-embedding-3-small")

      # Create vector store from documents
      vectorstore = RedisVectorStore.from_documents(
          documents,
          embeddings,
          redis_url="redis://localhost:6379",
          index_name="langchain_docs",
      )

      # Similarity search
      results = vectorstore.similarity_search(
          "How does semantic caching work?",
          k=5,
      )

      # Use as retriever in RAG chain
      retriever = vectorstore.as_retriever(
          search_type="similarity",
          search_kwargs={"k": 5}
      )

