identity:
  tagline: "In-memory vector search and semantic caching built on Redis Stack"
  description: |
    Redis Vector Search extends Redis with vector similarity search capabilities through
    the RediSearch module (part of Redis Stack). It enables storing, indexing, and querying
    vector embeddings alongside traditional Redis data structures, combining the speed of
    in-memory operations with semantic search capabilities.

    The key advantage of Redis as a vector store is its dual role as both a high-performance
    cache and a vector database. This makes it ideal for semantic caching -- storing LLM
    responses alongside their query embeddings so that semantically similar future queries
    can be answered from cache instead of calling the LLM again, reducing latency and cost.

    Redis supports both FLAT (brute-force) and HNSW (approximate nearest neighbor) indexing
    algorithms. HNSW provides sub-millisecond query latency for datasets up to tens of
    millions of vectors. Combined with Redis's native features like TTL expiration, pub/sub,
    and Lua scripting, vector search integrates naturally into existing Redis-based
    architectures.
