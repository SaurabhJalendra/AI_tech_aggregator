knowledge:
  entries:
    - topic: "Semantic Caching Pattern"
      content: |
        Semantic caching is Redis Vector Search's killer use case in AI pipelines. The pattern:

        1. When an LLM query arrives, generate an embedding of the query.
        2. Search Redis for vectors similar to the query embedding (cosine similarity > 0.95).
        3. If a cache hit is found, return the cached LLM response immediately.
        4. If no cache hit, call the LLM, store the query embedding + response in Redis
           with a TTL, and return the response.

        This reduces LLM API costs by 30-70% for applications with repetitive queries
        (customer support, FAQ bots, documentation assistants). The similarity threshold
        controls the trade-off between cache hit rate and answer accuracy.

        Redis's native TTL support automatically expires stale cache entries, and its
        in-memory speed means cache lookups add <1ms latency. For a typical RAG application,
        semantic caching can reduce average response time from 2-5 seconds to <100ms for
        cache hits.
      tags: ["semantic-caching", "pattern", "cost-optimization"]

    - topic: "When to Choose Redis for Vector Search"
      content: |
        Redis is the right choice for vector search when:

        1. You need the absolute lowest query latency. In-memory HNSW delivers sub-ms
        queries that no disk-based vector database can match.

        2. You're already using Redis and want to add vector capabilities without
        introducing a new database. Redis Stack adds vector search to your existing
        Redis deployment.

        3. Your primary use case is semantic caching. Redis's native TTL, memory management,
        and eviction policies make it the natural choice for caching patterns.

        4. You need hybrid search combining vectors, full-text, numeric, and geo filters
        in single queries. RediSearch supports all of these natively.

        5. Your dataset fits in memory (up to tens of millions of vectors on large instances).

        Redis is NOT the right choice when: your dataset exceeds available RAM (use Pinecone,
        Milvus, or Qdrant), you need billion-vector scale (use purpose-built vector DBs),
        you need complex analytics on vectors (use Weaviate or Elasticsearch), or cost per
        GB is a primary concern (disk-based stores are 10x cheaper per GB).
      tags: ["decision", "comparison"]

    - topic: "Index Creation and Schema Design"
      content: |
        Redis vector indexes are created using the FT.CREATE command with a VECTOR field type.
        Key design decisions:

        Index algorithm choice:
        - FLAT: Brute-force exact search. Best for <10K vectors or when recall must be 100%.
          O(n) query time but no index build overhead.
        - HNSW: Approximate nearest neighbor. Best for >10K vectors. Configurable trade-off
          between recall and speed via M (connections per layer) and EF_CONSTRUCTION parameters.
          Default M=16, EF_CONSTRUCTION=200 gives >95% recall with sub-ms queries.

        Storage format:
        - HASH: Traditional Redis hash. Each vector is a field in a hash key.
        - JSON: Redis JSON document. Vectors stored as JSON arrays. More flexible metadata
          but slightly higher memory usage.

        Recommended HNSW parameters by dataset size:
        - <100K vectors: M=16, EF_CONSTRUCTION=200 (default)
        - 100K-1M vectors: M=24, EF_CONSTRUCTION=300
        - 1M-10M vectors: M=32, EF_CONSTRUCTION=400
        - >10M vectors: M=48, EF_CONSTRUCTION=500 (high memory cost)
      tags: ["indexing", "schema", "configuration"]

    - topic: "Hybrid Search with RediSearch"
      content: |
        Redis excels at hybrid search because RediSearch natively supports combining vector
        similarity with traditional filters in a single query.

        A hybrid query can combine:
        - Vector similarity (KNN or range-based)
        - Full-text search (inverted index with BM25 scoring)
        - Numeric range filters
        - Tag/categorical filters
        - Geospatial radius filters

        All filters are applied before or during the vector search, not as a post-filter.
        This is more efficient than systems that first retrieve top-K vectors and then
        filter, which can return fewer than K results.

        Example: Find the 10 most semantically similar products that are in the "electronics"
        category, priced between $50-$200, and within 50km of the user's location -- all
        in a single query returning in <5ms.
      tags: ["hybrid-search", "filtering", "query"]

code_examples:
  - title: "Create Vector Index and Search"
    language: "python"
    code: |
      import redis
      import numpy as np
      from redis.commands.search.field import VectorField, TextField, NumericField
      from redis.commands.search.indexDefinition import IndexDefinition, IndexType
      from redis.commands.search.query import Query

      r = redis.Redis(host="localhost", port=6379)

      # Create index with vector field
      schema = [
          TextField("content"),
          NumericField("year"),
          VectorField("embedding",
              "HNSW", {
                  "TYPE": "FLOAT32",
                  "DIM": 1536,
                  "DISTANCE_METRIC": "COSINE",
                  "M": 16,
                  "EF_CONSTRUCTION": 200,
              }
          ),
      ]

      r.ft("docs_idx").create_index(
          schema,
          definition=IndexDefinition(prefix=["doc:"], index_type=IndexType.HASH)
      )

