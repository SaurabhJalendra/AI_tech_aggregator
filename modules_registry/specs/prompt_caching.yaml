knowledge:
  entries:
    - topic: "Anthropic Prompt Caching"
      content: |
        Anthropic's prompt caching allows explicit control over which parts of the prompt are
        cached. You add cache_control breakpoints to mark the end of cacheable sections.

        The cache works on a prefix basis: everything from the start of the prompt up to a
        cache_control breakpoint can be cached. Up to 4 breakpoints are supported, with a
        minimum of 1024 tokens per cached section.

        Pricing: Cached input tokens cost 10% of the regular input token price (90% savings).
        Writing to the cache costs 125% of the regular price (25% premium). The break-even
        point is approximately 2 cache hits per write - after that, every hit saves money.

        Cache TTL is 5 minutes, extended to 5 minutes from the last hit. For applications
        with steady traffic, the cache effectively persists indefinitely.

        Best practices for Anthropic caching:
        1. Place the most stable content first (system prompt, tool definitions)
        2. Add cache_control after the stable content
        3. Place dynamic content (user query, recent messages) after the cached section
        4. Use the minimum number of breakpoints needed

        Cache hits are reported in the API response via cache_creation_input_tokens and
        cache_read_input_tokens fields, enabling cost tracking.
      tags: ["anthropic", "implementation", "pricing"]

    - topic: "OpenAI Prompt Caching"
      content: |
        OpenAI's prompt caching is automatic and requires no code changes. Any request with
        a prefix of 1024+ tokens that matches a recent request's prefix gets cached automatically.

        Key characteristics:
        - Matching is done on exact token prefixes (not semantic similarity)
        - Minimum prefix length is 1024 tokens
        - Cached tokens receive a 50% discount on input pricing
        - Cache is scoped to the organization level
        - Works with all GPT-4o, o1, and o3 models
        - Compatible with streaming, tool use, and structured outputs

        The cache TTL is typically 5-10 minutes but can extend for frequently accessed prefixes.
        OpenAI reports cached token counts in the usage field of the response.

        Since OpenAI caching is automatic, the optimization strategy is purely about prompt
        structure: put stable content (system prompt, instructions, tool definitions) at the
        start, and dynamic content (user query) at the end. This maximizes the cacheable prefix.

        For multi-turn conversations, include the full conversation history in a consistent
        order. As the conversation grows, the shared prefix (system prompt + earlier messages)
        becomes increasingly cacheable.
      tags: ["openai", "implementation", "automatic"]

    - topic: "Optimization Strategies"
      content: |
        To maximize prompt caching benefits:

        1. Structure prompts with stable content first. System prompts, tool definitions,
        few-shot examples, and context documents should be at the beginning. User-specific
        or dynamic content goes at the end.

        2. Keep the stable prefix identical across requests. Even a single changed token
        invalidates the cache from that point forward. Use consistent formatting, avoid
        timestamps in cached sections, and version your system prompts carefully.

        3. For RAG applications, consider a two-tier approach: cache the system prompt and
        base instructions, then add retrieved context and the user query as the dynamic suffix.

        4. For few-shot learning, include all examples in the cached prefix. Adding or removing
        examples invalidates the cache, so maintain a stable example set.

        5. Monitor cache hit rates using provider usage metrics. Low hit rates indicate that
        the prefix is changing too frequently or that request volume is insufficient to
        maintain cache entries within the TTL window.

        6. For Anthropic, strategically place cache_control breakpoints. The first breakpoint
        should be after the most stable content (system prompt). Additional breakpoints can
        be placed after tool definitions or example sets.
      tags: ["optimization", "best-practices"]

    - topic: "Prompt Caching vs Semantic Caching"
      content: |
        Prompt caching and semantic caching solve different problems and can be used together:

        Prompt caching (this module):
        - Operates at the provider level on exact token prefixes
        - Reduces cost of processing the same prompt prefix
        - The LLM still generates a new response for each request
        - No risk of returning stale or incorrect cached answers
        - Zero configuration (OpenAI) or minimal configuration (Anthropic)

        Semantic caching:
        - Operates at the application level on semantic similarity
        - Returns a previously generated response for similar queries
        - The LLM is not called at all for cache hits
        - Risk of returning stale or contextually inappropriate answers
        - Requires embedding model, vector store, and threshold tuning

        When to use which:
        - Use prompt caching always (it's essentially free optimization)
        - Add semantic caching when many queries are semantically similar and responses are
          stable enough to reuse (FAQ, customer support, educational content)
        - For applications where every response must be freshly generated (creative writing,
          personalized advice), use only prompt caching
      tags: ["comparison", "semantic-caching", "decision"]

code_examples:
  - title: "Anthropic Prompt Caching"
    language: "python"
    code: |
      import anthropic

      client = anthropic.Anthropic()

      # Large system prompt with cache control
      response = client.messages.create(
          model="claude-sonnet-4-20250514",
          max_tokens=1024,
          system=[
              {
                  "type": "text",
                  "text": "You are an expert AI infrastructure advisor. "
                          "You help teams design and build production AI systems. "
                          + long_instructions,  # 2000+ tokens of instructions
                  "cache_control": {"type": "ephemeral"}
              }
          ],
          messages=[
              {"role": "user", "content": "How should I set up vector search?"}
          ]
      )

      # Check cache usage
      print(f"Cache write tokens: {response.usage.cache_creation_input_tokens}")
      print(f"Cache read tokens: {response.usage.cache_read_input_tokens}")

  - title: "Anthropic Caching with Tools"
    language: "python"
    code: |
      import anthropic

      client = anthropic.Anthropic()

      # Cache tool definitions (stable across requests)
      tools = [
          {
              "name": "search_docs",
              "description": "Search technical documentation",
              "input_schema": {
                  "type": "object",
                  "properties": {
                      "query": {"type": "string"},
                      "category": {"type": "string"}
                  },
                  "required": ["query"]
              }
          },
          # ... many more tools
      ]

      response = client.messages.create(
          model="claude-sonnet-4-20250514",
          max_tokens=1024,
          system=[
              {
                  "type": "text",
                  "text": system_prompt,
                  "cache_control": {"type": "ephemeral"}
              }
          ],
          tools=tools,  # Tools are cached as part of the prefix
          messages=[
              {"role": "user", "content": user_query}
          ]
      )

  - title: "OpenAI Automatic Caching Optimization"
    language: "python"
    code: |
      from openai import OpenAI

      client = OpenAI()

      # Structure prompt for maximum cache benefit:
      # 1. Stable system prompt first (cached automatically)
      # 2. Tool definitions (part of cached prefix)
      # 3. Dynamic user content last

      system_prompt = """You are an AI infrastructure advisor.
      You have deep expertise in vector databases, RAG systems,
      LLM deployment, and ML infrastructure.

      Guidelines:
      - Always provide specific, actionable recommendations
      - Include code examples when relevant
      - Consider cost, performance, and scalability trade-offs
      """ + additional_instructions  # 1500+ tokens total

      response = client.chat.completions.create(
          model="gpt-4o",
          messages=[
              {"role": "system", "content": system_prompt},
              {"role": "user", "content": "Compare Pinecone vs Weaviate"}
          ]
      )

      # Check cached token count
      usage = response.usage
      print(f"Total tokens: {usage.prompt_tokens}")
      if hasattr(usage, "prompt_tokens_details"):
          print(f"Cached tokens: {usage.prompt_tokens_details.cached_tokens}")

