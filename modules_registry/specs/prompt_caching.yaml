identity:
  tagline: "Provider-level prompt prefix caching from Anthropic and OpenAI to reduce cost and latency"
  description: |
    Prompt caching is a feature offered by LLM providers (notably Anthropic and OpenAI) that
    caches the processed representation of prompt prefixes on the provider's infrastructure.
    When subsequent requests share the same prefix (system prompt, few-shot examples, or
    large context documents), the provider can skip reprocessing the cached portion, resulting
    in reduced latency and lower costs.

    Anthropic's prompt caching (available for Claude models) allows developers to mark specific
    portions of the prompt with cache_control breakpoints. Cached prefixes are stored for
    5 minutes (extended on each cache hit) and reduce input token costs by up to 90% for
    the cached portion. There is a small write cost when first caching a prompt.

    OpenAI's prompt caching automatically caches prompt prefixes for GPT-4o and newer models.
    It requires no explicit configuration - any request sharing a prefix of 1024+ tokens with
    a recent request automatically benefits from caching with a 50% discount on cached tokens.

    Unlike semantic caching, prompt caching operates at the provider level on exact token
    prefixes, not semantic similarity. It is most effective for applications that reuse large
    system prompts, tool definitions, or context documents across many requests.
  logo_url: "/assets/modules/prompt_caching.svg"
  website: "https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching"
  documentation: "https://platform.openai.com/docs/guides/prompt-caching"
