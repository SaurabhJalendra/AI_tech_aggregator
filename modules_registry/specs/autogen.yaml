identity:
  tagline: "Microsoft's open-source framework for building multi-agent conversational AI systems"
  description: |
    AutoGen is an open-source framework from Microsoft Research for building multi-agent systems
    where AI agents converse with each other, use tools, and collaborate with humans to solve
    complex tasks. It pioneered the concept of conversable agents — agents that can send and
    receive messages in flexible conversation patterns.

    AutoGen 0.4 (the current generation, also called AG2 by the community fork) introduced a
    complete architectural rewrite with an event-driven, actor-based model. The new architecture
    features asynchronous messaging, pluggable runtimes (local and distributed), and a layered
    API: Core (message passing primitives), AgentChat (high-level multi-agent conversations),
    and Extensions (tool integrations and model clients).

    Key strengths include native code execution capabilities (Docker-sandboxed or local),
    flexible conversation patterns (two-agent, group chat, nested, sequential), and strong
    support for human-in-the-loop workflows. AutoGen is particularly well-suited for
    code-generation tasks, data analysis workflows, and research applications where agents
    need to write and execute code iteratively.

    AutoGen Studio provides a visual interface for building, testing, and debugging multi-agent
    workflows without writing code, making the framework accessible to non-developers.
