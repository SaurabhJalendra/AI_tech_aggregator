identity:
  tagline: "Meta's open-weight LLM family enabling self-hosted, customizable AI deployments"
  description: |
    Meta's Llama is the most widely adopted open-weight large language model family,
    with Llama 3.1 and Llama 3.2 models spanning from 1B to 405B parameters. Llama
    models are released under the Llama Community License, which permits commercial
    use, fine-tuning, and redistribution, making them the foundation of choice for
    organizations that need full control over their AI infrastructure.

    Llama 3.1 405B represents the open-source frontier, performing competitively
    with GPT-4o and Claude Sonnet on many benchmarks. Llama 3.1 70B offers an
    excellent balance of capability and deployability on standard GPU hardware.
    Llama 3.2 extends the family with smaller models (1B, 3B) optimized for
    edge and mobile deployment, plus multimodal variants (11B, 90B) that process
    both text and images.

    The open-weight nature of Llama enables architectural freedom impossible with
    proprietary models: full fine-tuning, quantization to any precision, custom
    serving infrastructure, on-premises deployment for air-gapped environments,
    and merging with other models. This flexibility comes with the operational
    burden of self-hosting, including GPU procurement, model serving, scaling,
    and monitoring.

    Llama models are served through platforms like vLLM, TGI, Ollama, and major
    cloud providers (AWS Bedrock, Azure AI, Google Vertex AI) for teams that want
    Llama's capabilities without managing infrastructure directly.
