knowledge:
  entries:
    - topic: "Choosing a Llama Model Size"
      content: |
        Selecting the right Llama model size involves balancing capability, hardware
        requirements, and cost:

        405B: The open-source frontier. Choose when you need GPT-4-class reasoning
        but must self-host for compliance or cost reasons. Requires significant GPU
        infrastructure (8x H100 or equivalent). Consider quantization to FP8 to
        halve GPU requirements with minimal quality loss.

        70B: The sweet spot for most production deployments. Outperforms GPT-3.5 and
        many proprietary models on reasoning, coding, and analysis tasks. Deployable
        on 2x A100 80GB at FP16, or a single A100 80GB with INT4 quantization.
        Fine-tuned 70B models often match or exceed base 405B on specific tasks.

        8B: Ideal for fine-tuning experiments, development, and tasks where a
        specialized model outperforms a general large model. Runs on a single
        consumer GPU with quantization. Many production fine-tunes start here.

        3B/1B: Edge and mobile deployment. Good for classification, entity extraction,
        and simple generation on resource-constrained devices. The 3B model can run
        on smartphones and Raspberry Pi with quantization.

        Rule of thumb: Start with the smallest model that meets quality requirements
        on your specific task. A fine-tuned 8B model often outperforms base 70B on
        narrow, well-defined tasks.
      tags: ["model-selection", "hardware", "architecture"]

    - topic: "Production Serving with vLLM"
      content: |
        vLLM is the recommended serving engine for production Llama deployments. It
        provides continuous batching, PagedAttention for efficient memory management,
        and OpenAI-compatible API endpoints.

        Key configuration decisions for vLLM + Llama:

        Tensor parallelism: Set --tensor-parallel-size to match GPU count. For 70B
        on 2x A100, use TP=2. For 405B on 8x H100, use TP=8.

        Quantization: Use --quantization awq or gptq for INT4 quantization. FP8
        quantization (--quantization fp8) on H100s provides near-lossless quality
        with 2x throughput improvement.

        Max model length: Set --max-model-len based on your use case. Full 128K
        context requires substantial KV cache memory. For most applications, 8K-16K
        is sufficient and dramatically reduces memory footprint.

        KV cache dtype: Use --kv-cache-dtype fp8 on Ampere+ GPUs to halve KV cache
        memory with negligible quality impact.

        Throughput optimization: Enable chunked prefill (--enable-chunked-prefill)
        and tune --max-num-batched-tokens based on your latency vs throughput
        requirements.
      tags: ["serving", "vllm", "production", "optimization"]

    - topic: "Fine-Tuning Llama Models"
      content: |
        Llama's open weights enable full fine-tuning, a major advantage over
        proprietary models. Common approaches:

        Full fine-tuning: Updates all model parameters. Requires GPU memory for
        the full model plus optimizer states (roughly 3x model size). For 70B,
        this means 8+ A100 80GB GPUs. Provides the highest quality customization
        but is expensive and risks catastrophic forgetting.

        LoRA/QLoRA: Parameter-efficient fine-tuning that updates small adapter
        layers while freezing the base model. QLoRA combines 4-bit quantization
        with LoRA, enabling fine-tuning of 70B on a single A100 80GB. Quality
        is typically 90-95% of full fine-tuning at a fraction of the cost.

        Training data requirements: Quality matters more than quantity. 1000-5000
        high-quality examples are often sufficient for task-specific fine-tuning.
        Include diverse examples covering edge cases and failure modes.

        Recommended tools: Axolotl for easy configuration-driven training, Hugging
        Face TRL for RLHF/DPO alignment, and torchtune for Meta's official
        fine-tuning recipes.

        Evaluation: Always hold out a test set. Measure task-specific metrics, not
        just loss. Compare against the base model and a few-shot prompted version
        to validate that fine-tuning provides genuine improvement.
      tags: ["fine-tuning", "lora", "qlora", "training"]

    - topic: "Quantization Strategies"
      content: |
        Quantization reduces model precision to lower GPU memory requirements and
        increase throughput, with varying quality tradeoffs:

        FP8 (8-bit floating point): Available on H100 and newer GPUs. Reduces memory
        by ~50% with typically <1% quality degradation. The best option when hardware
        supports it. Supported natively by vLLM and TensorRT-LLM.

        INT8 (8-bit integer): Broader hardware support than FP8. Similar memory
        reduction. Slight quality degradation on reasoning-heavy tasks. Use
        bitsandbytes for easy INT8 inference.

        INT4 (GPTQ/AWQ): Reduces memory by ~75%. Enables 70B on a single A100 80GB
        or consumer GPUs. Quality degradation is noticeable on complex reasoning but
        acceptable for many production tasks. AWQ generally provides better quality
        than GPTQ at the same bit width.

        GGUF (llama.cpp format): Optimized for CPU and mixed CPU/GPU inference.
        Supports various quantization levels (Q4_K_M, Q5_K_M, Q6_K, Q8_0). Ideal
        for local development and edge deployment where GPU availability is limited.

        Recommendation: Use FP8 on H100s for production. Use AWQ INT4 when GPU
        memory is constrained. Use GGUF for local development with Ollama.
      tags: ["quantization", "optimization", "hardware"]

    - topic: "Llama vs Proprietary Models: Decision Framework"
      content: |
        Choosing between Llama and proprietary models (GPT-4, Claude, Gemini)
        depends on several factors:

        Choose Llama when: (1) Data privacy requires complete isolation -- no data
        can leave your infrastructure, (2) Cost at scale is a primary concern and you
        have GPU infrastructure, (3) You need deep customization through fine-tuning
        or model modification, (4) Regulatory requirements mandate on-premises
        deployment, (5) You need to control the full inference stack for latency
        optimization.

        Choose proprietary APIs when: (1) Time-to-market matters more than per-token
        cost, (2) You lack MLOps expertise for production model serving, (3) You need
        frontier reasoning quality (405B is strong but GPT-4o and Claude Opus still
        lead on the hardest tasks), (4) Your usage volume doesn't justify dedicated
        GPU infrastructure, (5) You need capabilities like extended thinking or
        computer use not available in open models.

        Hybrid approach: Many production systems use Llama for high-volume, simpler
        tasks (classification, extraction, routing) and proprietary APIs for complex
        reasoning. This optimizes cost while maintaining quality where it matters.
      tags: ["decision", "comparison", "architecture"]

code_examples:
  - title: "Serving Llama with vLLM"
    language: "python"
    code: |
      # Start vLLM server
      # vllm serve meta-llama/Llama-3.1-70B-Instruct \
      #   --tensor-parallel-size 2 \
      #   --quantization awq \
      #   --max-model-len 16384

      # Use with OpenAI-compatible client
      from openai import OpenAI

      client = OpenAI(
          base_url="http://localhost:8000/v1",
          api_key="not-needed"
      )

      response = client.chat.completions.create(
          model="meta-llama/Llama-3.1-70B-Instruct",
          messages=[
              {"role": "system", "content": "You are a helpful assistant."},
              {"role": "user", "content": "Explain the CAP theorem."}
          ],
          max_tokens=2048,
          temperature=0.7
      )
      print(response.choices[0].message.content)

  - title: "Fine-Tuning with QLoRA"
    language: "python"
    code: |
      from transformers import AutoModelForCausalLM, AutoTokenizer
      from peft import LoraConfig, get_peft_model, prepare_model_for_kbit_training
      from transformers import BitsAndBytesConfig, TrainingArguments
      from trl import SFTTrainer
      import torch

      # Load model with 4-bit quantization
      bnb_config = BitsAndBytesConfig(
          load_in_4bit=True,
          bnb_4bit_quant_type="nf4",
          bnb_4bit_compute_dtype=torch.bfloat16,
      )

      model = AutoModelForCausalLM.from_pretrained(
          "meta-llama/Llama-3.1-8B-Instruct",
          quantization_config=bnb_config,
          device_map="auto"
      )
      model = prepare_model_for_kbit_training(model)

      # Configure LoRA
      lora_config = LoraConfig(
          r=16, lora_alpha=32,
          target_modules=["q_proj", "v_proj", "k_proj", "o_proj"],
          lora_dropout=0.05,
          task_type="CAUSAL_LM"
      )
      model = get_peft_model(model, lora_config)

      # Train
      trainer = SFTTrainer(
          model=model,
          train_dataset=dataset,
          args=TrainingArguments(
              output_dir="./llama-finetuned",
              num_train_epochs=3,
              per_device_train_batch_size=4,
              learning_rate=2e-4,
          ),
      )
      trainer.train()

  - title: "Local Development with Ollama"
    language: "bash"
    code: |
      # Pull and run Llama locally
      ollama pull llama3.1:8b

      # Interactive chat
      ollama run llama3.1:8b

      # Use via API (OpenAI-compatible)
      curl http://localhost:11434/v1/chat/completions \
        -H "Content-Type: application/json" \
        -d '{
          "model": "llama3.1:8b",
          "messages": [{"role": "user", "content": "Hello!"}]
        }'

