knowledge:
  entries:
    - topic: "How Reranking Works"
      content: |
        Reranking models operate as a second stage in a two-stage retrieval pipeline. The first
        stage (retrieval) uses a fast method like vector similarity search or BM25 to identify
        a broad set of candidates, typically 20-100 documents. The second stage (reranking)
        applies a more computationally expensive model to re-score and re-order these candidates.

        Cross-encoder rerankers concatenate the query and document into a single input sequence
        and process them through a transformer model jointly. This allows attention layers to
        capture fine-grained interactions between query and document tokens, producing more
        accurate relevance scores than bi-encoders that encode them independently.

        The trade-off is computational cost: a bi-encoder computes one embedding per document
        (amortized), while a cross-encoder must process every query-document pair at query time.
        This is why rerankers are applied only to a small candidate set rather than the full corpus.

        Late-interaction models like ColBERT offer a middle ground, pre-computing per-token
        document embeddings and performing lightweight interaction at query time. This can be
        faster than full cross-encoders while retaining much of the ranking quality.
      tags: ["architecture", "cross-encoder", "two-stage"]

    - topic: "Choosing a Reranking Model"
      content: |
        The choice of reranking model depends on latency requirements, deployment constraints,
        and accuracy needs:

        For API-based simplicity, Cohere Rerank v3.5 offers state-of-the-art accuracy with
        minimal integration effort. It supports up to 1000 documents per call and handles
        multilingual content well. Cost is per-search (approximately $1 per 1000 searches).

        For self-hosted deployments, BGE Reranker v2 (bge-reranker-v2-m3) provides excellent
        multilingual quality with a manageable 568M parameter size. It supports up to 8192
        tokens per document, making it suitable for longer documents.

        For latency-sensitive applications, smaller models like cross-encoder/ms-marco-MiniLM-L-12-v2
        (33M parameters) offer fast inference with reasonable quality. They can run on CPU for
        moderate throughput requirements.

        For maximum accuracy on English content, larger models like BGE Reranker Large or
        Cohere Rerank tend to top the MTEB/BEIR leaderboards.

        Fine-tuning on domain-specific data can significantly improve reranking quality for
        specialized domains like legal, medical, or scientific literature.
      tags: ["decision", "model-selection"]

    - topic: "Integration Patterns"
      content: |
        The most common integration pattern is to add reranking as a post-processing step
        after initial retrieval. In LangChain, this is done via the ContextualCompressionRetriever
        with a reranking compressor. In LlamaIndex, the SentenceTransformerRerank or
        CohereRerank node postprocessors serve this purpose.

        A typical pipeline looks like:
        1. User query arrives
        2. First-stage retriever fetches top-50 candidates via vector similarity
        3. Reranker scores all 50 query-document pairs
        4. Top-5 reranked documents are passed to the LLM as context
        5. LLM generates the final answer

        This two-stage approach typically improves answer quality by 10-30% on retrieval
        benchmarks compared to using only the first-stage retriever, with modest latency
        overhead (typically 100-300ms for 50 documents).

        For production systems, consider caching reranker scores for frequently asked queries
        and implementing timeouts to gracefully degrade to first-stage results if the reranker
        is slow.
      tags: ["integration", "pipeline", "best-practices"]

    - topic: "Limitations and Considerations"
      content: |
        Key limitations to consider when implementing reranking:

        1. Latency overhead. Cross-encoder reranking adds 50-500ms depending on the model
        size and candidate set. For real-time applications, this may require careful optimization.

        2. Token length limits. Most rerankers truncate documents beyond their max length
        (512-8192 tokens). For long documents, consider chunking before reranking or using
        models with longer context windows.

        3. Cost at scale. API-based rerankers charge per search. For high-traffic applications,
        self-hosted models may be more cost-effective.

        4. Candidate set size matters. Reranking cannot surface documents that were not in the
        initial candidate set. If the first-stage retriever misses a relevant document, reranking
        cannot recover it. Ensure adequate first-stage recall (top-50 to top-100).

        5. Not a silver bullet. If the embedding model and first-stage retriever are well-tuned
        for the domain, reranking may provide diminishing returns. Always measure the improvement
        on your specific use case.
      tags: ["limitations", "trade-offs"]

code_examples:
  - title: "Cohere Rerank with LangChain"
    language: "python"
    code: |
      from langchain.retrievers import ContextualCompressionRetriever
      from langchain_cohere import CohereRerank
      from langchain_pinecone import PineconeVectorStore

      # First-stage retriever
      vectorstore = PineconeVectorStore(
          index_name="my-index",
          embedding=embeddings
      )
      base_retriever = vectorstore.as_retriever(search_kwargs={"k": 50})

      # Add reranking
      reranker = CohereRerank(
          model="rerank-v3.5",
          top_n=5
      )
      retriever = ContextualCompressionRetriever(
          base_compressor=reranker,
          base_retriever=base_retriever
      )

      # Use in RAG chain
      docs = retriever.invoke("What is the best vector database?")

  - title: "BGE Reranker with sentence-transformers"
    language: "python"
    code: |
      from sentence_transformers import CrossEncoder

      # Load reranker model
      reranker = CrossEncoder("BAAI/bge-reranker-v2-m3", max_length=8192)

      # Score query-document pairs
      query = "How does vector search work?"
      documents = [
          "Vector search uses embeddings to find similar items...",
          "SQL databases use B-tree indexes for lookups...",
          "Approximate nearest neighbor algorithms like HNSW..."
      ]

      # Get relevance scores
      pairs = [[query, doc] for doc in documents]
      scores = reranker.predict(pairs)

      # Sort by relevance
      ranked = sorted(
          zip(documents, scores),
          key=lambda x: x[1],
          reverse=True
      )

  - title: "LlamaIndex Reranking Pipeline"
    language: "python"
    code: |
      from llama_index.core import VectorStoreIndex
      from llama_index.postprocessor.cohere_rerank import CohereRerank

      # Build index and query engine with reranking
      index = VectorStoreIndex.from_documents(documents)

      reranker = CohereRerank(
          model="rerank-v3.5",
          top_n=5,
          api_key="your-cohere-key"
      )

      query_engine = index.as_query_engine(
          similarity_top_k=50,
          node_postprocessors=[reranker]
      )

      response = query_engine.query("Explain RAG architectures")

