identity:
  tagline: "Cross-encoder and late-interaction models for re-scoring retrieved documents"
  description: |
    Reranking models are a critical second-stage retrieval component that re-scores an initial
    set of candidate documents to improve ranking quality. Unlike bi-encoder embedding models
    that encode queries and documents independently, cross-encoder rerankers process the query
    and document together, enabling richer interaction signals that capture nuanced relevance.

    Leading reranking models include Cohere Rerank, BGE Reranker (from BAAI), Jina Reranker,
    and cross-encoder models from the sentence-transformers library. These models typically
    take a query-document pair as input and output a relevance score, allowing the retrieval
    pipeline to re-order candidates for higher precision in the final top-k results.

    Reranking is especially valuable in RAG pipelines where the initial retrieval (via vector
    similarity or BM25) returns a broad set of candidates. By applying a more computationally
    expensive but more accurate reranker on a smaller candidate set (e.g., top-50 to top-100),
    systems achieve significantly better end-to-end answer quality without the cost of running
    cross-encoders on the entire corpus.
  logo_url: "/assets/modules/reranking_models.svg"
  website: "https://docs.cohere.com/docs/reranking"
  documentation: "https://docs.cohere.com/reference/rerank"
  github: "https://github.com/FlagOpen/FlagEmbedding"
  license: "Various"
  pricing_model: "freemium"

