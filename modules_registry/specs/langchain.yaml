identity:
  tagline: "The leading open-source framework for building applications powered by large language models"
  description: |
    LangChain is an open-source framework for developing applications that combine large language
    models with external data sources, tools, and APIs. It provides a composable set of abstractions
    for chains, agents, retrieval, memory, and callbacks that simplify the development of complex
    LLM-powered workflows.

    Originally launched in late 2022 as a Python library, LangChain has evolved into a comprehensive
    ecosystem including LangChain Core (the base abstractions and LCEL), LangChain Community
    (third-party integrations), LangGraph (stateful multi-actor agent orchestration), LangSmith
    (observability and evaluation platform), and LangServe (deployment utilities).

    LangChain Expression Language (LCEL) is the primary composition interface, allowing developers
    to build chains by piping components together with the | operator. LCEL supports streaming,
    async execution, batching, and fallbacks out of the box. LangGraph extends this model for
    cyclic, stateful agent workflows with persistence and human-in-the-loop capabilities.

    The framework has the largest ecosystem of integrations in the LLM tooling space, with native
    connectors for virtually every LLM provider, vector database, embedding model, and document
    loader. This breadth makes it the default starting point for many teams, though the rapid
    pace of API changes and abstraction complexity are common criticisms.
  logo_url: "/assets/modules/langchain.svg"
  website: "https://www.langchain.com"
  documentation: "https://python.langchain.com/docs/"
  github: "https://github.com/langchain-ai/langchain"
  license: "MIT"
