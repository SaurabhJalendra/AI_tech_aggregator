comparison_dimensions:
  performance:
    score: 6
    justification: "Adds abstraction overhead compared to direct API calls. LCEL streaming mitigates latency for user-facing apps, but deep chain nesting can impact throughput."
  scalability:
    score: 7
    justification: "Async support and LangServe enable production scaling. LangGraph adds persistent state for long-running workflows. No built-in distributed execution."
  ease_of_use:
    score: 7
    justification: "LCEL provides an elegant composition model but has a steep learning curve. Extensive documentation and examples offset complexity. Frequent API changes frustrate developers."
  cost_efficiency:
    score: 9
    justification: "Fully open-source core. LangSmith is the only paid component (optional). No per-call framework costs beyond the underlying LLM and infrastructure."
  community:
    score: 10
    justification: "Largest community in the LLM tooling space with 95K+ GitHub stars, thousands of contributors, and the most third-party integrations of any framework."
  maturity:
    score: 7
    justification: "Production-used by thousands of companies since 2023. API has stabilized significantly with the LCEL and v0.2+ releases, but breaking changes still occur."
  flexibility:
    score: 9
    justification: "Supports virtually every LLM provider, vector store, and tool. LCEL and LangGraph enable arbitrary workflow topologies from simple chains to complex multi-agent systems."
  data_privacy:
    score: 8
    justification: "Fully self-hostable. No data sent to LangChain servers unless LangSmith tracing is explicitly enabled. Supports local LLMs via Ollama and HuggingFace."

knowledge:
  entries:
    - topic: "LCEL (LangChain Expression Language)"
      content: |
        LCEL is the primary interface for composing LangChain components. It uses Python's pipe
        operator (|) to chain together runnables — any component that implements the Runnable
        interface (invoke, stream, batch, ainvoke, astream, abatch).

        A typical LCEL chain looks like: prompt | llm | output_parser. Each component transforms
        the input and passes the result to the next. LCEL automatically handles:
        - Streaming: tokens flow through the entire chain as they're generated
        - Async: every chain is automatically async-compatible
        - Batching: process multiple inputs in parallel
        - Fallbacks: retry with alternative models on failure
        - Tracing: automatic LangSmith integration for observability

        LCEL replaced the legacy Chain classes (LLMChain, SequentialChain, etc.) which are now
        deprecated. The key advantage is composability — any Runnable can be used anywhere in
        a chain, including nested chains, branching (RunnableParallel), and conditional routing
        (RunnableBranch).

        For complex workflows requiring cycles, state persistence, or human-in-the-loop,
        LangGraph extends LCEL with a graph-based execution model.
      tags: ["lcel", "core", "composition"]

    - topic: "LangGraph for Stateful Agents"
      content: |
        LangGraph is LangChain's library for building stateful, multi-actor agent applications.
        Unlike LCEL chains which are directed acyclic graphs (DAGs), LangGraph supports cycles,
        enabling agents that can loop, reflect, and iterate.

        Core concepts: (1) StateGraph defines the agent's state schema and transitions.
        (2) Nodes are functions that read and write state. (3) Edges define transitions between
        nodes, including conditional edges for routing. (4) Checkpointing enables persistence,
        allowing agents to be paused, resumed, and replayed.

        LangGraph is the recommended approach for building agents that need: multi-step tool
        use with reflection, human-in-the-loop approval gates, persistent conversation memory
        across sessions, parallel execution of sub-agents, or error recovery with retry logic.

        LangGraph Platform (cloud-hosted) adds deployment, scaling, and a studio UI for
        debugging agent execution. The open-source library works standalone without the platform.
      tags: ["langgraph", "agents", "stateful"]

    - topic: "When to Choose LangChain"
      content: |
        LangChain is the right choice when: (1) You need rapid prototyping of LLM applications
        with many integrations. The breadth of connectors lets you swap providers without
        rewriting code. (2) Your application involves standard RAG patterns. LangChain has the
        most mature retrieval abstractions. (3) You need multi-agent workflows and are willing
        to use LangGraph. (4) Observability is important — LangSmith provides production-grade
        tracing. (5) Your team values community support and documentation.

        LangChain is NOT the right choice when: (1) You need minimal overhead and full control —
        direct SDK calls to LLM providers are simpler for basic use cases. (2) API stability is
        critical — LangChain's pace of change can break production code. (3) You're building a
        simple chatbot without tools or retrieval — the framework adds unnecessary complexity.
        (4) You need a strongly-typed, compile-time-safe framework — consider Semantic Kernel
        or Haystack for more structured approaches.
      tags: ["decision", "comparison"]

    - topic: "RAG Implementation Patterns"
      content: |
        LangChain supports multiple RAG architectures:

        Basic RAG: Document loader -> text splitter -> embedding model -> vector store -> retriever
        -> prompt + LLM. This is the simplest pattern, suitable for most question-answering tasks.

        Conversational RAG: Adds chat history and question condensation. The retriever receives
        a standalone question derived from the conversation context, not the raw follow-up.

        Agentic RAG: The retriever is wrapped as a tool that an agent can invoke selectively.
        The agent decides when to retrieve, what to query, and whether to refine the search.

        Multi-index RAG: Routes queries to different vector stores based on intent classification.
        Useful when knowledge spans multiple domains with different embedding strategies.

        Self-corrective RAG: Uses LangGraph to evaluate retrieval quality and retry with refined
        queries if the initial results are insufficient. Includes hallucination detection.

        Parent Document Retrieval: Stores small chunks for precise retrieval but returns the
        full parent document for context. Balances retrieval precision with generation quality.
      tags: ["rag", "retrieval", "patterns"]

    - topic: "Migration from Legacy Chains to LCEL"
      content: |
        Legacy LangChain patterns (LLMChain, SequentialChain, ConversationalRetrievalChain)
        are deprecated as of langchain v0.2. All new development should use LCEL or LangGraph.

        Key migration patterns:
        - LLMChain -> prompt | llm | StrOutputParser()
        - SequentialChain -> chain1 | chain2 | chain3 (pipe operator)
        - ConversationalRetrievalChain -> create_history_aware_retriever + create_retrieval_chain
        - AgentExecutor -> LangGraph with ToolNode
        - ConversationBufferMemory -> RunnableWithMessageHistory or LangGraph state

        The main benefits of migrating: streaming works end-to-end, async is automatic,
        error handling is more predictable, and LangSmith tracing is automatic without
        explicit callback configuration.
      tags: ["migration", "legacy", "upgrade"]

code_examples:
  - title: "Basic LCEL Chain"
    language: "python"
    code: |
      from langchain_core.prompts import ChatPromptTemplate
      from langchain_core.output_parsers import StrOutputParser
      from langchain_openai import ChatOpenAI

      prompt = ChatPromptTemplate.from_messages([
          ("system", "You are a helpful assistant specialized in {domain}."),
          ("human", "{question}")
      ])

      llm = ChatOpenAI(model="gpt-4o")
      chain = prompt | llm | StrOutputParser()

      # Invoke
      result = chain.invoke({"domain": "AI infrastructure", "question": "What is RAG?"})

      # Stream
      for chunk in chain.stream({"domain": "AI infrastructure", "question": "What is RAG?"}):
          print(chunk, end="", flush=True)

  - title: "RAG Pipeline with Retrieval"
    language: "python"
    code: |
      from langchain_openai import OpenAIEmbeddings, ChatOpenAI
      from langchain_pinecone import PineconeVectorStore
      from langchain_core.prompts import ChatPromptTemplate
      from langchain_core.runnables import RunnablePassthrough
      from langchain_core.output_parsers import StrOutputParser

      # Setup retriever
      embeddings = OpenAIEmbeddings(model="text-embedding-3-small")
      vectorstore = PineconeVectorStore(index_name="docs", embedding=embeddings)
      retriever = vectorstore.as_retriever(search_kwargs={"k": 5})

      # Build RAG chain
      prompt = ChatPromptTemplate.from_template(
          "Answer based on context:\n{context}\n\nQuestion: {question}"
      )

      chain = (
          {"context": retriever, "question": RunnablePassthrough()}
          | prompt
          | ChatOpenAI(model="gpt-4o")
          | StrOutputParser()
      )

      answer = chain.invoke("How does vector indexing work?")

  - title: "LangGraph Agent with Tools"
    language: "python"
    code: |
      from langgraph.prebuilt import create_react_agent
      from langchain_openai import ChatOpenAI
      from langchain_core.tools import tool

      @tool
      def search_docs(query: str) -> str:
          """Search the knowledge base for relevant documents."""
          # Your retrieval logic here
          return "Found relevant documents about: " + query

      @tool
      def calculate(expression: str) -> str:
          """Evaluate a mathematical expression."""
          return str(eval(expression))

      llm = ChatOpenAI(model="gpt-4o")
      agent = create_react_agent(llm, [search_docs, calculate])

      # Run the agent
      result = agent.invoke({
          "messages": [("human", "What is the cost of 1M vectors at $0.33/month for 12 months?")]
      })

