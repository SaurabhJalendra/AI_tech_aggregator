identity:
  tagline: "Comprehensive text splitting library for chunking documents in RAG pipelines"
  description: |
    LangChain Text Splitters is a library of document chunking strategies provided as part of
    the LangChain ecosystem. It offers multiple splitting approaches including character-based,
    token-based, recursive, semantic, and code-aware splitting, all with configurable chunk
    sizes and overlap.

    The library's most popular splitter, RecursiveCharacterTextSplitter, uses a hierarchy of
    separators (paragraphs, sentences, words) to find natural break points in text. This
    produces more coherent chunks than naive fixed-size splitting, improving downstream
    retrieval quality.

    LangChain Text Splitters is the most widely used chunking library in the Python AI
    ecosystem, with direct integration into LangChain's document loading and vector store
    pipelines. It is available as the standalone langchain-text-splitters package.
  logo_url: "/assets/modules/langchain_text_splitters.svg"
  website: "https://python.langchain.com"
  documentation: "https://python.langchain.com/docs/concepts/text_splitters/"
  github: "https://github.com/langchain-ai/langchain/tree/master/libs/text-splitters"
  license: "MIT"
  pricing_model: "open_source"

