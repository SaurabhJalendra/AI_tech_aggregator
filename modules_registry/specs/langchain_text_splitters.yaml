      description: "Splits recursively using a hierarchy of separators"
      default_chunk_size: 1000
      default_overlap: 200
    - name: "CharacterTextSplitter"
      description: "Splits on a single separator character"
      default_chunk_size: 1000
      default_overlap: 200
    - name: "TokenTextSplitter"
      description: "Splits based on token count using tiktoken"
