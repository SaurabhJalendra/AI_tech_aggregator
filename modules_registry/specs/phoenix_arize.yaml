identity:
  tagline: "Open-source AI observability platform for LLM tracing, evaluation, and debugging"
  description: |
    Phoenix is an open-source AI observability platform developed by Arize AI. It provides
    real-time tracing, evaluation, and debugging capabilities for LLM applications, RAG
    pipelines, and agent systems. Phoenix captures detailed traces of LLM calls, retrieval
    steps, and tool invocations, allowing developers to understand exactly how their AI
    applications behave in production.

    Phoenix supports OpenTelemetry-based instrumentation, making it compatible with any
    LLM framework including LangChain, LlamaIndex, OpenAI, and Anthropic. Traces capture
    input/output pairs, latency, token usage, and custom metadata at every step of a pipeline.

    Beyond tracing, Phoenix provides built-in evaluation capabilities using LLM-as-judge
    patterns for measuring relevance, hallucination, toxicity, and custom metrics. It also
    includes embedding visualization for understanding retrieval quality, dataset management
    for experimentation, and prompt versioning.

    Phoenix can run locally as a notebook-friendly tool for development or be deployed as
    a persistent server for production monitoring.
  logo_url: "/assets/modules/phoenix_arize.svg"
  website: "https://phoenix.arize.com"
  documentation: "https://docs.arize.com/phoenix"
  github: "https://github.com/Arize-ai/phoenix"
