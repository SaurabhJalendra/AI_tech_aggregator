knowledge:
  entries:
    - topic: "Architecture Overview"
      content: |
        Weaviate is written in Go and uses a custom HNSW (Hierarchical Navigable Small World)
        index for approximate nearest neighbor search. Unlike libraries like FAISS, Weaviate's
        HNSW implementation is designed for a database context: it supports CRUD operations,
        meaning vectors can be added, updated, and deleted without rebuilding the entire index.

        Data is organized into classes (collections), each with a defined schema of properties.
        Each object in a class has a vector and optional properties (metadata). Classes can
        have cross-references to objects in other classes, enabling graph-like relationships.

        The modular architecture allows plugging in different vectorization, generative, and
        reranking modules. For example, the text2vec-openai module sends text to OpenAI's
        embedding API at ingestion time, while text2vec-transformers runs a local transformer
        model in a sidecar container.

        Sharding distributes data across nodes in a cluster. Replication creates copies of
        shards for fault tolerance and read throughput. Multi-tenancy isolates tenant data
        at the class level, supporting thousands of tenants per cluster.
      tags: ["architecture", "internals"]

    - topic: "When to Choose Weaviate"
      content: |
        Weaviate is the right choice when:

        1. You want built-in vectorization. Weaviate can generate embeddings automatically
        using configured modules, eliminating the need for a separate embedding service.

        2. You need hybrid search combining vector similarity with keyword (BM25) search
        in a single query with fusion algorithms to blend results.

        3. You want multi-modal search. Weaviate supports text, image, and other modalities
        through its module system (e.g., multi2vec-clip for image+text search).

        4. You need a self-hosted solution with strong data privacy controls and the ability
        to run air-gapped with local models.

        5. You want a schema-aware database with typed properties, cross-references, and
        aggregate queries, not just a flat vector store.

        Weaviate is NOT the right choice when: you need the simplest possible API with zero
        setup (consider ChromaDB), you need maximum raw query throughput and want a Rust-based
        engine (consider Qdrant), or you want a fully managed service with zero ops (consider
        Pinecone, though Weaviate Cloud Services is an option).
      tags: ["decision", "comparison"]

    - topic: "Built-in Vectorization Modules"
      content: |
        Weaviate's killer feature is its modular vectorizer system. Instead of generating
        embeddings externally and uploading them, you configure a vectorizer module on a
        class, and Weaviate handles embedding generation automatically.

        Available vectorizer modules include:
        - text2vec-openai: Uses OpenAI's embedding API
        - text2vec-cohere: Uses Cohere's embedding API
        - text2vec-huggingface: Uses Hugging Face Inference API
        - text2vec-transformers: Runs a local transformer model in a sidecar container
        - multi2vec-clip: Supports multi-modal (text + image) vectorization
        - text2vec-contextionary: Weaviate's built-in contextual dictionary model

        With a vectorizer configured, you can perform nearText searches using natural language
        queries without ever handling raw vectors. The vectorizer generates the query embedding
        on the fly.

        You can also bring your own vectors by setting the vectorizer to "none" and providing
        vectors directly, giving full flexibility.
      tags: ["vectorization", "modules", "features"]

    - topic: "Hybrid Search Implementation"
      content: |
        Weaviate's hybrid search combines BM25 keyword search with vector similarity search,
        producing a fused ranking using either Ranked Fusion or Relative Score Fusion.

        In a hybrid query, Weaviate runs both a BM25 search and a vector search in parallel,
        then merges the results. The alpha parameter controls the balance: 0 = pure keyword,
        1 = pure vector, 0.5 = equal weight.

        This is especially useful for RAG applications where queries might contain specific
        terms (product names, error codes, technical jargon) that benefit from exact matching,
        combined with the semantic understanding of vector search.

        Unlike Pinecone's hybrid search which requires you to generate sparse vectors externally,
        Weaviate handles BM25 scoring internally using its inverted index, making hybrid
        search simpler to implement.
      tags: ["hybrid-search", "bm25", "features"]

    - topic: "Multi-tenancy Architecture"
      content: |
        Weaviate supports native multi-tenancy, where each tenant's data is stored in a
        separate shard within a class. This provides data isolation without the overhead
        of creating separate classes or clusters per tenant.

        Tenants can be individually activated or deactivated. Inactive tenants' data is
        offloaded to cold storage, reducing memory and compute usage. This makes it feasible
        to support thousands of tenants on a single cluster, with only active tenants
        consuming resources.

        Each tenant has its own HNSW index, ensuring that one tenant's data size doesn't
        affect another tenant's query performance. Queries are automatically scoped to
        the specified tenant.

        This architecture is ideal for SaaS applications where each customer's knowledge
        base or document collection should be isolated. Combined with RBAC, it provides
        both data separation and access control.
      tags: ["multi-tenancy", "architecture", "saas"]

    - topic: "Limitations and Trade-offs"
      content: |
        Key limitations of Weaviate:

        1. Memory consumption. HNSW indexes are memory-resident, meaning large datasets
        require significant RAM. The flat index is more memory-efficient but slower for
        large collections.

        2. Vectorizer module latency. Built-in vectorization adds latency to ingestion and
        queries that use nearText. For high-throughput pipelines, pre-computing vectors
        externally may be faster.

        3. GraphQL complexity. While powerful, the GraphQL API has a steeper learning curve
        than simple REST endpoints. The Python client abstracts most of this.

        4. Schema migrations can be complex. Adding or removing properties from existing
        classes has limitations. Plan your schema carefully.

        5. Cluster management overhead when self-hosting. Running a multi-node Weaviate
        cluster on Kubernetes requires operational expertise.

        6. No built-in backup to object storage in earlier versions. Backups are now
        supported but require configuration.
      tags: ["limitations", "trade-offs"]

code_examples:
  - title: "Basic Collection and Search"
    language: "python"
    code: |
      import weaviate
      from weaviate.classes.config import Configure, Property, DataType

      client = weaviate.connect_to_local()  # or connect_to_wcs() for cloud

      # Create collection with vectorizer
      collection = client.collections.create(
          name="Article",
          vectorizer_config=Configure.Vectorizer.text2vec_openai(),
          properties=[
              Property(name="title", data_type=DataType.TEXT),
              Property(name="content", data_type=DataType.TEXT),
              Property(name="category", data_type=DataType.TEXT),
          ]
      )

      # Insert objects (vectors generated automatically)
      articles = client.collections.get("Article")
      articles.data.insert(
          properties={
              "title": "Introduction to RAG",
              "content": "Retrieval-Augmented Generation combines...",
              "category": "ai"
          }
      )

      # Semantic search using natural language
      response = articles.query.near_text(
          query="how does retrieval augmented generation work",
          limit=5
      )

  - title: "Hybrid Search with Filters"
    language: "python"
    code: |
      import weaviate
      from weaviate.classes.query import Filter, HybridFusion

      client = weaviate.connect_to_local()
      articles = client.collections.get("Article")

      # Hybrid search combining BM25 + vector
      response = articles.query.hybrid(
          query="kubernetes deployment strategies",
          alpha=0.7,  # favor vector search
          fusion_type=HybridFusion.RELATIVE_SCORE,
          filters=Filter.by_property("category").equal("devops"),
          limit=10,
          return_metadata=["score", "explain_score"]
      )

      for obj in response.objects:
          print(f"{obj.properties['title']} (score: {obj.metadata.score})")

  - title: "RAG Pipeline with LangChain"
    language: "python"
    code: |
      from langchain_weaviate import WeaviateVectorStore
      from langchain_openai import OpenAIEmbeddings, ChatOpenAI
      from langchain_core.prompts import ChatPromptTemplate
      import weaviate

      client = weaviate.connect_to_local()
      embeddings = OpenAIEmbeddings(model="text-embedding-3-small")

      vectorstore = WeaviateVectorStore(
          client=client,
          index_name="KnowledgeBase",
          text_key="content",
          embedding=embeddings,
      )

      retriever = vectorstore.as_retriever(
          search_type="mmr",
          search_kwargs={"k": 5, "fetch_k": 20}
      )

      prompt = ChatPromptTemplate.from_template(
          "Answer based on context:\n{context}\n\nQuestion: {question}"
      )
      llm = ChatOpenAI(model="gpt-4o")
      chain = prompt | llm

