identity:
  tagline: "Open-source AI-native vector database with built-in vectorization and hybrid search"
  description: |
    Weaviate is an open-source vector database that stores both objects and vectors, allowing
    for combining vector search with structured filtering. What sets Weaviate apart is its
    modular vectorizer architecture: it can automatically generate embeddings at ingestion
    time using built-in modules for OpenAI, Cohere, Hugging Face, and other providers,
    eliminating the need to manage embedding pipelines separately.

    Weaviate offers a GraphQL API alongside REST, enabling expressive queries that combine
    vector similarity search, keyword (BM25) search, and hybrid search in a single query.
    Its schema-aware design means objects have defined classes with properties, providing
    structure that pure key-value vector stores lack.

    Available as both self-hosted (Docker, Kubernetes) and managed cloud (Weaviate Cloud
    Services), Weaviate supports multi-tenancy, replication, horizontal scaling via sharding,
    and RBAC. It uses a custom HNSW index implementation written in Go for high-performance
    approximate nearest neighbor search, with flat indexes available for filtered search
    on smaller datasets.
  logo_url: "/assets/modules/weaviate.svg"
  website: "https://weaviate.io"
  documentation: "https://weaviate.io/developers/weaviate"
  github: "https://github.com/weaviate/weaviate"
  license: "BSD-3-Clause"
  pricing_model: "open_source"

