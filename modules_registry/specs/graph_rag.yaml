knowledge:
  entries:
    - topic: "Architecture Overview"
      content: |
        GraphRAG operates in two phases: indexing and querying.

        Indexing Phase:
        1. Document chunking: Source documents are split into manageable text chunks.
        2. Entity and relationship extraction: An LLM processes each chunk to identify entities
           (people, organizations, technologies, concepts) and relationships between them.
        3. Graph construction: Entities become nodes, relationships become edges, forming a
           knowledge graph. Entity descriptions are merged across chunks.
        4. Community detection: The Leiden algorithm partitions the graph into hierarchical
           communities of related entities.
        5. Community summarization: An LLM generates summaries for each community at multiple
           hierarchy levels, capturing the key themes and relationships.

        Query Phase (Local Search):
        - Identifies relevant entities in the query
        - Retrieves the entity's graph neighborhood (connected entities, relationships)
        - Fetches associated text chunks
        - Combines graph context with text chunks for LLM generation

        Query Phase (Global Search):
        - Uses pre-computed community summaries
        - Maps the query to relevant communities across hierarchy levels
        - Aggregates community summaries for comprehensive corpus-wide answers
      tags: ["architecture", "indexing", "querying"]

    - topic: "When to Use GraphRAG"
      content: |
        GraphRAG is the right choice when:

        1. Multi-hop reasoning is required. Questions like "Which companies that use Kubernetes
        also have partnerships with cloud providers mentioned in our security reports?" require
        traversing entity relationships that span multiple documents.

        2. Corpus-wide summarization is needed. "What are the top 5 themes across all our
        customer feedback?" requires understanding the entire document set, not just retrieving
        relevant chunks.

        3. Entity relationships are central to the domain. Legal contracts, organizational
        hierarchies, research citation networks, and technical dependency graphs all benefit
        from explicit relationship modeling.

        4. Standard RAG produces fragmented or incomplete answers. If users report that
        answers miss connections between concepts or lack context about relationships,
        GraphRAG can fill these gaps.

        GraphRAG is NOT the right choice when:
        - Queries are simple and fact-based (standard RAG is sufficient and much cheaper)
        - The corpus is small (under 100 documents) - manual graph construction may suffice
        - Real-time indexing is required (GraphRAG indexing is batch-oriented and expensive)
        - Budget is limited - indexing costs are 10-50x standard RAG
      tags: ["decision", "when-to-use"]

    - topic: "Microsoft GraphRAG Implementation"
      content: |
        Microsoft's open-source GraphRAG implementation provides a complete pipeline:

        Configuration: A settings.yaml file defines the LLM provider, embedding model,
        chunking strategy, entity extraction prompts, and graph storage backend.

        Indexing: The `graphrag index` CLI command processes a directory of documents through
        the full pipeline: chunking, entity extraction, graph construction, community
        detection, and summarization. Progress is logged and intermediate outputs are saved.

        Querying: The `graphrag query` CLI supports both local and global search modes.
        Local search retrieves entity neighborhoods and associated text. Global search uses
        community summaries to answer broad questions.

        Customization: Entity extraction prompts can be customized for specific domains.
        Custom entity types (beyond the default person/organization/location/event) can be
        defined. Graph storage can use NetworkX (default) or Neo4j.

        Cost considerations: For a 1000-page corpus, expect 50K-200K LLM input tokens for
        entity extraction and 10K-50K tokens for community summarization. At GPT-4o pricing,
        this translates to approximately $5-20 for initial indexing.
      tags: ["microsoft", "implementation", "setup"]

    - topic: "Alternatives and Variants"
      content: |
        Several GraphRAG variants and alternatives have emerged:

        LlamaIndex Knowledge Graph Index: Integrates knowledge graph construction and querying
        into the LlamaIndex framework. Supports Neo4j, Kuzu, and FalkorDB as graph backends.
        Simpler setup than Microsoft GraphRAG but less sophisticated community detection.

        Neo4j GraphRAG: Neo4j's official Python package for building GraphRAG applications.
        Leverages Neo4j's native graph capabilities and Cypher query language. Best for teams
        already using Neo4j.

        LightRAG: A lightweight alternative that uses a simpler entity-relationship extraction
        approach with lower indexing costs. Trades some of GraphRAG's comprehensiveness for
        efficiency.

        HippoRAG: Research approach that mimics hippocampal memory indexing, using a knowledge
        graph as a long-term memory store with a retrieval model inspired by neuroscience.

        Hybrid approaches combining standard vector RAG with graph-based retrieval are
        increasingly common, using the graph for relationship queries and vectors for
        content-similarity queries.
      tags: ["alternatives", "variants", "comparison"]

code_examples:
  - title: "Microsoft GraphRAG Indexing"
    language: "python"
    code: |
      # Initialize and run GraphRAG indexing pipeline
      import asyncio
      from graphrag.index import run_pipeline_with_config
      from graphrag.config import create_graphrag_config

      # Configure from settings file
      config = create_graphrag_config(root_dir="./ragtest")

      # Run indexing (processes documents, extracts entities,
      # builds graph, detects communities, generates summaries)
      asyncio.run(run_pipeline_with_config(config))

      # Or use CLI:
      # graphrag index --root ./ragtest

  - title: "Microsoft GraphRAG Querying"
    language: "python"
    code: |
      import asyncio
      from graphrag.query.structured_search.local_search import LocalSearch
      from graphrag.query.structured_search.global_search import GlobalSearch

      # Local search - entity-centric queries
      local_search = LocalSearch(
          llm=llm,
          context_builder=local_context_builder,
          token_limit=12000
      )
      local_result = await local_search.asearch(
          "What are Pinecone's key technical advantages?"
      )

      # Global search - corpus-wide queries
      global_search = GlobalSearch(
          llm=llm,
          context_builder=global_context_builder,
          token_limit=12000
      )
      global_result = await global_search.asearch(
          "What are the main themes across all infrastructure documents?"
      )

  - title: "LlamaIndex Knowledge Graph RAG"
    language: "python"
    code: |
      from llama_index.core import KnowledgeGraphIndex, SimpleDirectoryReader
      from llama_index.graph_stores.neo4j import Neo4jGraphStore
      from llama_index.core import StorageContext

      # Set up Neo4j graph store
      graph_store = Neo4jGraphStore(
          username="neo4j",
          password="password",
          url="bolt://localhost:7687",
          database="neo4j"
      )
      storage_context = StorageContext.from_defaults(graph_store=graph_store)

      # Load documents and build knowledge graph
      documents = SimpleDirectoryReader("./data").load_data()
      kg_index = KnowledgeGraphIndex.from_documents(
          documents,
          storage_context=storage_context,
          max_triplets_per_chunk=10,
          include_embeddings=True
      )

      # Query with graph-enhanced retrieval
      query_engine = kg_index.as_query_engine(
          include_text=True,
          response_mode="tree_summarize"
      )
      response = query_engine.query(
          "How are the vector databases related to embedding models?"
      )

