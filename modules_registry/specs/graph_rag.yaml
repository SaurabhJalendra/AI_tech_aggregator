identity:
  tagline: "Knowledge graph-enhanced RAG for complex reasoning over structured relationships"
  description: |
    GraphRAG is an advanced RAG architecture that combines knowledge graphs with traditional
    vector retrieval to enable complex reasoning over structured relationships between entities.
    Instead of treating documents as isolated chunks, GraphRAG builds a graph of entities and
    their relationships, allowing the system to traverse connections, answer multi-hop questions,
    and provide more comprehensive answers.

    Microsoft Research's GraphRAG implementation (open-sourced in 2024) introduced a two-level
    approach: local search for specific entity-centric queries and global search for
    corpus-wide summarization queries. The system uses LLMs to extract entities and relationships
    from source documents, builds a knowledge graph, creates hierarchical community summaries,
    and uses this structured representation for retrieval.

    GraphRAG excels at questions that require understanding relationships between concepts,
    such as "How are these technologies related?", "What are the downstream effects of X?",
    or "Summarize the main themes across all documents." These queries are poorly served by
    traditional chunk-based vector retrieval.

    The approach has gained significant traction in enterprise applications where documents
    describe complex systems, organizational structures, or interconnected processes. The
    trade-off is higher indexing cost (multiple LLM calls per document) and more complex
    infrastructure compared to standard RAG.
