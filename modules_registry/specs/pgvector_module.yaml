identity:
  tagline: "Open-source PostgreSQL extension for vector similarity search"
  description: |
    pgvector is an open-source extension for PostgreSQL that adds vector data types and
    similarity search capabilities. It allows storing embeddings directly alongside
    relational data in your existing PostgreSQL database, eliminating the need for a
    separate vector database in many use cases.

    The extension supports exact and approximate nearest neighbor search using IVFFlat
    and HNSW indexing algorithms. Vectors can be queried using L2 distance, inner product,
    cosine distance, and L1 distance operators. pgvector integrates naturally with
    PostgreSQL's query planner, transaction support, and existing indexing infrastructure.

    pgvector's biggest advantage is simplicity: if you already use PostgreSQL, you can add
    vector search by installing an extension -- no new database to deploy, manage, or learn.
    Your vectors participate in the same ACID transactions as your relational data, can be
    joined with other tables, and benefit from PostgreSQL's mature backup, replication, and
    security features. The trade-off is lower query performance compared to purpose-built
    vector databases at very large scale (100M+ vectors).
