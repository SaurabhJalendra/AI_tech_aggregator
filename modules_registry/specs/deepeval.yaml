identity:
  tagline: "Open-source LLM evaluation framework with unit-test style interface and 14+ metrics"
  description: |
    DeepEval is an open-source evaluation framework for LLM applications that brings
    software engineering testing practices to AI development. It provides a pytest-like
    interface for writing LLM evaluation tests, with 14+ research-backed metrics covering
    RAG quality, conversational AI, tool use, and general LLM output quality.

    The framework supports both reference-free evaluation (using LLMs as judges) and
    reference-based evaluation (comparing against ground truth). Its GEval metric allows
    custom evaluation criteria defined in natural language, making it adaptable to any
    domain or use case.

    DeepEval integrates with CI/CD pipelines through its pytest plugin, enabling automated
    quality gates. The optional Confident AI platform provides a web dashboard for tracking
    metrics over time, managing evaluation datasets, and collaborating on evaluation results.
    The framework works with any LLM provider and supports both synchronous and asynchronous
    evaluation.
  logo_url: "/assets/modules/deepeval.svg"
  website: "https://deepeval.com"
  documentation: "https://docs.confident-ai.com"
  github: "https://github.com/confident-ai/deepeval"
  license: "Apache-2.0"
  pricing_model: "freemium"

