identity:
  tagline: "High-throughput LLM inference engine with PagedAttention for production serving"
  description: |
    vLLM is an open-source library and inference server for fast LLM serving. Its core
    innovation is PagedAttention, an attention algorithm inspired by virtual memory
    paging in operating systems, which efficiently manages the key-value cache memory
    during inference. This allows vLLM to achieve 2-4x higher throughput than naive
    implementations like HuggingFace Transformers.

    vLLM supports continuous batching, which dynamically groups incoming requests to
    maximize GPU utilization. Unlike static batching where all requests in a batch must
    complete before new ones start, continuous batching allows new requests to join and
    completed requests to leave the batch at each iteration step.

    The server provides an OpenAI-compatible API out of the box, making it a drop-in
    replacement for OpenAI API calls in existing applications. It supports a wide range
    of models including Llama, Mistral, Mixtral, Qwen, Gemma, Phi, and many others.
    Tensor parallelism enables serving large models across multiple GPUs.
  logo_url: "/assets/modules/vllm.svg"
  website: "https://vllm.ai"
  documentation: "https://docs.vllm.ai"
  github: "https://github.com/vllm-project/vllm"
  license: "Apache-2.0"
  pricing_model: "open_source"

