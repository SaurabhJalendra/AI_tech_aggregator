knowledge:
  entries:
    - topic: "W&B Weave for LLM Applications"
      content: |
        W&B Weave extends the traditional experiment tracking paradigm to LLM
        applications. Key capabilities:

        Tracing: Automatic instrumentation of LLM calls, tool use, and retrieval
        steps. Captures inputs, outputs, latency, and token usage across your
        entire pipeline.

        Evaluation: Define evaluation datasets and scoring functions, then run
        them against your pipeline to measure quality. Supports both automated
        metrics (faithfulness, relevance) and human evaluation.

        Monitoring: Track production LLM calls to detect regressions, cost
        anomalies, and quality issues over time.

        Weave is particularly valuable for RAG pipelines where you need to
        evaluate retrieval quality, answer faithfulness, and overall pipeline
        performance across many test cases.
      tags: ["weave", "llm", "evaluation"]

code_examples:
  - title: "Basic Experiment Tracking"
    language: "python"
    code: |
      import wandb

      wandb.init(project="rag-experiments", config={
          "embedding_model": "text-embedding-3-small",
          "chunk_size": 512,
          "top_k": 5,
          "llm": "gpt-4o"
      })

      # Log metrics during evaluation
      wandb.log({
          "faithfulness": 0.89,
          "answer_relevancy": 0.92,
          "context_precision": 0.85,
          "latency_ms": 1200
      })

      wandb.finish()

  - title: "Weave Tracing for LLM Pipeline"
    language: "python"
    code: |
      import weave

      weave.init("my-rag-app")

      @weave.op()
      def retrieve_context(query: str) -> list[str]:
          # Your retrieval logic
          return vector_store.search(query, top_k=5)

      @weave.op()
      def generate_answer(query: str, context: list[str]) -> str:
          # Your LLM call
          return llm.invoke(f"Context: {context}\nQuestion: {query}")

      @weave.op()
      def rag_pipeline(query: str) -> str:
          context = retrieve_context(query)
          return generate_answer(query, context)

      # All calls are automatically traced
      answer = rag_pipeline("What is vector search?")

