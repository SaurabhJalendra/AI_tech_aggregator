identity:
  tagline: "ML experiment tracking, model management, and AI application monitoring"
  description: |
    Weights & Biases (W&B) is a platform for machine learning experiment tracking,
    dataset versioning, model management, and AI application evaluation. It provides
    tools to log metrics, hyperparameters, model artifacts, and visualizations during
    training and evaluation runs.

    W&B has expanded beyond traditional ML experiment tracking to include Weave, a
    toolkit for evaluating and monitoring LLM applications including RAG pipelines,
    agents, and AI features. Weave provides tracing, evaluation datasets, and
    automated scoring for LLM outputs.

    The platform is widely adopted in both research and industry, with integrations
    across all major ML frameworks (PyTorch, TensorFlow, Hugging Face, etc.) and
    AI application frameworks (LangChain, LlamaIndex).
  logo_url: "/assets/modules/weights_biases.svg"
  website: "https://wandb.ai"
  documentation: "https://docs.wandb.ai"
  github: "https://github.com/wandb/wandb"
  license: "MIT (client) / Proprietary (server)"
  pricing_model: "freemium"

