technical_specs:
  fusion_methods:
    - name: "Linear Combination"
      description: "Weighted sum of dense and sparse scores: alpha * dense + (1-alpha) * sparse"
      typical_alpha: "0.5-0.7 (favoring dense)"
    - name: "Reciprocal Rank Fusion (RRF)"
      description: "Combines ranked lists using 1/(k+rank) scoring. Parameter-free and robust."
      default_k: 60
    - name: "SPLADE Sparse Encoding"
      description: "Learned sparse representations that outperform BM25 for sparse component."
