identity:
  tagline: "Combining dense vector and sparse keyword retrieval for superior search quality"
  description: |
    Hybrid search is a retrieval strategy that combines dense vector search (semantic similarity)
    with sparse keyword search (BM25, TF-IDF, or SPLADE) to leverage the strengths of both
    approaches. Dense retrieval excels at understanding meaning and intent, while sparse
    retrieval excels at exact keyword matching and handling rare terms.

    In practice, hybrid search addresses the weaknesses of pure vector search: missing exact
    keyword matches (e.g., product codes, error numbers, proper nouns) and struggling with
    out-of-distribution queries. By combining both signals, hybrid search provides more robust
    retrieval across a wider range of query types.

    Major vector databases including Pinecone, Weaviate, Qdrant, and Milvus now support
    hybrid search natively. The approach has become a best practice for production RAG systems,
    particularly in enterprise search where queries often mix natural language with specific
    identifiers, codes, or technical terms.

    The fusion of results from dense and sparse retrievers can be done via linear combination
    (weighted scoring), Reciprocal Rank Fusion (RRF), or learned fusion models. The optimal
    weighting depends on the domain and query distribution.
