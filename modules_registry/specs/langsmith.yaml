knowledge:
  entries:
    - topic: "LangSmith Evaluation Workflows"
      content: |
        LangSmith provides a structured evaluation workflow:

        1. Create a dataset with input-output examples (from production traces,
        manual curation, or synthetic generation).

        2. Define evaluators: built-in (correctness, helpfulness), LLM-as-judge
        (custom criteria), or custom Python functions.

        3. Run evaluations against your chain or model. LangSmith tracks results
        across multiple runs, enabling comparison of different configurations.

        4. Use annotation queues for human evaluation. Reviewers score outputs
        and provide feedback through the LangSmith UI.

        This workflow enables continuous improvement: capture production failures,
        add them to evaluation datasets, fix the pipeline, and verify the fix
        with automated evaluation before redeployment.
      tags: ["evaluation", "workflow", "testing"]

code_examples:
  - title: "Enable Tracing"
    language: "python"
    code: |
      import os
      os.environ["LANGCHAIN_TRACING_V2"] = "true"
      os.environ["LANGCHAIN_API_KEY"] = "your-api-key"
      os.environ["LANGCHAIN_PROJECT"] = "my-rag-app"

      # All LangChain calls are now automatically traced
      from langchain_openai import ChatOpenAI
      llm = ChatOpenAI(model="gpt-4o")
      response = llm.invoke("What is RAG?")

  - title: "Run Evaluation"
    language: "python"
    code: |
      from langsmith import Client
      from langsmith.evaluation import evaluate

      client = Client()

      # Define your pipeline function
      def my_rag_pipeline(inputs: dict) -> dict:
          query = inputs["question"]
          answer = rag_chain.invoke(query)
          return {"answer": answer}

      # Run evaluation against a dataset
      results = evaluate(
          my_rag_pipeline,
          data="my-eval-dataset",
          evaluators=["correctness", "helpfulness"],
          experiment_prefix="rag-v2"
      )

benchmarks:
  last_run: "2026-02-12"
