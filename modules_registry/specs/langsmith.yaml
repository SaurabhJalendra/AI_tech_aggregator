meta:
  slug: "langsmith"
  name: "LangSmith"
  version: "1.0.0"
  category: "evaluation"
  subcategory: "llm_observability"
  status: "stable"
  last_updated: "2026-02-28"
  maintainer: "system"

identity:
  tagline: "LangChain's platform for debugging, testing, and monitoring LLM applications"
  description: |
    LangSmith is a developer platform by LangChain for building production-grade
    LLM applications. It provides tracing, evaluation, prompt engineering, and
    monitoring tools tightly integrated with the LangChain ecosystem.

    LangSmith automatically captures detailed traces of LangChain runs including
    every chain step, LLM call, tool invocation, and retrieval operation. The
    platform also supports evaluation datasets, automated evaluators, prompt
    versioning through LangChain Hub, and production monitoring.

    While LangSmith works best with LangChain applications, it also supports
    generic tracing through the LangSmith SDK for non-LangChain codebases.
  logo_url: "/assets/modules/langsmith.svg"
  website: "https://smith.langchain.com"
  documentation: "https://docs.smith.langchain.com"
  github: "https://github.com/langchain-ai/langsmith-sdk"
  license: "Proprietary"
  pricing_model: "freemium"

capabilities:
  primary_use_cases:
    - "LangChain application debugging"
    - "LLM evaluation and testing"
    - "Prompt engineering and versioning"
    - "Production monitoring"
    - "Dataset curation"
  supported_operations:
    - "trace"
    - "evaluate"
    - "create_dataset"
    - "prompt_hub"
    - "annotation_queue"
    - "monitor"
  integrations:
