identity:
  tagline: Google's long-context Pro model — up to 2M tokens for massive documents
    and video
  description: 'Gemini 1.5 Pro is a foundation model family in the Google ecosystem,
    catalogued

    for architecture decisions at the generation step of AI pipelines. This module
    covers

    model capabilities, context, modalities, deployment fit, and trade-offs — not
    API vendor

    integration (see cloud_api modules such as openai or google_gemini for that layer).


    Strengths: Industry-leading context window, Native multimodal, Vertex enterprise
    path.

    Tradeoffs: Variable latency at huge context, Ecosystem smaller than OpenAI.'
  logo_url: /assets/modules/gemini_1_5_pro.svg
  website: https://deepmind.google/technologies/gemini/
  documentation: https://ai.google.dev/docs
  github: https://github.com/google-gemini/generative-ai-python
  license: Proprietary
  pricing_model: freemium
