knowledge:
  entries:
  - topic: When to choose Gemini 1.5 Pro
    content: 'Choose Gemini 1.5 Pro when your architecture needs very long context
      rag

      and you can accept tradeoffs: Variable latency at huge context.

      Pair with retrieval and evaluation modules; use cloud_api entries only

      when the decision is specifically about API routing, billing, or VPC — not

      model family selection.'
    tags:
    - model-selection
    - architecture
    - foundation_model
  - topic: Gemini 1.5 Pro vs alternatives
    content: 'Compare against claude_opus, gpt4_1, gemini_flash at the foundation_model
      layer only.

      Do not compare to inference hosts (groq_inference), local runners (ollama),
      or

      provider APIs (openai) in the same shortlist — the advisor enforces layer separation.'
    tags:
    - comparison
    - trade-offs
