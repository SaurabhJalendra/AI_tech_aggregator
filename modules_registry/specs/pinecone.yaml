identity:
  tagline: "Fully managed vector database for production AI applications"
  description: |
    Pinecone is a managed vector database designed for machine learning applications
    that require fast and scalable similarity search. It handles the infrastructure
    complexity of vector indexing, including sharding, replication, and scaling,
    letting developers focus on building AI features rather than managing databases.

    Pinecone's serverless architecture automatically scales based on usage, eliminating
    the need to provision and manage infrastructure. It supports metadata filtering,
    sparse-dense hybrid search, and namespaces for multi-tenant data isolation.

    As one of the earliest purpose-built vector databases, Pinecone has strong enterprise
    adoption and extensive integrations with frameworks like LangChain, LlamaIndex, and
    the major LLM providers. The trade-off is vendor lock-in and higher cost compared
    to open-source alternatives for large-scale deployments.
  logo_url: "/assets/modules/pinecone.svg"
  website: "https://www.pinecone.io"
  documentation: "https://docs.pinecone.io"
  github: "https://github.com/pinecone-io/pinecone-python-client"
  license: "Proprietary"
  pricing_model: "freemium"

