identity:
  tagline: "AI-powered voice synthesis and cloning platform for realistic speech generation"
  description: |
    ElevenLabs is a leading voice AI platform specializing in high-fidelity text-to-speech
    synthesis, voice cloning, and audio content creation. The platform uses advanced deep
    learning models to generate natural-sounding speech in dozens of languages with fine-grained
    control over tone, emotion, pacing, and delivery style.

    The platform offers both pre-built voices and custom voice cloning, where users can create
    a digital replica of any voice from just a few minutes of audio samples. ElevenLabs also
    provides a conversational AI API for building voice-driven interactive agents, as well as
    audio dubbing capabilities for translating spoken content across languages while preserving
    the original speaker's voice characteristics.

    ElevenLabs has rapidly become the go-to solution for content creators, game developers,
    accessibility applications, and enterprises needing high-quality synthetic speech at scale.
    Its API-first approach makes it straightforward to integrate into existing workflows and
    applications.
  logo_url: "/assets/modules/elevenlabs.svg"
  website: "https://elevenlabs.io"
  documentation: "https://docs.elevenlabs.io"
  github: "https://github.com/elevenlabs/elevenlabs-python"
  license: "Proprietary"
  pricing_model: "freemium"

