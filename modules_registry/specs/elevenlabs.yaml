knowledge:
  entries:
    - topic: "Architecture and Models"
      content: |
        ElevenLabs offers several TTS model variants optimized for different use cases:

        Multilingual v2 is the flagship model supporting 32 languages with high emotional
        range and natural prosody. It excels at long-form content and handles code-switching
        between languages within the same text.

        Turbo v2.5 is optimized for low-latency applications such as conversational AI agents.
        It sacrifices some voice quality for significantly faster time-to-first-byte, making
        it suitable for real-time interactive applications.

        The voice cloning pipeline uses a few-shot learning approach where the model adapts
        to a target voice from as little as one minute of clean audio. Professional voice
        clones trained on longer samples (30+ minutes) achieve near-indistinguishable quality
        from the original speaker.

        The Conversational AI system combines the TTS engine with turn-taking logic, interrupt
        handling, and integration points for LLM backends (such as OpenAI or Anthropic) to
        create fully voice-driven interactive agents.
      tags: ["architecture", "models", "voice-cloning"]

    - topic: "When to Choose ElevenLabs"
      content: |
        ElevenLabs is the right choice when:

        1. Voice quality is the top priority. ElevenLabs consistently leads in naturalness
        benchmarks and supports a wide range of emotional expressions and speaking styles.

        2. You need voice cloning capabilities. The platform makes it straightforward to
        create custom voices from audio samples, useful for brand voices, character voices
        in games, or personalized accessibility tools.

        3. You're building a conversational AI agent that needs a voice interface. The
        Conversational AI API handles the complexity of real-time voice interaction including
        turn-taking and interruption handling.

        4. Multilingual support is needed. The Multilingual v2 model supports 32 languages
        with natural pronunciation and can handle mixed-language text.

        ElevenLabs may NOT be the right choice when: you need on-premises deployment for
        data sovereignty, cost is the primary concern for high-volume TTS (consider open-source
        alternatives like Coqui TTS or Piper), or you need speech-to-text (use Whisper or
        Deepgram instead).
      tags: ["decision", "comparison"]

    - topic: "Streaming and Real-Time Usage"
      content: |
        ElevenLabs supports two streaming modes for real-time applications:

        HTTP streaming returns audio chunks as they are generated via chunked transfer encoding.
        This is the simplest integration path and works well for applications where the full
        text is known upfront.

        WebSocket streaming allows sending text chunks incrementally and receiving audio in
        real time. This is essential for conversational AI where the LLM generates text token
        by token. You can pipe LLM output directly into the WebSocket and get audio output
        with minimal latency.

        For optimal latency, use the Turbo v2.5 model with the WebSocket API. The
        time-to-first-byte is typically under 300ms, enabling responsive voice interactions.

        The flush mechanism allows you to signal the end of a text segment, ensuring the
        model generates complete prosody for the final sentence rather than waiting for more
        input. This is critical for natural-sounding conversational turns.
      tags: ["streaming", "real-time", "websocket"]

    - topic: "Pricing and Cost Optimization"
      content: |
        ElevenLabs pricing is primarily based on character count (number of characters
        converted to speech):

        Free tier: ~10,000 characters/month with limited voice options.
        Starter: ~30,000 characters/month with voice cloning.
        Creator: ~100,000 characters/month with professional voice cloning.
        Scale and Enterprise: higher volumes with priority support and SLAs.

        Cost optimization strategies:
        1. Cache generated audio for repeated content instead of regenerating.
        2. Use the appropriate model (Turbo for conversations, Multilingual for quality-critical content).
        3. Preprocess text to remove unnecessary whitespace and formatting characters.
        4. Use SSML-like pronunciation controls sparingly as they add character count.
        5. For very high volumes, contact sales for custom enterprise pricing.

        The Conversational AI product has separate usage-based pricing based on minutes
        of conversation rather than character count.
      tags: ["pricing", "cost", "optimization"]

code_examples:
  - title: "Basic Text-to-Speech"
    language: "python"
    code: |
      from elevenlabs import ElevenLabs

      client = ElevenLabs(api_key="your-api-key")

      # Generate speech
      audio = client.text_to_speech.convert(
          voice_id="JBFqnCBsd6RMkjVDRZzb",
          text="Hello, welcome to our AI platform.",
          model_id="eleven_multilingual_v2",
          output_format="mp3_44100_128"
      )

      # Save to file
      with open("output.mp3", "wb") as f:
          for chunk in audio:
              f.write(chunk)

  - title: "WebSocket Streaming with LLM"
    language: "python"
    code: |
      import asyncio
      from elevenlabs import ElevenLabs

      client = ElevenLabs(api_key="your-api-key")

      async def stream_tts(text_iterator):
          """Stream LLM output directly to ElevenLabs for real-time audio."""
          audio_stream = client.text_to_speech.convert_as_stream(
              voice_id="JBFqnCBsd6RMkjVDRZzb",
              model_id="eleven_turbo_v2_5",
              text=text_iterator,
              optimize_streaming_latency=3
          )

          async for audio_chunk in audio_stream:
              # Play or forward audio chunk
              yield audio_chunk

  - title: "Voice Cloning"
    language: "python"
    code: |
      from elevenlabs import ElevenLabs

      client = ElevenLabs(api_key="your-api-key")

      # Clone a voice from audio files
      voice = client.clone(
          name="My Custom Voice",
          description="A warm, professional speaking voice",
          files=["sample1.mp3", "sample2.mp3"]
      )

      # Use the cloned voice
      audio = client.text_to_speech.convert(
          voice_id=voice.voice_id,
          text="This is my cloned voice speaking.",
          model_id="eleven_multilingual_v2"
      )

