identity:
  tagline: "The data framework for connecting custom data sources to large language models"
  description: |
    LlamaIndex (formerly GPT Index) is a data framework designed to ingest, structure, and
    access private or domain-specific data for LLM applications. It provides the tools to
    build production-grade RAG systems with advanced indexing strategies, query engines, and
    data connectors.

    The framework excels at the data layer of LLM applications: loading data from 160+ sources
    (via LlamaHub), chunking and parsing documents intelligently, creating sophisticated index
    structures, and implementing advanced retrieval strategies. It supports simple vector
    indices, knowledge graphs, tree indices, keyword tables, and composable graph indices.

    LlamaIndex's Workflows system provides an event-driven orchestration layer for building
    complex agentic RAG pipelines with branching, looping, and concurrent execution. This
    positions it as both a data framework and an agent orchestration tool, though its core
    strength remains in retrieval and data management.

    LlamaCloud extends the open-source framework with managed parsing (LlamaParse for complex
    documents like PDFs with tables), managed ingestion pipelines, and managed retrieval,
    providing a production path for teams that want to avoid building infrastructure.
  logo_url: "/assets/modules/llamaindex.svg"
  website: "https://www.llamaindex.ai"
  documentation: "https://docs.llamaindex.ai"
  github: "https://github.com/run-llama/llama_index"
  license: "MIT"
  pricing_model: "open_source"

