knowledge:
  entries:
    - topic: "Task-Type Optimization"
      content: |
        Cohere Embed v3 introduces the input_type parameter which optimizes embeddings for
        specific downstream tasks:

        - search_document: Use when embedding documents to be searched. Produces embeddings
          optimized for being retrieved.
        - search_query: Use when embedding search queries. Produces embeddings optimized for
          finding relevant documents. Always pair search_query with search_document.
        - classification: Use when embeddings will be used as features for classification tasks.
        - clustering: Use when embeddings will be used for clustering or topic modeling.

        This asymmetric approach (different embeddings for queries vs documents) improves retrieval
        quality by 5-15% compared to symmetric embeddings on most benchmarks. It is critical to
        use the correct input_type for both indexing and query time; mixing types degrades quality.
      tags: ["input-type", "optimization", "search"]

    - topic: "Binary Embeddings and Compression"
      content: |
        Embed v3 supports multiple embedding formats that enable dramatic storage savings:

        float (default): Full float32 embeddings at 1024 dimensions = 4KB per vector.
        int8: Quantized to 8-bit integers = 1KB per vector (4x compression).
        ubinary/binary: Packed binary representations = 128 bytes per vector (32x compression).

        Binary embeddings work best with a two-stage retrieval approach: first retrieve a
        large candidate set using binary embeddings (fast and cheap), then rescore the top
        candidates using float embeddings. This approach maintains 95%+ of full-precision
        quality while dramatically reducing storage and search costs.

        For a collection of 100M documents, binary embeddings require approximately 12GB of
        storage vs 400GB for float32. This makes billion-scale search feasible without
        expensive infrastructure.
      tags: ["compression", "binary", "optimization", "scale"]

    - topic: "Multilingual and Cross-Lingual Search"
      content: |
        Cohere's embed-multilingual-v3.0 model produces aligned embeddings across 100+ languages.
        This means a query in English will have high cosine similarity with a relevant document
        in French, Japanese, or Arabic.

        This is not translation-based; the model natively understands multiple languages and
        maps them into a shared embedding space. Cross-lingual retrieval quality is typically
        within 5% of same-language retrieval.

        Use cases: (1) Multilingual knowledge bases where documents exist in many languages,
        (2) Customer support systems serving global users, (3) Legal or compliance search across
        jurisdictions with different languages, (4) Academic paper search across languages.

        The multilingual model has the same 1024-dimension output as the English model, so
        switching requires no changes to vector database schema or retrieval pipeline.
      tags: ["multilingual", "cross-lingual", "international"]

    - topic: "Limitations and Trade-offs"
      content: |
        Key limitations of Cohere Embed:

        1. Shorter context window. Max 512 tokens per input, shorter than OpenAI's 8191 tokens.
        Long documents must be chunked more aggressively.

        2. Smaller batch size. 96 texts per API call vs OpenAI's 2048, requiring more API calls
        for large-scale embedding jobs.

        3. Lower default dimensions. 1024 dimensions (or 384 for light models) vs OpenAI's
        1536/3072. Adequate for most use cases but may matter for very high-precision retrieval.

        4. Smaller community ecosystem. Fewer tutorials, guides, and community examples compared
        to OpenAI embeddings.

        5. No native dimension reduction. Unlike OpenAI's v3 models, dimensions are fixed per
        model. Use compression formats (int8, binary) instead for size reduction.
      tags: ["limitations", "trade-offs"]

code_examples:
  - title: "Basic Embedding with Task Types"
    language: "python"
    code: |
      import cohere

      co = cohere.Client("your-api-key")

      # Embed documents for indexing
      doc_response = co.embed(
          texts=["RAG combines retrieval with generation", "Vector databases store embeddings"],
          model="embed-english-v3.0",
          input_type="search_document"
      )

      # Embed query for searching
      query_response = co.embed(
          texts=["How does RAG work?"],
          model="embed-english-v3.0",
          input_type="search_query"
      )

  - title: "Binary Embeddings for Scale"
    language: "python"
    code: |
      import cohere
      import numpy as np

      co = cohere.Client("your-api-key")

      response = co.embed(
          texts=["Document to embed"],
          model="embed-english-v3.0",
          input_type="search_document",
          embedding_types=["ubinary"]
      )

      binary_embedding = response.embeddings.ubinary[0]
      print(f"Binary embedding size: {len(binary_embedding)} bytes")

  - title: "Multilingual Search with LangChain"
    language: "python"
    code: |
      from langchain_cohere import CohereEmbeddings

      embeddings = CohereEmbeddings(
          model="embed-multilingual-v3.0",
          cohere_api_key="your-api-key"
      )

      # These will be in the same embedding space
      en_vector = embeddings.embed_query("What is machine learning?")
      fr_vector = embeddings.embed_query("Qu'est-ce que l'apprentissage automatique?")

      # Cosine similarity will be high despite different languages

