identity:
  tagline: "Multilingual embedding models with task-specific optimization and compression"
  description: |
    Cohere Embed is a family of embedding models designed for search, classification, and
    clustering across 100+ languages. The latest Embed v3 models introduce input_type-based
    optimization, where embeddings are generated differently depending on whether the input
    is a search query, a document, or a classification target.

    Embed v3 supports multiple output formats including float32, int8, ubinary, and binary,
    enabling massive compression for large-scale deployments. Binary embeddings reduce storage
    by 32x compared to float32, with only a modest quality trade-off when combined with
    rescoring.

    Cohere also offers the embed-multilingual model, which produces aligned embeddings across
    100+ languages, allowing cross-lingual search where a query in English can match documents
    in Japanese or French. This makes Cohere a strong choice for international and multilingual
    RAG applications.
  logo_url: "/assets/modules/cohere_embed.svg"
  website: "https://cohere.com"
  documentation: "https://docs.cohere.com/docs/embeddings"
  github: "https://github.com/cohere-ai/cohere-python"
  license: "Proprietary"
  pricing_model: "freemium"

