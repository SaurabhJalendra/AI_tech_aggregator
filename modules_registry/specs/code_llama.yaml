identity:
  tagline: Meta's open-weight code models derived from Llama for self-hosted dev tools
  description: 'Code Llama is a foundation model family in the Meta ecosystem, catalogued

    for architecture decisions at the generation step of AI pipelines. This module
    covers

    model capabilities, context, modalities, deployment fit, and trade-offs — not
    API vendor

    integration (see cloud_api modules such as openai or google_gemini for that layer).


    Strengths: Free weights, Multiple sizes, Proven self-host stack.

    Tradeoffs: Older vs latest API code models, Ops overhead.'
  logo_url: /assets/modules/code_llama.svg
  website: https://ai.meta.com/blog/code-llama-large-language-model-coding/
  documentation: https://github.com/meta-llama/codellama
  github: https://github.com/meta-llama/codellama
  license: Llama 3 Community License
  pricing_model: open_source
