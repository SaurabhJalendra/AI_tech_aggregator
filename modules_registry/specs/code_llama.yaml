knowledge:
  entries:
  - topic: When to choose Code Llama
    content: 'Choose Code Llama when your architecture needs air-gapped coding

      and you can accept tradeoffs: Older vs latest API code models.

      Pair with retrieval and evaluation modules; use cloud_api entries only

      when the decision is specifically about API routing, billing, or VPC — not

      model family selection.'
    tags:
    - model-selection
    - architecture
    - foundation_model
  - topic: Code Llama vs alternatives
    content: 'Compare against deepseek_coder, codestral, llama_3 at the foundation_model
      layer only.

      Do not compare to inference hosts (groq_inference), local runners (ollama),
      or

      provider APIs (openai) in the same shortlist — the advisor enforces layer separation.'
    tags:
    - comparison
    - trade-offs
