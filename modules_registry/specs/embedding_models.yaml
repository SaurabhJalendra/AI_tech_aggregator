identity:
  tagline: "Models that convert text into dense vector representations for semantic search"
  description: |
    Embedding models transform text into fixed-size numerical vectors that capture semantic
    meaning. Two pieces of text with similar meanings produce vectors that are close together
    in the embedding space, enabling similarity search, clustering, and classification.

    The choice of embedding model impacts every downstream component in a RAG pipeline: the
    quality of vector search, the relevance of retrieved context, and ultimately the accuracy
    of LLM-generated answers. Key factors include dimensionality, maximum input length,
    multilingual support, and the trade-off between quality and cost.

    The landscape has evolved rapidly, with new models consistently pushing the state of the
    art on benchmarks like MTEB. OpenAI's text-embedding-3 family, Cohere's embed-v4, and
    open-source models like BAAI/bge and Nomic embed compete on different axes of quality,
    cost, and deployment flexibility.
  documentation: "https://huggingface.co/spaces/mteb/leaderboard"
  license: "Various"
  pricing_model: "freemium"

