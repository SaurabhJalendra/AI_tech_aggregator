technical_specs:
  patterns:
    naive_rag:
      description: "Simple retrieve-then-generate pipeline"
      stages: ["embed_query", "vector_search", "generate"]
      latency: "1-3 seconds"
      accuracy: "medium"
    advanced_rag:
      description: "Multi-stage with query transformation and reranking"
      stages: ["query_transform", "vector_search", "rerank", "generate"]
      latency: "2-5 seconds"
      accuracy: "high"
    modular_rag:
      description: "Composable pipeline with interchangeable components"
      stages: ["routing", "retrieval", "post_processing", "generation"]
      latency: "2-8 seconds"
      accuracy: "high"
    graph_rag:
      description: "Knowledge graph enhanced retrieval"
      stages: ["entity_extraction", "graph_traversal", "context_assembly", "generate"]
      latency: "3-10 seconds"
      accuracy: "very high for relational queries"
    agentic_rag:
      description: "LLM agent decides retrieval strategy dynamically"
      stages: ["plan", "retrieve", "evaluate", "iterate", "generate"]
      latency: "5-30 seconds"
      accuracy: "highest"

