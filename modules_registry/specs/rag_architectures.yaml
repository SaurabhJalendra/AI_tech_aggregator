identity:
  tagline: "Architectural patterns for Retrieval-Augmented Generation systems"
  description: |
    RAG (Retrieval-Augmented Generation) combines information retrieval with language model
    generation. Instead of relying solely on a model's training data, RAG systems retrieve
    relevant context from a knowledge base and include it in the prompt, producing more
    accurate, grounded, and up-to-date responses.

    RAG architectures have evolved from simple retrieve-then-generate pipelines to sophisticated
    systems with query transformation, multi-stage retrieval, reranking, and iterative
    refinement. The choice of architecture depends on the complexity of queries, accuracy
    requirements, latency constraints, and the nature of the knowledge base.

    This module covers the major RAG patterns from naive RAG through advanced, modular,
    graph-based, and agentic approaches, helping you choose the right architecture for
    your specific use case.
  documentation: "https://python.langchain.com/docs/tutorials/rag/"
  license: "N/A"
  pricing_model: "open_source"

