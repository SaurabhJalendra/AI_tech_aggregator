knowledge:
  entries:
    - topic: "Naive RAG vs Advanced RAG"
      content: |
        Naive RAG follows a simple three-step pipeline: embed the user query, search the vector
        database for similar chunks, and pass the retrieved chunks as context to the LLM for
        answer generation. This works well for straightforward factual queries over clean,
        well-chunked documents.

        Naive RAG fails when: queries are ambiguous or complex, the answer requires information
        from multiple documents, the retrieved chunks don't contain the answer despite it being
        in the corpus, or the user's query doesn't match the vocabulary used in the documents.

        Advanced RAG addresses these failures with pre-retrieval and post-retrieval enhancements.
        Pre-retrieval: query rewriting, hypothetical document embeddings (HyDE), query
        decomposition for multi-part questions. Post-retrieval: reranking with cross-encoders,
        context compression, and relevance filtering.

        The transition from naive to advanced RAG typically improves answer accuracy by 15-30%
        while increasing latency by 2-5x. For most production systems, the accuracy improvement
        justifies the additional latency.
      tags: ["comparison", "naive", "advanced"]

    - topic: "Agentic RAG Patterns"
      content: |
        Agentic RAG gives the LLM agency over the retrieval process. Instead of a fixed
        pipeline, the agent decides what to search for, evaluates whether the results are
        sufficient, and iterates until it has enough context to answer confidently.

        Key patterns in agentic RAG:

        1. Self-RAG: The model generates an answer, then critiques whether it needs retrieval.
        If the answer seems uncertain, it retrieves context and regenerates. This avoids
        unnecessary retrieval for questions the model can answer from training data.

        2. Corrective RAG (CRAG): After retrieval, a secondary model evaluates the relevance
        of retrieved documents. If the documents are irrelevant, the system falls back to web
        search or asks the user to clarify.

        3. Adaptive RAG: Routes queries to different retrieval strategies based on query
        complexity. Simple factual queries use naive RAG. Complex multi-hop queries use
        iterative retrieval with query decomposition.

        Agentic RAG is most valuable for enterprise applications where query complexity is
        high and accuracy requirements are strict. The trade-off is higher latency (5-30s
        per query) and cost (multiple LLM calls per query).
      tags: ["agentic", "advanced", "patterns"]

    - topic: "Graph RAG and Knowledge Graphs"
      content: |
        Graph RAG combines vector search with knowledge graph traversal. While vector search
        excels at finding semantically similar content, it struggles with queries that require
        understanding relationships between entities.

        Example: "Which companies that invested in OpenAI also invested in Anthropic?" A vector
        search might retrieve documents about OpenAI investors and Anthropic investors separately,
        but won't find the intersection. A knowledge graph can directly traverse investor
        relationships to find the answer.

        Microsoft's GraphRAG implementation extracts entities and relationships from documents
        during indexing, builds a graph, and uses community detection to create hierarchical
        summaries. At query time, it searches both the vector index and the graph, combining
        results for comprehensive answers.

        Implementation approaches: Neo4j with LangChain's GraphCypherQAChain for full graph
        queries, LlamaIndex's KnowledgeGraphIndex for simpler graph-enhanced retrieval, or
        custom solutions using NetworkX for in-memory graphs on smaller datasets.
      tags: ["graph-rag", "knowledge-graph", "advanced"]

    - topic: "Common RAG Failure Modes and Solutions"
      content: |
        Understanding RAG failure modes is essential for building robust systems.

        1. Missing context: The answer exists in the corpus but wasn't retrieved. Solution:
        improve chunking to ensure answer-containing chunks are self-contained, add query
        expansion, or use hybrid search (dense + sparse).

        2. Wrong context: Retrieved chunks are topically relevant but don't contain the answer.
        Solution: add a reranker (Cohere Rerank, cross-encoder) to filter irrelevant results.

        3. Hallucination despite context: The LLM generates an answer that contradicts the
        retrieved context. Solution: use constrained generation, add explicit grounding
        instructions, or implement answer verification.

        4. Context overflow: Too many chunks exceed the LLM context window. Solution: use
        context compression (LongLLMLingua), map-reduce over chunks, or implement a
        relevance-based truncation strategy.

        5. Stale data: The knowledge base is outdated. Solution: implement incremental
        indexing with change detection, set up automated refresh pipelines.

        The RAGAS framework provides metrics to diagnose which failure mode is occurring:
        context precision (wrong context), context recall (missing context), faithfulness
        (hallucination), and answer relevance (off-topic).
      tags: ["failure-modes", "debugging", "evaluation"]

    - topic: "Production RAG Architecture Checklist"
      content: |
        A production-ready RAG system needs more than just retrieval and generation. Key
        components that are often missed in prototypes:

        1. Evaluation pipeline: Automated tests with ground-truth Q&A pairs. Measure retrieval
        recall, answer accuracy, and faithfulness. Run on every knowledge base update.

        2. Observability: Log every query, retrieval result, and generated answer. Track latency,
        token usage, and cost per query. Tools: LangSmith, Phoenix (Arize), Langfuse.

        3. Feedback loop: Let users flag incorrect answers. Use this feedback to improve chunking,
        add missing knowledge, and fine-tune the retrieval model.

        4. Guardrails: Detect and prevent hallucinations, off-topic responses, and inappropriate
        content. Implement answer grounding checks that verify claims against retrieved context.

        5. Caching: Cache embeddings for frequent queries. Cache LLM responses for repeated
        questions. Semantic caching catches paraphrased versions of the same question.

        6. Fallback strategy: When confidence is low, escalate to human review or ask the user
        for clarification instead of guessing. A "I don't know" is better than a wrong answer.
      tags: ["production", "checklist", "best-practices"]

code_examples:
  - title: "Naive RAG with LangChain"
    language: "python"
    code: |
      from langchain_openai import ChatOpenAI, OpenAIEmbeddings
      from langchain_pinecone import PineconeVectorStore
      from langchain_core.prompts import ChatPromptTemplate
      from langchain_core.output_parsers import StrOutputParser
      from langchain_core.runnables import RunnablePassthrough

      # Setup
      embeddings = OpenAIEmbeddings(model="text-embedding-3-small")
      vectorstore = PineconeVectorStore(index_name="docs", embedding=embeddings)
      retriever = vectorstore.as_retriever(search_kwargs={"k": 5})
      llm = ChatOpenAI(model="gpt-4o")

      # RAG chain
      prompt = ChatPromptTemplate.from_template(
          "Answer based on the following context:\n\n{context}\n\nQuestion: {question}"
      )
      chain = (
          {"context": retriever, "question": RunnablePassthrough()}
          | prompt
          | llm
          | StrOutputParser()
      )
      answer = chain.invoke("What is the refund policy?")

  - title: "Advanced RAG with Reranking"
    language: "python"
    code: |
      from langchain.retrievers import ContextualCompressionRetriever
      from langchain_cohere import CohereRerank

      # Wrap retriever with reranker
      compressor = CohereRerank(model="rerank-v3.5", top_n=3)
      compression_retriever = ContextualCompressionRetriever(
          base_compressor=compressor,
          base_retriever=retriever,
      )

      # Use in chain (same as above but with compression_retriever)
      chain = (
          {"context": compression_retriever, "question": RunnablePassthrough()}
          | prompt
          | llm
          | StrOutputParser()
      )

