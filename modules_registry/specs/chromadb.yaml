identity:
  tagline: "Open-source embedding database designed for developer productivity and AI-native workflows"
  description: |
    Chroma is an open-source embedding database (vector database) built with developer
    experience as the top priority. It provides the simplest possible API for storing,
    querying, and retrieving embeddings, making it the go-to choice for prototyping AI
    applications and building RAG pipelines quickly.

    Chroma runs in-process as an embedded database (like SQLite for vectors), as a
    standalone server, or as a managed cloud service. The embedded mode requires zero
    configuration — just pip install chromadb and start adding documents. Chroma can
    automatically generate embeddings using built-in support for sentence-transformers,
    OpenAI, Cohere, and other embedding providers.

    While Chroma excels at developer experience and rapid prototyping, it has evolved
    significantly toward production readiness. Chroma Cloud provides a managed service
    with authentication, multi-tenancy, and persistent storage. The open-source server
    mode supports client-server deployments with persistent storage via ClickHouse or
    SQLite backends.

    Chroma's philosophy emphasizes simplicity over configuration: sensible defaults,
    minimal boilerplate, and a "just works" experience that lets developers focus on
    their AI application rather than database operations.
  logo_url: "/assets/modules/chromadb.svg"
  website: "https://www.trychroma.com"
  documentation: "https://docs.trychroma.com"
  github: "https://github.com/chroma-core/chroma"
  license: "Apache-2.0"
  pricing_model: "open_source"

