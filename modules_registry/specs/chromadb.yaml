    justification: "Single-node architecture limits scalability. No built-in sharding or distributed mode. Chroma Cloud provides managed scaling but with limitations compared to purpose-built distributed databases."
  ease_of_use:
    score: 10
    justification: "Best-in-class developer experience. Zero-config embedded mode. Automatic embedding generation. Minimal API surface. Excellent for prototyping and learning. pip install and go."
  cost_efficiency:
