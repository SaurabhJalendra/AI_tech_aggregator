identity:
  tagline: "Managed AI-powered search and discovery platform with sub-millisecond response times"
  description: |
    Algolia is a hosted search-as-a-service platform that combines traditional keyword search
    with AI-powered features including neural search, dynamic re-ranking, and personalization.
    Known for its exceptional speed (sub-10ms query responses) and developer experience, Algolia
    is widely adopted for e-commerce search, site search, and in-app search use cases.

    Algolia's NeuralSearch feature blends keyword matching with vector-based semantic understanding,
    automatically determining the optimal balance for each query. This means queries like
    "comfortable office chair under $500" leverage both the semantic understanding of "comfortable"
    and the precise filtering of "$500" without manual tuning.

    The platform provides a comprehensive suite of search features out of the box: typo tolerance,
    faceting, geo search, A/B testing, analytics, and merchandising rules. For AI applications,
    Algolia Recommend provides ML-powered product recommendations, and the Algolia AI suite
    includes query categorization, synonym suggestion, and revenue optimization.
  logo_url: "/assets/modules/algolia.svg"
  website: "https://www.algolia.com"
  documentation: "https://www.algolia.com/doc/"
  github: "https://github.com/algolia/algoliasearch-client-python"
  license: "Proprietary"
  pricing_model: "freemium"

