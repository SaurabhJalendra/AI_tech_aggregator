knowledge:
  entries:
    - topic: "NeuralSearch Architecture"
      content: |
        Algolia NeuralSearch combines keyword-based search with vector-based semantic retrieval
        in a single query. Unlike basic hybrid search that requires manual tuning of keyword
        vs. vector weights, NeuralSearch uses a learning-to-rank model trained on billions
        of search interactions to automatically optimize the blend for each query.

        The system works in three stages:
        1. Keyword retrieval using Algolia's optimized inverted index (typo-tolerant, prefix matching)
        2. Neural retrieval using transformer-based embeddings for semantic matching
        3. Dynamic fusion that combines both result sets using a learned ranking model

        This automatic fusion means that a query like "red running shoes" correctly matches
        products tagged as "crimson joggers" (semantic match) while still boosting exact
        keyword matches. The balance adapts per query: highly specific queries lean toward
        keyword matching while vague or natural language queries lean toward semantic.

        NeuralSearch is enabled per index and requires no embedding model management. Algolia
        handles the embedding generation, indexing, and query-time inference internally.
      tags: ["neuralsearch", "architecture", "hybrid"]

    - topic: "When to Choose Algolia"
      content: |
        Algolia is the right choice when:

        1. User-facing search speed is critical. Sub-10ms globally means instant search-as-you-type
        experiences that directly impact conversion rates and user satisfaction.

        2. You need a complete search solution fast. Algolia's InstantSearch libraries provide
        production-ready search UIs in hours, not weeks.

        3. E-commerce search with merchandising control. Algolia's rules engine lets business
        teams boost, bury, pin, and filter results without engineering involvement.

        4. Search analytics and A/B testing matter. Algolia provides comprehensive analytics
        on search performance, click-through rates, and conversion, with built-in A/B testing.

        5. You want AI search features without ML infrastructure. NeuralSearch and Recommend
        work out of the box without managing models or embeddings.

        Algolia may NOT be the right choice when: cost is the primary concern (self-hosted
        solutions are cheaper at scale), you need a general-purpose vector database for RAG
        (consider Pinecone or Elasticsearch), you need complex analytics or aggregations
        (consider Elasticsearch), or you need full control over ranking algorithms.
      tags: ["decision", "comparison"]

    - topic: "Algolia Recommend for AI-Powered Recommendations"
      content: |
        Algolia Recommend provides ML-powered product and content recommendations through
        several models:

        Related Products: "Customers who viewed X also viewed Y" based on collaborative
        filtering trained on user interaction events (clicks, conversions).

        Frequently Bought Together: Market basket analysis for cross-selling on product
        detail pages and cart pages.

        Trending Items: Surfaces currently popular items based on recent interaction velocity.

        Looking Similar: Visual and attribute-based similarity for "more like this" experiences.

        Implementation requires sending user interaction events (viewed, clicked, purchased)
        to Algolia's Insights API. Models are trained automatically and updated continuously.
        No ML expertise required.

        The Recommend API returns results in the same format as search results, making it
        easy to use the same InstantSearch components for both search and recommendations.
        Custom business rules can be applied on top of ML recommendations.
      tags: ["recommendations", "personalization", "ml"]

    - topic: "Integration with AI/RAG Pipelines"
      content: |
        While Algolia is primarily designed for user-facing search, it can serve as a retrieval
        layer in RAG architectures:

        1. As a retriever: Use Algolia's search API to retrieve relevant documents, then pass
        them as context to an LLM. Algolia's speed and relevance make it effective for
        real-time RAG where latency matters.

        2. With LangChain: The community Algolia retriever for LangChain allows using Algolia
        as a vector store in LangChain pipelines, though it's primarily useful for keyword
        and hybrid retrieval rather than pure vector search.

        3. Structured data retrieval: Algolia excels at retrieving structured records (products,
        articles, documentation) with faceting and filtering that complement semantic search.

        For pure vector RAG workloads, purpose-built vector databases (Pinecone, Qdrant) are
        generally more appropriate. Algolia's strength in RAG is when the retrieval needs
        also serve a user-facing search interface, avoiding the need for two separate systems.
      tags: ["rag", "integration", "langchain"]

code_examples:
  - title: "Basic Search with InstantSearch"
    language: "javascript"
    code: |
      import algoliasearch from 'algoliasearch';
      import instantsearch from 'instantsearch.js';
      import { searchBox, hits, refinementList } from 'instantsearch.js/es/widgets';

      const searchClient = algoliasearch('APP_ID', 'SEARCH_API_KEY');

      const search = instantsearch({
        indexName: 'products',
        searchClient,
      });

      search.addWidgets([
        searchBox({ container: '#searchbox' }),
        hits({
          container: '#hits',
          templates: {
            item: (hit) => `
              <div>
                <h3>${hit._highlightResult.name.value}</h3>
                <p>${hit.description}</p>
                <span>$${hit.price}</span>
              </div>
            `,
          },
        }),
        refinementList({ container: '#categories', attribute: 'category' }),
      ]);

      search.start();

  - title: "Python Backend Search"
    language: "python"
    code: |
      from algoliasearch.search.client import SearchClientSync

      client = SearchClientSync("APP_ID", "ADMIN_API_KEY")

      # Index records
      client.save_objects(
          index_name="products",
          objects=[
              {
                  "objectID": "prod-1",
                  "name": "Ergonomic Office Chair",
                  "description": "Comfortable mesh chair with lumbar support",
                  "price": 449,
                  "category": "furniture"
              }
          ]
      )

      # Search with filters
      results = client.search(
          search_method_params={
              "requests": [
                  {
                      "indexName": "products",
                      "query": "comfortable chair",
                      "filters": "price < 500",
                      "hitsPerPage": 10
                  }
              ]
          }
      )

  - title: "Sending Events for Recommendations"
    language: "python"
    code: |
      from algoliasearch.insights.client import InsightsClientSync

      insights = InsightsClientSync("APP_ID", "API_KEY")

      # Track product view
      insights.push_events(events_items=[
          {
              "eventType": "view",
              "eventName": "Product Viewed",
              "index": "products",
              "userToken": "user-123",
              "objectIDs": ["prod-1"],
          }
      ])

      # Track purchase for Frequently Bought Together
      insights.push_events(events_items=[
          {
              "eventType": "conversion",
              "eventName": "Product Purchased",
              "index": "products",
              "userToken": "user-123",
              "objectIDs": ["prod-1", "prod-2"],
          }
      ])

