identity:
  tagline: "Open-source framework by deepset for building production-grade NLP and LLM-powered search pipelines"
  description: |
    Haystack is an open-source framework by deepset for building end-to-end NLP and LLM
    applications, with a strong focus on search, question answering, and retrieval-augmented
    generation. It provides a pipeline-based architecture where components are connected into
    directed graphs for document processing, retrieval, and generation.

    Haystack 2.x (the current major version) introduced a complete redesign with a strongly-typed
    component system, flexible pipeline DAGs, and first-class support for LLM-based applications
    alongside traditional NLP. Components declare their inputs and outputs with Python type hints,
    enabling compile-time validation and clear data flow.

    The framework distinguishes itself with a structured, production-oriented approach: pipelines
    are serializable to YAML for version control and deployment, components are independently
    testable, and the architecture encourages clean separation of concerns. This makes Haystack
    particularly appealing to teams with software engineering discipline who want maintainable,
    testable LLM applications.

    deepset Cloud provides a managed platform for deploying Haystack pipelines at scale, with
    a visual pipeline editor, evaluation tools, and enterprise features. The open-source
    framework works fully standalone.
  logo_url: "/assets/modules/haystack.svg"
  website: "https://haystack.deepset.ai"
  documentation: "https://docs.haystack.deepset.ai"
  github: "https://github.com/deepset-ai/haystack"
  license: "Apache-2.0"
