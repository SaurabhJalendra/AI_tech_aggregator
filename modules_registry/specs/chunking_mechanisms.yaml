technical_specs:
  approaches:
    fixed_size:
      description: "Split by character/token count with overlap"
      typical_chunk_size: "256-1024 tokens"
      overlap: "10-20% of chunk size"
    recursive_character:
      description: "Split by hierarchy of separators (paragraphs > sentences > words)"
      typical_chunk_size: "512-1024 tokens"
    semantic:
      description: "Split at semantic boundaries using embedding similarity"
      requires_embedding_model: true
    document_structure:
      description: "Split based on document structure (headings, sections, tables)"
      best_for: ["PDF", "HTML", "Markdown"]
    sentence_window:
      description: "Embed individual sentences but retrieve surrounding context"
      window_size: "3-5 sentences"

