identity:
  tagline: "Strategies for splitting documents into optimal retrieval units"
  description: |
    Chunking is the process of breaking documents into smaller pieces that can be
    independently embedded and retrieved. The choice of chunking strategy directly impacts
    retrieval quality, as it determines what unit of information the system can find and return.

    There is no single best chunking method. The optimal strategy depends on document structure,
    query patterns, embedding model capabilities, and downstream task requirements. A legal
    contract needs different chunking than a codebase or a conversation transcript.

    Modern chunking has evolved from simple fixed-size splitting to sophisticated approaches
    that understand document structure, semantic boundaries, and the relationship between
    chunks. The trend is toward adaptive chunking that considers both content and retrieval context.
  website: "https://docs.llamaindex.ai/en/stable/module_guides/loading/node_parsers/"
  documentation: "https://python.langchain.com/docs/concepts/text_splitters/"
  license: "N/A"
  pricing_model: "open_source"

