identity:
  tagline: "Content detection and extraction framework supporting over 1000 file formats"
  description: |
    Apache Tika is a mature, battle-tested toolkit for detecting and extracting metadata
    and text content from a vast range of document formats. Originally developed as an
    Apache Software Foundation project, Tika has been a cornerstone of content extraction
    in enterprise search and data processing systems for over 15 years.

    Tika supports over 1000 MIME types through its parser framework, which delegates to
    specialized libraries like Apache POI (Office formats), PDFBox (PDF), and Boilerpipe
    (HTML). It provides a unified API regardless of the underlying file format, making it
    ideal for systems that must handle heterogeneous document collections.

    Tika can run as an embedded Java library, a standalone command-line tool, or a REST
    server (tika-server). The REST server mode is particularly useful for non-Java
    applications and containerized deployments. While Tika excels at broad format coverage
    and reliable text extraction, it lacks the AI-powered layout detection capabilities
    of newer tools like Unstructured.io.
  logo_url: "/assets/modules/apache_tika.svg"
  website: "https://tika.apache.org"
  documentation: "https://tika.apache.org/3.0.0/index.html"
  github: "https://github.com/apache/tika"
  license: "Apache-2.0"
  pricing_model: "open_source"

