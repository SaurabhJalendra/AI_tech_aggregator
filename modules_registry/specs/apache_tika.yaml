comparison_dimensions:
  performance:
    score: 7
    justification: "Fast for text extraction from standard formats. PDF parsing via PDFBox is reliable. OCR adds latency but is optional. JVM startup time is a consideration for CLI usage."
  scalability:
    score: 8
    justification: "Tika server handles concurrent requests well. Can be horizontally scaled behind a load balancer. Proven in enterprise deployments processing millions of documents."
  ease_of_use:
    score: 6
    justification: "Java-centric with JVM dependency. REST server simplifies use from other languages. Configuration can be complex for advanced parsing scenarios. Python wrappers exist but are community-maintained."
  cost_efficiency:
    score: 10
    justification: "Fully open-source with no paid tier. No API costs. Runs on commodity hardware. The Apache Foundation ensures long-term project sustainability."
  community:
    score: 8
    justification: "Large, established Apache community. Used in major enterprise systems including Elasticsearch, Solr, and content management platforms. Regular releases since 2007."
  maturity:
    score: 10
    justification: "One of the most mature document extraction tools available. 17+ years of production use. Battle-tested in Fortune 500 companies and government agencies."
  flexibility:
    score: 7
    justification: "Supports the broadest range of formats of any extraction tool. Custom parsers can be added. However, output is basic text/metadata without AI-enhanced structure."
  data_privacy:
    score: 10
    justification: "Runs entirely on-premises with zero external calls. No telemetry, no cloud dependency. Full control over data processing."

knowledge:
  entries:
    - topic: "Architecture Overview"
      content: |
        Apache Tika's architecture consists of four main components:

        1. Detector: Identifies the MIME type of a file using magic bytes, file extension,
        and content analysis. The composite detector chains multiple detection strategies.

        2. Parser: Extracts text and metadata from detected file types. Tika delegates to
        format-specific parsers (PDFBox for PDF, POI for Office, etc.) through a unified
        Parser interface. The AutoDetectParser automatically selects the right parser.

        3. Language Detector: Identifies the language of extracted text using statistical
        models. Supports 70+ languages.

        4. Translator: Optional machine translation of extracted text (requires external
        translation service configuration).

        The tika-server module wraps these components in a JAX-RS REST API, exposing
        endpoints for /tika (text extraction), /meta (metadata), /detect (MIME type),
        and /unpack (extract embedded files).
      tags: ["architecture", "internals"]

    - topic: "When to Choose Apache Tika"
      content: |
        Apache Tika is the right choice when:

        1. You need the broadest possible format coverage. No other tool matches Tika's
        1000+ format support. If your pipeline must handle obscure formats like CAD
        files, legacy Office formats, or archive types, Tika is often the only option.

        2. You need a zero-cost, fully on-premises solution. Tika has no paid tier, no
        API limits, and no cloud dependency.

        3. You're building on Java/JVM infrastructure. Tika integrates natively with the
        Java ecosystem including Elasticsearch, Solr, and Hadoop.

        4. Reliability and maturity matter more than AI-enhanced extraction. Tika's parsers
        are thoroughly tested across millions of real-world documents.

        Tika is NOT the right choice when: you need AI-powered layout detection for complex
        PDFs (use Unstructured.io), you want structured elements rather than flat text
        (use Unstructured.io or Docling), or you need a lightweight Python-native solution
        without JVM dependency (use pdfplumber or PyMuPDF).
      tags: ["decision", "comparison"]

    - topic: "Using Tika Server with Docker"
      content: |
        The easiest way to use Tika from non-Java applications is via tika-server in Docker:

        docker run -p 9998:9998 apache/tika:latest

        This exposes REST endpoints at http://localhost:9998. Key endpoints:

        PUT /tika - Extract text from a document (send file as request body)
        PUT /meta - Extract metadata only
        PUT /detect/stream - Detect MIME type
        PUT /unpack/all - Extract embedded files from archives/emails
        PUT /rmeta - Recursive metadata extraction (processes embedded documents)

        The /rmeta endpoint is particularly useful for email processing, where it extracts
        text and metadata from the email body and all attachments in a single call.

        Headers control behavior: Accept (output format), Content-Type (input format hint),
        X-Tika-OCRLanguage (OCR language), X-Tika-PDFOcrStrategy (when to OCR PDFs).
      tags: ["deployment", "docker", "api"]

    - topic: "PDF Processing Options"
      content: |
        Tika provides fine-grained control over PDF processing through PDFBox configuration:

        1. Text extraction strategies: Tika can extract text from PDFs using the text layer
        (fast, accurate for digital PDFs) or OCR (necessary for scanned documents).

        2. The PDFOcrStrategy header controls OCR behavior:
           - NO_OCR: Never use OCR (fastest, text layer only)
           - OCR_ONLY: Always OCR every page (for scanned documents)
           - OCR_AND_TEXT_EXTRACTION: Extract text layer and OCR, merge results
           - AUTO: Use OCR only when text layer yields insufficient content

        3. Table extraction is limited compared to modern tools. Tika extracts table text
        but doesn't preserve structure. For structured table extraction, consider
        complementing Tika with a specialized tool.

        4. Image extraction: Tika can extract embedded images from PDFs. The /unpack
        endpoint returns images as separate parts of the response.
      tags: ["pdf", "ocr", "configuration"]

code_examples:
  - title: "Python Client with Tika Server"
    language: "python"
    code: |
      import requests

      TIKA_URL = "http://localhost:9998"

      # Extract text from a PDF
      with open("document.pdf", "rb") as f:
          response = requests.put(
              f"{TIKA_URL}/tika",
              data=f.read(),
              headers={"Accept": "text/plain"}
          )
      text = response.text

      # Extract metadata
      with open("document.pdf", "rb") as f:
          response = requests.put(
              f"{TIKA_URL}/meta",
              data=f.read(),
              headers={"Accept": "application/json"}
          )
      metadata = response.json()

  - title: "Recursive Metadata for Emails"
    language: "python"
    code: |
      import requests

      TIKA_URL = "http://localhost:9998"

      # Extract text and metadata from email + attachments
      with open("message.eml", "rb") as f:
          response = requests.put(
              f"{TIKA_URL}/rmeta/text",
              data=f.read(),
              headers={"Accept": "application/json"}
          )

      documents = response.json()
      # First element is the email body, rest are attachments
      for doc in documents:
          print(f"Type: {doc.get('Content-Type')}")
          print(f"Content: {doc.get('X-TIKA:content', '')[:200]}")

  - title: "LangChain Integration"
    language: "python"
    code: |
      from langchain_community.document_loaders import (
          UnstructuredFileLoader,
      )

      # Using Tika via tika-python wrapper
      import tika
      from tika import parser

      tika.initVM()

      parsed = parser.from_file("report.docx")
      text = parsed["content"]
      metadata = parsed["metadata"]

      # Or use LangChain's built-in support
      from langchain_community.document_loaders import TikaLoader

      loader = TikaLoader(
          "report.docx",
          tika_server_url="http://localhost:9998"
      )
      documents = loader.load()

