identity:
  tagline: "Ultra-fast LLM inference powered by custom LPU hardware"
  description: |
    Groq provides the fastest LLM inference available through its custom-designed
    Language Processing Unit (LPU) hardware. The LPU is purpose-built for the
    sequential nature of language model inference, achieving token generation
    speeds of 500+ tokens/second for models like Llama 3 70B.

    Groq offers an OpenAI-compatible API that serves popular open-source models
    including Llama 3, Mixtral, and Gemma. The service is known for its extremely
    low latency and high throughput, making it ideal for real-time applications,
    agent systems that make many LLM calls, and interactive experiences where
    response speed matters.

    The trade-off is that Groq only serves a curated set of open-source models
    and does not support custom or fine-tuned models. It competes on speed and
    cost rather than model selection.
  logo_url: "/assets/modules/groq_inference.svg"
  website: "https://groq.com"
  documentation: "https://console.groq.com/docs"
  github: "https://github.com/groq"
  license: "Proprietary"
  pricing_model: "freemium"

