  data_privacy:
    score: 5
    justification: "Cloud-only service. Data processed on Groq hardware. No self-hosted option."

knowledge:
  entries:
    - topic: "When Speed Matters Most"
      content: |
        Groq's primary advantage is inference speed. This matters most in:

        1. Agent systems that chain multiple LLM calls. An agent making 10 sequential
        LLM calls benefits enormously from 5x faster inference, turning a 30-second
        workflow into a 6-second one.

        2. Interactive applications where perceived latency affects user experience.
        Chat applications feel dramatically more responsive with Groq's speed.

        3. Batch processing at scale where faster inference means lower total
        compute time and cost.

        4. Real-time applications like voice assistants where the LLM is in the
        critical path between user input and response.

        Speed matters less when: the LLM call is not on the critical path, quality
        differences between models are significant, or you need specific commercial
        models not available on Groq.
      tags: ["speed", "use-cases", "decision"]

    - topic: "Groq vs Other Inference Providers"
      content: |
        Groq competes with several inference providers:

        vs Together AI / Anyscale: These offer more model selection and custom
        model hosting. Groq is faster but less flexible.

        vs OpenAI / Anthropic: These offer proprietary frontier models with
        stronger capabilities. Groq serves open-source models faster and cheaper.

        vs Self-hosted vLLM: Self-hosting gives full control and model selection.
        Groq is faster for supported models without infrastructure management.

        The winning strategy for many teams is to use Groq for speed-sensitive
        open-source model calls while using OpenAI/Anthropic for tasks requiring
        frontier model capabilities.
      tags: ["comparison", "providers"]

code_examples:
  - title: "Basic Chat Completion"
    language: "python"
    code: |
      from groq import Groq

      client = Groq(api_key="your-api-key")

      response = client.chat.completions.create(
          model="llama-3.1-70b-versatile",
          messages=[
              {"role": "system", "content": "You are a helpful assistant."},
              {"role": "user", "content": "Explain vector databases in 3 sentences."}
          ],
          temperature=0.7,
          max_tokens=256
      )

      print(response.choices[0].message.content)

  - title: "OpenAI-Compatible Usage with LangChain"
    language: "python"
    code: |
      from langchain_groq import ChatGroq

      llm = ChatGroq(
          model="llama-3.1-70b-versatile",
          temperature=0,
          api_key="your-api-key"
      )

      # Drop-in replacement for any LangChain LLM
      response = llm.invoke("What is retrieval-augmented generation?")
      print(response.content)

