identity:
  tagline: "Parameter-efficient fine-tuning methods that enable LLM customization on consumer-grade hardware"
  description: |
    LoRA (Low-Rank Adaptation) and QLoRA (Quantized LoRA) are parameter-efficient
    fine-tuning (PEFT) methods that dramatically reduce the compute and memory
    requirements for adapting large language models to specific tasks. Instead of
    updating all model parameters, LoRA adds small trainable rank-decomposition
    matrices to the model's attention layers while keeping the original weights frozen.

    LoRA works by decomposing the weight update matrix into two low-rank matrices
    (A and B), where the rank r is typically 8-64. For a weight matrix of dimension
    d x d, instead of training d^2 parameters, LoRA trains only 2 x d x r parameters.
    For a 70B model with r=16, this means training roughly 0.1% of the total parameters.

    QLoRA extends LoRA by quantizing the frozen base model to 4-bit precision using
    NormalFloat4 (NF4) quantization, while keeping the LoRA adapters in higher
    precision (BF16). This enables fine-tuning a 70B model on a single 48GB GPU --
    a task that would otherwise require 8x 80GB GPUs with full fine-tuning.

    These methods have become the standard approach for LLM fine-tuning in production,
    offering 90-95% of full fine-tuning quality at a fraction of the cost. The trained
    adapters are small (typically 10-100MB), can be dynamically loaded and swapped at
    inference time, and multiple adapters can be served simultaneously on a single
    base model instance.
