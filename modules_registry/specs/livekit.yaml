identity:
  tagline: "Open-source real-time communication platform for building voice and video AI applications"
  description: |
    LiveKit is an open-source WebRTC-based platform for building real-time audio and video
    applications. It provides a scalable Selective Forwarding Unit (SFU) server, client SDKs
    for every major platform, and a growing suite of AI integrations that make it the backbone
    of modern voice AI agent architectures.

    The LiveKit Agents framework is purpose-built for creating AI-powered voice and multimodal
    agents. It handles the complexities of real-time audio streaming, voice activity detection,
    speech-to-text, LLM processing, and text-to-speech in a unified pipeline. Developers can
    compose agents from pluggable components including Whisper, Deepgram, ElevenLabs, OpenAI,
    and Anthropic.

    LiveKit can be self-hosted or used via LiveKit Cloud, their managed offering. The platform
    handles the hard problems of real-time communication including NAT traversal, adaptive
    bitrate, echo cancellation, and global edge networking, letting developers focus on
    building application logic rather than infrastructure.
  logo_url: "/assets/modules/livekit.svg"
  website: "https://livekit.io"
  documentation: "https://docs.livekit.io"
  github: "https://github.com/livekit/livekit"
  license: "Apache-2.0"
  pricing_model: "freemium"

