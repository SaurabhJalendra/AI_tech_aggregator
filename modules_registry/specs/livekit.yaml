knowledge:
  entries:
    - topic: "Agent Framework Architecture"
      content: |
        The LiveKit Agents framework provides a structured way to build voice AI agents. The
        core abstraction is the VoicePipelineAgent, which orchestrates:

        1. Voice Activity Detection (VAD): Silero VAD detects when the user starts and stops
        speaking, enabling natural turn-taking.

        2. Speech-to-Text (STT): Converts user speech to text using configurable providers
        (Whisper, Deepgram, Google, Azure).

        3. LLM Processing: Routes transcribed text to an LLM (OpenAI, Anthropic, or any
        OpenAI-compatible API) for generating a response.

        4. Text-to-Speech (TTS): Converts the LLM response back to speech using providers
        like ElevenLabs, OpenAI TTS, or Cartesia.

        The pipeline handles interruption (barge-in), where the user can interrupt the agent
        mid-sentence. It manages audio buffering, cancellation of in-progress TTS, and
        seamless resumption of the conversation.

        Agents are deployed as worker processes that connect to a LiveKit server. When a user
        joins a room, the agent is automatically dispatched. Multiple agents can serve
        different rooms concurrently.
      tags: ["agents", "architecture", "voice-pipeline"]

    - topic: "When to Choose LiveKit"
      content: |
        LiveKit is the right choice when:

        1. You're building a voice AI agent that needs real-time, low-latency communication.
        LiveKit handles the hardest part (real-time audio transport) so you can focus on
        the AI logic.

        2. You need cross-platform support. LiveKit's SDKs cover web, iOS, Android, Flutter,
        Unity, and more, all connecting to the same server.

        3. You want to self-host for data privacy. The Apache-2.0 licensed server runs
        anywhere and gives you complete control over data flow.

        4. You need telephony integration. LiveKit's SIP support lets AI agents answer
        phone calls, enabling automated customer service and outbound calling.

        5. You're building multimodal AI (voice + video + data). LiveKit handles all three
        in a single platform with consistent APIs.

        LiveKit may NOT be the right choice when: you only need simple audio file
        transcription (use Whisper directly), you need a simple chatbot without voice
        (use a standard chat API), or you're building a traditional video conferencing
        product where established solutions like Twilio may be more appropriate.
      tags: ["decision", "comparison"]

    - topic: "SIP and Telephony Integration"
      content: |
        LiveKit's SIP integration enables AI agents to participate in phone calls. This
        is critical for enterprise use cases like automated customer service, appointment
        scheduling, and outbound sales calls.

        The SIP bridge connects traditional phone networks (PSTN) to LiveKit rooms. When
        a phone call arrives via a SIP trunk, LiveKit creates a room and dispatches an AI
        agent. The agent processes audio through the standard voice pipeline (STT -> LLM ->
        TTS) while the caller experiences a natural phone conversation.

        Setup requires: a SIP trunk provider (Twilio, Telnyx, Vonage), configuration of
        inbound/outbound SIP rules in LiveKit, and an agent worker to handle calls.

        Key telephony considerations: PSTN audio is narrowband (8kHz), which affects STT
        accuracy. Use STT models optimized for telephony audio. Also handle DTMF tones for
        cases where callers need to press buttons. LiveKit provides DTMF event handling
        through data channels.
      tags: ["sip", "telephony", "enterprise"]

    - topic: "Deployment and Scaling"
      content: |
        LiveKit server can be deployed in several configurations:

        Single Node: Suitable for development and small deployments. Run the livekit-server
        binary directly or via Docker. Handles hundreds of concurrent participants.

        Multi-Node with Redis: For horizontal scaling, multiple LiveKit servers share state
        via Redis. Rooms are distributed across servers, and participants in the same room
        are routed to the same node. This scales to thousands of concurrent rooms.

        LiveKit Cloud: Managed offering with global edge network across 12+ regions.
        Automatic scaling, monitoring, and SLA guarantees. Recommended for production
        workloads unless self-hosting is required.

        Agent workers are deployed separately from the SFU. They connect to the LiveKit
        server as clients and can be scaled independently based on the number of concurrent
        agent conversations. Each agent worker typically handles one conversation at a time
        (though this depends on GPU resources for local STT/TTS).

        For GPU-intensive workloads (running Whisper locally), deploy agent workers on
        GPU instances. For API-based STT/TTS (Deepgram, ElevenLabs), CPU instances suffice.
      tags: ["deployment", "scaling", "infrastructure"]

code_examples:
  - title: "Voice AI Agent"
    language: "python"
    code: |
      from livekit.agents import AutoSubscribe, JobContext, WorkerOptions, cli
      from livekit.agents.voice_assistant import VoiceAssistant
      from livekit.plugins import openai, silero, elevenlabs

      async def entrypoint(ctx: JobContext):
          await ctx.connect(auto_subscribe=AutoSubscribe.AUDIO_ONLY)

          assistant = VoiceAssistant(
              vad=silero.VAD.load(),
              stt=openai.STT(model="whisper-1"),
              llm=openai.LLM(model="gpt-4o"),
              tts=elevenlabs.TTS(voice_id="JBFqnCBsd6RMkjVDRZzb"),
          )

          assistant.start(ctx.room)
          await assistant.say("Hello! How can I help you today?")

      if __name__ == "__main__":
          cli.run_app(WorkerOptions(entrypoint_fnc=entrypoint))

  - title: "Room Management"
    language: "python"
    code: |
      from livekit import api

      # Create LiveKit API client
      lk_api = api.LiveKitAPI(
          url="https://my-livekit-server.com",
          api_key="your-api-key",
          api_secret="your-api-secret"
      )

      # Create a room
      room = await lk_api.room.create_room(
          api.CreateRoomRequest(name="my-room", empty_timeout=600)
      )

      # Generate access token for a participant
      token = api.AccessToken(api_key="key", api_secret="secret")
      token.with_identity("user-123")
      token.with_name("John")
      token.with_grants(api.VideoGrants(room_join=True, room="my-room"))

      jwt = token.to_jwt()

  - title: "SIP Inbound Call Handler"
    language: "python"
    code: |
      from livekit.agents import AutoSubscribe, JobContext, WorkerOptions, cli
      from livekit.agents.voice_assistant import VoiceAssistant
      from livekit.plugins import deepgram, openai, cartesia, silero

      async def entrypoint(ctx: JobContext):
          await ctx.connect(auto_subscribe=AutoSubscribe.AUDIO_ONLY)

          # Configure for telephony audio quality
          assistant = VoiceAssistant(
              vad=silero.VAD.load(),
              stt=deepgram.STT(model="nova-2-phonecall"),
              llm=openai.LLM(
                  model="gpt-4o",
                  system_prompt="You are a helpful customer service agent."
              ),
              tts=cartesia.TTS(voice_id="telephony-optimized"),
          )

          assistant.start(ctx.room)
          await assistant.say(
              "Thank you for calling. How may I assist you?"
          )

      if __name__ == "__main__":
          cli.run_app(WorkerOptions(entrypoint_fnc=entrypoint))

