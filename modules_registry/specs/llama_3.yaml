knowledge:
  entries:
  - topic: When to choose Meta Llama 3
    content: 'Choose Meta Llama 3 when your architecture needs on-prem llm

      and you can accept tradeoffs: Ops burden for self-host.

      Pair with retrieval and evaluation modules; use cloud_api entries only

      when the decision is specifically about API routing, billing, or VPC — not

      model family selection.'
    tags:
    - model-selection
    - architecture
    - foundation_model
  - topic: Meta Llama 3 vs alternatives
    content: 'Compare against mistral_large, mixtral, qwen at the foundation_model
      layer only.

      Do not compare to inference hosts (groq_inference), local runners (ollama),
      or

      provider APIs (openai) in the same shortlist — the advisor enforces layer separation.'
    tags:
    - comparison
    - trade-offs
