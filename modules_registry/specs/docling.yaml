identity:
  tagline: "IBM's open-source document parsing library for AI pipelines"
  description: |
    Docling is an open-source document parsing library developed by IBM Research
    that converts PDFs, DOCX, PPTX, HTML, and other document formats into
    structured representations suitable for AI applications. It uses advanced
    layout analysis and OCR to understand document structure including tables,
    figures, headers, and reading order.

    Docling's key differentiator is its deep understanding of document layout.
    It uses a combination of ML models for page layout analysis, table structure
    recognition, and OCR to produce accurate structured output. The result is a
    rich document representation that preserves semantic structure, making it
    ideal for downstream RAG chunking and retrieval.

    The library integrates with LangChain and LlamaIndex through document loaders,
    and can export to multiple formats including markdown, JSON, and Docling's
    native document format.
  logo_url: "/assets/modules/docling.svg"
  website: "https://ds4sd.github.io/docling/"
  documentation: "https://ds4sd.github.io/docling/"
  github: "https://github.com/DS4SD/docling"
  license: "MIT"
  pricing_model: "open_source"

