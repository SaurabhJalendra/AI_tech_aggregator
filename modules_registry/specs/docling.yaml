knowledge:
  entries:
    - topic: "Docling vs Unstructured.io"
      content: |
        Docling and Unstructured.io both handle document parsing for AI applications
        but take different approaches:

        Docling focuses on deep layout understanding using ML models (DocLayNet for
        layout, TableFormer for tables). It excels at preserving document structure
        and produces high-quality output from complex documents with tables, figures,
        and multi-column layouts. It is fully open-source with no cloud dependency.

        Unstructured.io offers broader format support and a managed cloud API. It
        has a larger ecosystem of integrations and can handle more document types
        out of the box. However, its open-source version has more limited capabilities
        compared to the paid API.

        Choose Docling when: document quality matters most, you need accurate table
        extraction, you want fully local processing, or you're working with complex
        PDF layouts. Choose Unstructured when: you need the broadest format support,
        want a managed service, or need enterprise features like data connectors.
      tags: ["comparison", "unstructured"]

    - topic: "Table Extraction"
      content: |
        Docling's table extraction is one of its strongest features. It uses the
        TableFormer model to recognize table structures in documents, identifying
        rows, columns, merged cells, and headers.

        The extracted tables are represented as structured data with cell content,
        row/column spans, and header indicators. This is far more accurate than
        naive approaches that try to parse tables from raw text extraction.

        For RAG applications, properly extracted tables are crucial because tables
        contain dense information that is often lost or garbled by simpler parsing
        methods. Docling preserves table structure in its markdown output using
        markdown table syntax, making it directly usable as LLM context.
      tags: ["tables", "extraction", "feature"]

code_examples:
  - title: "Basic Document Parsing"
    language: "python"
    code: |
      from docling.document_converter import DocumentConverter

      converter = DocumentConverter()

      # Convert a PDF to structured document
      result = converter.convert("path/to/document.pdf")

      # Export as markdown
      markdown = result.document.export_to_markdown()
      print(markdown)

      # Access structured elements
      for table in result.document.tables:
          print(f"Table: {table.export_to_dataframe()}")

  - title: "LangChain Integration"
    language: "python"
    code: |
      from langchain_community.document_loaders import DoclingLoader
      from langchain.text_splitter import RecursiveCharacterTextSplitter

      # Load and parse documents
      loader = DoclingLoader(file_path="path/to/document.pdf")
      docs = loader.load()

      # Split for RAG
      splitter = RecursiveCharacterTextSplitter(
          chunk_size=1000,
          chunk_overlap=200
      )
      chunks = splitter.split_documents(docs)

      print(f"Parsed {len(docs)} pages into {len(chunks)} chunks")

  - title: "Batch Processing"
    language: "python"
    code: |
      from docling.document_converter import DocumentConverter
      from pathlib import Path

      converter = DocumentConverter()

      # Process multiple documents
      pdf_files = list(Path("docs_folder").glob("*.pdf"))
      results = converter.convert_all(pdf_files)

      for result in results:
          md = result.document.export_to_markdown()
          output_path = Path(result.input.file).with_suffix(".md")
          output_path.write_text(md)

