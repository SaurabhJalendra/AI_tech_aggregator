identity:
  tagline: "Graph database with vector search for knowledge graphs and AI applications"
  description: |
    Neo4j is the leading graph database, widely used for knowledge graphs,
    recommendation engines, and network analysis. With the addition of native
    vector search capabilities, Neo4j enables hybrid retrieval combining graph
    traversal with vector similarity search, making it powerful for advanced
    RAG architectures.

    Neo4j stores data as nodes and relationships with properties, queried using
    the Cypher query language. The vector index support allows storing embeddings
    on nodes and performing approximate nearest neighbor search alongside graph
    queries, enabling GraphRAG patterns where knowledge graphs enhance LLM context.

    Neo4j is available as a managed cloud service (Aura), self-hosted community
    edition, or enterprise on-premises deployment. It has deep integrations with
    LangChain and LlamaIndex for building graph-enhanced AI applications.
  logo_url: "/assets/modules/neo4j.svg"
  website: "https://neo4j.com"
  documentation: "https://neo4j.com/docs/"
  github: "https://github.com/neo4j/neo4j"
  license: "GPL-3.0 (Community) / Commercial (Enterprise)"
  pricing_model: "freemium"

