knowledge:
  entries:
    - topic: "GraphRAG with Neo4j"
      content: |
        GraphRAG uses knowledge graphs to enhance RAG retrieval beyond simple
        vector similarity. Neo4j enables several GraphRAG patterns:

        1. Entity-based retrieval: Extract entities from the query, find them in
        the knowledge graph, and retrieve connected context through graph traversal.

        2. Hybrid vector+graph search: Use vector search to find relevant nodes,
        then expand context by traversing relationships to related entities.

        3. Community-based summarization: Use graph algorithms to identify
        communities of related entities, pre-compute summaries, and use them
        for high-level question answering.

        4. Path-based reasoning: Find shortest paths between entities to answer
        multi-hop questions that pure vector search cannot handle.

        GraphRAG excels at questions involving relationships, multi-hop reasoning,
        and structured knowledge. It complements rather than replaces traditional
        vector-based RAG.
      tags: ["graphrag", "rag", "knowledge-graph"]

    - topic: "Building Knowledge Graphs from Documents"
      content: |
        A common workflow is extracting knowledge graphs from unstructured documents:

        1. Parse documents into text chunks.
        2. Use an LLM to extract entities and relationships from each chunk.
        3. Resolve entity duplicates and merge into a unified graph in Neo4j.
        4. Optionally generate embeddings for nodes to enable hybrid search.

        LangChain provides LLMGraphTransformer for automated entity extraction,
        and Neo4jGraph for storing the results. LlamaIndex has PropertyGraphIndex
        for a similar workflow.

        Key challenges: entity resolution (merging "IBM" and "International Business
        Machines"), relationship normalization, and handling extraction errors.
        Quality depends heavily on the LLM used for extraction and the complexity
        of the source documents.
      tags: ["construction", "extraction", "workflow"]

code_examples:
  - title: "Vector Search with Cypher"
    language: "python"
    code: |
      from neo4j import GraphDatabase

      driver = GraphDatabase.driver("bolt://localhost:7687", auth=("neo4j", "password"))

      with driver.session() as session:
          # Create vector index
          session.run("""
              CREATE VECTOR INDEX doc_embeddings IF NOT EXISTS
              FOR (d:Document) ON (d.embedding)
              OPTIONS {indexConfig: {
                  `vector.dimensions`: 1536,
                  `vector.similarity_function`: 'cosine'
              }}
          """)

          # Vector search
          result = session.run("""
              CALL db.index.vector.queryNodes('doc_embeddings', 5, $query_vector)
              YIELD node, score
              RETURN node.title AS title, node.text AS text, score
          """, query_vector=query_embedding)

          for record in result:
              print(f"{record['title']} (score: {record['score']:.3f})")

  - title: "LangChain GraphRAG"
    language: "python"
    code: |
      from langchain_community.graphs import Neo4jGraph
      from langchain.chains import GraphCypherQAChain
      from langchain_openai import ChatOpenAI

      graph = Neo4jGraph(
          url="bolt://localhost:7687",
          username="neo4j",
          password="password"
      )

      chain = GraphCypherQAChain.from_llm(
          ChatOpenAI(model="gpt-4o", temperature=0),
          graph=graph,
          verbose=True
      )

      result = chain.invoke({"query": "What companies are connected to AI research?"})

