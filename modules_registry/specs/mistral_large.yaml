identity:
  tagline: Mistral's flagship proprietary-class model with European hosting options
  description: 'Mistral Large is a foundation model family in the Mistral ecosystem,
    catalogued

    for architecture decisions at the generation step of AI pipelines. This module
    covers

    model capabilities, context, modalities, deployment fit, and trade-offs — not
    API vendor

    integration (see cloud_api modules such as openai or google_gemini for that layer).


    Strengths: Strong multilingual, EU provider, Competitive reasoning.

    Tradeoffs: Smaller ecosystem than US hyperscalers.'
  logo_url: /assets/modules/mistral_large.svg
  website: https://mistral.ai
  documentation: https://docs.mistral.ai
  github: https://github.com/mistralai/client-python
  license: Mistral AI License
  pricing_model: paid
