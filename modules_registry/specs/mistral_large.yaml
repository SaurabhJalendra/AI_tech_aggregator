knowledge:
  entries:
  - topic: When to choose Mistral Large
    content: 'Choose Mistral Large when your architecture needs eu data residency

      and you can accept tradeoffs: Smaller ecosystem than US hyperscalers.

      Pair with retrieval and evaluation modules; use cloud_api entries only

      when the decision is specifically about API routing, billing, or VPC — not

      model family selection.'
    tags:
    - model-selection
    - architecture
    - foundation_model
  - topic: Mistral Large vs alternatives
    content: 'Compare against mixtral, claude_sonnet, gpt4_1 at the foundation_model
      layer only.

      Do not compare to inference hosts (groq_inference), local runners (ollama),
      or

      provider APIs (openai) in the same shortlist — the advisor enforces layer separation.'
    tags:
    - comparison
    - trade-offs
