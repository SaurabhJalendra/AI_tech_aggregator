identity:
  tagline: "Open-source semantic caching library for LLM applications to reduce cost and latency"
  description: |
    GPTCache is an open-source library that provides semantic caching for LLM API calls.
    It stores LLM responses and serves them for semantically similar future queries, reducing
    both API costs and response latency. GPTCache achieves this by embedding queries and
    comparing them against previously cached query-response pairs using vector similarity.

    The library is modular, with pluggable components for embedding generation, vector storage,
    similarity evaluation, and cache management. It supports multiple embedding backends
    (OpenAI, ONNX, Hugging Face), multiple storage backends (SQLite+FAISS, Redis, PostgreSQL,
    Milvus), and configurable similarity thresholds.

    GPTCache integrates with OpenAI, LangChain, and other LLM frameworks through adapter
    patterns that intercept API calls and check the cache before making external requests.
    This makes it a drop-in optimization for existing LLM applications.

    Developed by Zilliz (the team behind Milvus), GPTCache has seen strong adoption in
    cost-sensitive LLM deployments, particularly for chatbots, Q&A systems, and applications
    with repetitive query patterns.
  logo_url: "/assets/modules/gptcache.svg"
  website: "https://gptcache.readthedocs.io/"
  documentation: "https://gptcache.readthedocs.io/"
  github: "https://github.com/zilliztech/GPTCache"
  license: "MIT"
  pricing_model: "open_source"

