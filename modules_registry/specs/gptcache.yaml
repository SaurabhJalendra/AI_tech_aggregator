knowledge:
  entries:
    - topic: "Architecture Overview"
      content: |
        GPTCache has a modular architecture with four core components:

        1. Pre-processor: Extracts and normalizes the query from the LLM request. For chat
        completions, it extracts the last user message. Custom pre-processors can include
        conversation context.

        2. Embedding Generator: Converts the extracted query into a vector embedding. The
        default ONNX backend runs locally without external API calls. OpenAI and Hugging Face
        backends are also supported.

        3. Cache Manager: Combines a scalar store (for query/response text, metadata) with
        a vector store (for embeddings). The default is SQLite + FAISS. Production deployments
        typically use Redis or Milvus.

        4. Similarity Evaluator: Determines whether a cache hit is similar enough to return.
        The default ONNX evaluator uses a trained model to assess semantic similarity. Custom
        evaluators can implement domain-specific similarity logic.

        The flow: request arrives -> pre-processor extracts query -> embedding generated ->
        vector search in cache -> if similarity > threshold, return cached response ->
        otherwise, forward to LLM, cache the response, and return it.
      tags: ["architecture", "components"]

    - topic: "Configuration and Tuning"
      content: |
        Key configuration parameters for optimal GPTCache performance:

        Similarity threshold: Controls when a cache hit is returned. Default is model-based
        evaluation. For cosine similarity, start with 0.90 and adjust based on accuracy
        monitoring. Lower thresholds increase hit rate but risk incorrect responses.

        Embedding model: The default ONNX model is fast and runs locally but has lower
        quality than OpenAI or sentence-transformers embeddings. For production, consider
        using the same embedding model as your application to ensure consistent semantics.

        Cache size and eviction: Configure maximum cache size based on available storage.
        GPTCache supports LRU (least recently used) eviction. For time-sensitive applications,
        set TTL (time-to-live) on cache entries.

        Pre-processing: For multi-turn conversations, configure the pre-processor to include
        relevant conversation history in the cache key. Without this, the cache only considers
        the last message, which may be ambiguous without context.

        Storage backend: Use SQLite + FAISS for development and testing. Switch to Redis or
        Milvus for production deployments that need persistence, scalability, and TTL support.
      tags: ["configuration", "tuning", "best-practices"]

    - topic: "Integration Patterns"
      content: |
        GPTCache provides adapter patterns for common LLM frameworks:

        OpenAI adapter: Replace `openai.ChatCompletion.create` with the GPTCache-wrapped
        version. The adapter intercepts calls, checks the cache, and only forwards to OpenAI
        on cache misses. This is the simplest integration path.

        LangChain adapter: GPTCache can be used as a LangChain cache backend via the
        `GPTCache` class in `langchain.cache`. Set it globally with `set_llm_cache()` or
        per-chain.

        Custom adapter: For other frameworks, use GPTCache's core API directly. Call
        `cache.get()` before your LLM call and `cache.put()` after receiving the response.

        Multi-model caching: GPTCache supports caching across different LLM models. A response
        from GPT-4 can be served for a similar query even if the current request targets
        GPT-4o, if configured to do so. This is useful during model migrations.

        Streaming support: GPTCache can cache and replay streaming responses, maintaining
        the streaming experience for the user even on cache hits.
      tags: ["integration", "patterns"]

    - topic: "Limitations and Considerations"
      content: |
        Important limitations to consider:

        1. Multi-turn conversation caching is challenging. The same question ("Can you explain
        more?") has different meanings depending on conversation context. The pre-processor
        must include relevant context in the cache key.

        2. Personalized responses cannot be cached across users. If the LLM response depends
        on user-specific context (preferences, history), the cache must be scoped per user.

        3. Cache warming is not automatic. New topics or query patterns will always miss the
        cache until they've been seen at least once.

        4. Embedding quality directly affects cache accuracy. Low-quality embeddings produce
        more false hits and misses. Invest in a good embedding model for the cache.

        5. Cache size management requires planning. Each entry stores an embedding vector
        plus the response text. For large-scale deployments, storage costs and eviction
        policies need attention.

        6. No built-in cache invalidation for content changes. If your knowledge base changes,
        you must manually invalidate relevant cache entries or implement custom invalidation logic.
      tags: ["limitations", "considerations"]

code_examples:
  - title: "Basic GPTCache with OpenAI"
    language: "python"
    code: |
      from gptcache import Cache
      from gptcache.adapter import openai
      from gptcache.embedding import Onnx
      from gptcache.manager import manager_factory
      from gptcache.similarity_evaluation import OnnxModelEvaluation

      # Initialize cache
      cache = Cache()
      onnx = Onnx()

      data_manager = manager_factory(
          "sqlite,faiss",
          vector_params={"dimension": onnx.dimension}
      )

      cache.init(
          embedding_func=onnx.to_embeddings,
          data_manager=data_manager,
          similarity_evaluation=OnnxModelEvaluation()
      )

      # Use the cached OpenAI adapter
      response = openai.ChatCompletion.create(
          model="gpt-4o",
          messages=[
              {"role": "user", "content": "What is machine learning?"}
          ],
          cache_obj=cache
      )
      print(response["choices"][0]["message"]["content"])

  - title: "GPTCache with Redis Backend"
    language: "python"
    code: |
      from gptcache import Cache
      from gptcache.embedding import OpenAI as OpenAIEmbedding
      from gptcache.manager import manager_factory
      from gptcache.similarity_evaluation import OnnxModelEvaluation

      cache = Cache()

      # Use OpenAI embeddings for higher quality
      embedding = OpenAIEmbedding(model="text-embedding-3-small")

      # Redis backend for production
      data_manager = manager_factory(
          "redis,redis_vector",
          scalar_config={"url": "redis://localhost:6379"},
          vector_config={
              "url": "redis://localhost:6379",
              "dimension": embedding.dimension
          }
      )

      cache.init(
          embedding_func=embedding.to_embeddings,
          data_manager=data_manager,
          similarity_evaluation=OnnxModelEvaluation()
      )

  - title: "GPTCache with LangChain"
    language: "python"
    code: |
      from langchain.cache import GPTCache
      from langchain.globals import set_llm_cache
      from langchain_openai import ChatOpenAI
      from gptcache import Cache
      from gptcache.embedding import Onnx
      from gptcache.manager import manager_factory
      from gptcache.similarity_evaluation import OnnxModelEvaluation

      def init_gptcache(cache_obj: Cache, llm: str):
          onnx = Onnx()
          data_manager = manager_factory(
              "sqlite,faiss",
              vector_params={"dimension": onnx.dimension}
          )
          cache_obj.init(
              embedding_func=onnx.to_embeddings,
              data_manager=data_manager,
              similarity_evaluation=OnnxModelEvaluation()
          )

      # Set as global LangChain cache
      set_llm_cache(GPTCache(init_gptcache))

      llm = ChatOpenAI(model="gpt-4o")

      # First call - cache miss
      result1 = llm.invoke("Explain transformers in AI")

      # Second call - cache hit (semantically similar)
      result2 = llm.invoke("What are transformer models in artificial intelligence?")

