identity:
  tagline: "Turn any website into LLM-ready markdown or structured data"
  description: |
    Firecrawl is a web scraping and crawling API designed specifically for AI
    and LLM applications. It converts web pages into clean markdown or structured
    data, handling JavaScript rendering, anti-bot protections, and content
    extraction automatically. Unlike traditional scraping tools, Firecrawl is
    optimized for producing output that works well as context for language models.

    Firecrawl offers three main capabilities: scraping individual pages, crawling
    entire websites, and mapping site structures. The scrape endpoint converts
    a single URL to markdown. The crawl endpoint follows links to scrape multiple
    pages from a domain. The map endpoint discovers all URLs on a site without
    extracting content.

    The service can be used as a cloud API or self-hosted via the open-source
    repository. It has become a key component in RAG pipelines where web content
    needs to be ingested as a knowledge source.
  logo_url: "/assets/modules/firecrawl.svg"
  website: "https://firecrawl.dev"
  documentation: "https://docs.firecrawl.dev"
  github: "https://github.com/mendableai/firecrawl"
  license: "AGPL-3.0"
  pricing_model: "freemium"

