knowledge:
  entries:
    - topic: "Firecrawl vs Traditional Scraping Tools"
      content: |
        Traditional web scraping tools like BeautifulSoup, Scrapy, or Puppeteer require
        significant custom code for each website. You need to write selectors, handle
        pagination, manage JavaScript rendering, and clean HTML into usable text.

        Firecrawl abstracts all of this. A single API call with a URL returns clean
        markdown. It handles: JavaScript-rendered content (SPAs, dynamic pages),
        cookie banners and popups, navigation and footer removal, content prioritization,
        and anti-bot protections.

        For AI applications, the markdown output is particularly valuable because it
        preserves document structure (headings, lists, tables) while removing visual
        noise. This structure helps LLMs understand the content hierarchy and improves
        RAG retrieval quality.

        The trade-off is control: Firecrawl's automatic extraction works well for
        most pages but may miss content or include irrelevant sections on unusual
        page layouts. For these cases, custom scraping with targeted selectors
        may still be necessary.
      tags: ["comparison", "scraping"]

    - topic: "Building a RAG Knowledge Base from Websites"
      content: |
        A common pattern is using Firecrawl to build a RAG knowledge base from
        documentation sites or company wikis. The workflow is:

        1. Use the map endpoint to discover all URLs on the target site.
        2. Filter URLs to include only relevant pages (e.g., /docs/ paths).
        3. Use the crawl endpoint to scrape all filtered pages.
        4. Split the markdown output into chunks using a text splitter.
        5. Generate embeddings and store in a vector database.

        Firecrawl's LangChain integration (FireCrawlLoader) simplifies this by
        directly returning LangChain Document objects that can be passed to a
        text splitter and vector store.

        For keeping the knowledge base current, you can set up periodic re-crawls
        and use content hashing to detect changes, only re-embedding pages that
        have been updated.
      tags: ["rag", "knowledge-base", "workflow"]

code_examples:
  - title: "Scrape a Single Page"
    language: "python"
    code: |
      from firecrawl import FirecrawlApp

      app = FirecrawlApp(api_key="your-api-key")

      # Scrape a page to markdown
      result = app.scrape_url(
          "https://docs.example.com/getting-started",
          params={"formats": ["markdown"]}
      )

      print(result["markdown"])

  - title: "Crawl an Entire Documentation Site"
    language: "python"
    code: |
      from firecrawl import FirecrawlApp

      app = FirecrawlApp(api_key="your-api-key")

      # Crawl with filters
      crawl_result = app.crawl_url(
          "https://docs.example.com",
          params={
              "limit": 100,
              "includePaths": ["/docs/*"],
              "excludePaths": ["/blog/*", "/changelog/*"],
              "maxDepth": 3
          },
          poll_interval=5
      )

      for page in crawl_result["data"]:
          print(f"URL: {page['metadata']['sourceURL']}")
          print(f"Content length: {len(page['markdown'])} chars")

  - title: "LangChain Integration for RAG"
    language: "python"
    code: |
      from langchain_community.document_loaders import FireCrawlLoader
      from langchain.text_splitter import RecursiveCharacterTextSplitter
      from langchain_openai import OpenAIEmbeddings
      from langchain_pinecone import PineconeVectorStore

      # Load documents from website
      loader = FireCrawlLoader(
          url="https://docs.example.com",
          mode="crawl",
          params={"limit": 50}
      )
      docs = loader.load()

      # Split and embed
      splitter = RecursiveCharacterTextSplitter(chunk_size=1000, chunk_overlap=200)
      chunks = splitter.split_documents(docs)

      vectorstore = PineconeVectorStore.from_documents(
          chunks,
          OpenAIEmbeddings(model="text-embedding-3-small"),
          index_name="knowledge-base"
      )

