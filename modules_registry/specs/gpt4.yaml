identity:
  tagline: "OpenAI's frontier model family with the broadest ecosystem and fine-tuning support"
  description: |
    GPT-4 is OpenAI's family of frontier large language models, including GPT-4o,
    GPT-4o-mini, and GPT-4 Turbo. These models power the largest deployed AI
    application ecosystem in the world and set many of the de facto standards for
    LLM API design, tool calling conventions, and structured output formats.

    GPT-4o is OpenAI's flagship multimodal model, natively processing text, images,
    and audio. It offers strong performance across reasoning, coding, creative tasks,
    and multilingual applications. GPT-4o-mini provides a cost-efficient tier for
    simpler tasks, while GPT-4 Turbo offers extended context at a premium.

    A key differentiator for GPT-4 in production systems is fine-tuning support.
    Organizations can fine-tune GPT-4o and GPT-4o-mini on their own data, enabling
    domain-specific behavior, consistent output formatting, and reduced prompt
    engineering complexity. Combined with the broadest third-party integration
    ecosystem of any LLM, GPT-4 remains the default choice for many teams.

    OpenAI's API also provides assistants, threads, file search, and code interpreter
    capabilities, offering managed stateful agent infrastructure alongside the core
    completion API.
