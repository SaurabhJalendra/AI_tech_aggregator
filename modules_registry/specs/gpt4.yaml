knowledge:
  entries:
    - topic: "GPT-4o vs GPT-4o-mini: Choosing the Right Tier"
      content: |
        GPT-4o and GPT-4o-mini share the same API interface but differ significantly
        in capability and cost:

        GPT-4o: Use for tasks requiring strong reasoning, nuanced understanding, complex
        code generation, or multimodal analysis. Input cost is approximately 5x higher
        than mini. Ideal for customer-facing applications where quality directly impacts
        user experience, complex RAG pipelines, and agentic workflows.

        GPT-4o-mini: Use for high-throughput tasks where speed and cost matter more
        than peak reasoning ability. Excellent for classification, entity extraction,
        simple summarization, query routing, and any task where you've validated that
        mini's quality is sufficient. Fine-tuning mini for specific tasks often matches
        or exceeds base GPT-4o performance at a fraction of the cost.

        Decision framework: Start with GPT-4o-mini and measure quality on your specific
        task. If quality is insufficient, try few-shot prompting with mini before
        upgrading to GPT-4o. If you need GPT-4o quality at mini prices, fine-tuning
        mini on task-specific examples is often the best path.
      tags: ["model-selection", "cost", "architecture"]

    - topic: "Fine-Tuning GPT-4 Models"
      content: |
        GPT-4o and GPT-4o-mini support fine-tuning, which is a significant advantage
        for production applications. Fine-tuning allows you to:

        1. Teach consistent output formatting without lengthy system prompts
        2. Encode domain-specific knowledge and terminology
        3. Improve performance on specialized tasks beyond what prompting achieves
        4. Reduce prompt length (and cost) by baking instructions into the model

        Best practices: Start with at least 50-100 high-quality training examples.
        Quality matters more than quantity. Use validation splits to detect overfitting.
        Fine-tune mini first -- it's cheaper and often sufficient.

        Common fine-tuning use cases: structured extraction from domain-specific
        documents, consistent brand voice for content generation, specialized code
        generation for internal frameworks, and classification tasks with nuanced
        categories.

        Limitations: Fine-tuning adjusts behavior but doesn't add new factual
        knowledge reliably. For domain knowledge, combine fine-tuning with RAG.
        Fine-tuned models have the same rate limits and context windows as base
        models.
      tags: ["fine-tuning", "customization", "production"]

    - topic: "Structured Outputs and Function Calling"
      content: |
        GPT-4 models support two complementary features for reliable structured output:

        Structured Outputs: Guarantees that the model's response conforms to a provided
        JSON schema. Unlike basic JSON mode, structured outputs are schema-validated at
        the token generation level, ensuring 100% compliance. Use this for extraction
        tasks, API response generation, and any scenario where downstream code expects
        a specific shape.

        Function Calling: Allows the model to indicate it wants to call external tools
        by generating structured arguments matching a function schema. The model does
        not execute the function -- your application handles execution and returns
        results. Supports parallel function calls for efficiency.

        Design tip: Prefer structured outputs when you need a specific data format.
        Use function calling when the model needs to decide which actions to take.
        They can be combined: use function calling for the agentic loop and structured
        outputs for the final response format.
      tags: ["structured-output", "function-calling", "tool-use"]

    - topic: "Azure OpenAI vs Direct API"
      content: |
        OpenAI models are available through both the direct OpenAI API and Azure
        OpenAI Service. The choice affects architecture, compliance, and operations:

        Direct OpenAI API: Faster access to newest models, simpler setup, usage-based
        billing only. Best for startups, prototyping, and applications without strict
        compliance requirements.

        Azure OpenAI: Models deployed in your Azure region with VPC isolation. Offers
        HIPAA, FedRAMP, SOC2 compliance. Supports managed identity, private endpoints,
        and content filtering policies. Provisioned throughput units (PTUs) provide
        guaranteed capacity for latency-sensitive workloads. Best for enterprises with
        existing Azure infrastructure and regulatory requirements.

        The API interfaces are nearly identical. Most SDKs and frameworks support
        both with a configuration change. Plan for Azure from the start if compliance
        is likely to become a requirement.
      tags: ["azure", "deployment", "compliance", "enterprise"]

    - topic: "Limitations and Considerations"
      content: |
        Key limitations when building with GPT-4:

        1. Context window is 128K tokens, smaller than Claude (200K) and Gemini (2M).
        For very long document analysis, consider chunking or switching models.

        2. Knowledge cutoff means no awareness of recent events. Use function calling
        or RAG to provide current information.

        3. No self-hosted option. For air-gapped or fully on-premises requirements,
        consider Llama or Mistral open-source models.

        4. Rate limits can be constraining for high-throughput applications. Azure
        PTUs or batch API help but add complexity and cost.

        5. Pricing for GPT-4o is higher than Claude Sonnet or Gemini Flash for
        comparable tasks. Benchmark cost-per-quality on your specific workload.

        6. Fine-tuning costs include training time and higher per-token inference
        costs compared to the base model. Ensure the quality improvement justifies
        the investment.
      tags: ["limitations", "trade-offs"]

code_examples:
  - title: "Structured Output Extraction"
    language: "python"
    code: |
      from openai import OpenAI
      from pydantic import BaseModel

      client = OpenAI()

      class Invoice(BaseModel):
          vendor: str
          amount: float
          currency: str
          date: str
          line_items: list[dict]

      response = client.beta.chat.completions.parse(
          model="gpt-4o-2024-11-20",
          messages=[
              {"role": "system", "content": "Extract invoice data from the text."},
              {"role": "user", "content": invoice_text}
          ],
          response_format=Invoice,
      )

      invoice = response.choices[0].message.parsed
      print(f"Vendor: {invoice.vendor}, Amount: {invoice.amount} {invoice.currency}")

  - title: "Fine-Tuning Workflow"
    language: "python"
    code: |
      from openai import OpenAI

      client = OpenAI()

      # Upload training data (JSONL format)
      training_file = client.files.create(
          file=open("training_data.jsonl", "rb"),
          purpose="fine-tune"
      )

      # Create fine-tuning job
      job = client.fine_tuning.jobs.create(
          training_file=training_file.id,
          model="gpt-4o-mini-2024-07-18",
          hyperparameters={"n_epochs": 3}
      )

      # Monitor progress
      events = client.fine_tuning.jobs.list_events(
          fine_tuning_job_id=job.id, limit=10
      )
      for event in events.data:
          print(f"{event.created_at}: {event.message}")

      # Use fine-tuned model
      response = client.chat.completions.create(
          model=job.fine_tuned_model,
          messages=[{"role": "user", "content": "Extract entities from this text..."}]
      )

  - title: "Parallel Function Calling Agent"
    language: "python"
    code: |
      from openai import OpenAI
      import json

      client = OpenAI()
      tools = [
          {
              "type": "function",
              "function": {
                  "name": "get_weather",
                  "description": "Get weather for a city",
                  "parameters": {
                      "type": "object",
                      "properties": {"city": {"type": "string"}},
                      "required": ["city"]
                  }
              }
          },
          {
              "type": "function",
              "function": {
                  "name": "get_stock_price",
                  "description": "Get current stock price",
                  "parameters": {
                      "type": "object",
                      "properties": {"symbol": {"type": "string"}},
                      "required": ["symbol"]
                  }
              }
          }
      ]

      messages = [{"role": "user", "content": "Weather in NYC and AAPL price?"}]
      response = client.chat.completions.create(
          model="gpt-4o", tools=tools, messages=messages
      )

      # Process parallel tool calls
      tool_calls = response.choices[0].message.tool_calls
      messages.append(response.choices[0].message)
      for tc in tool_calls:
          result = execute_function(tc.function.name, json.loads(tc.function.arguments))
          messages.append({"role": "tool", "tool_call_id": tc.id, "content": result})

