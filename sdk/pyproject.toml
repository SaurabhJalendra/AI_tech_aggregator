[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-advisor-sdk"
version = "0.1.0"
description = "Python SDK for the AI Infrastructure Advisor API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.25.0"]

[project.optional-dependencies]
dev = ["pytest", "pytest-httpx"]
